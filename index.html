e is the noise at night."},{"c":"Small talk","q":"Did you sleep well last night? You look a bit tired.","es":"¿Dormiste bien anoche? Pareces un poco cansado.","t":["past_simple","past_continuous"],"p":["I tossed and turned (di vueltas en la cama)","I couldn't switch off","to be running on empty (ir sin energía)"],"m":"Not really. I tossed and turned all night because I couldn't switch off after work, so I'm running on empty today."},{"c":"Small talk","q":"What's the best thing that has happened to you this week?","es":"¿Qué es lo mejor que te ha pasado esta semana?","t":["present_perfect","past_simple"],"p":["it made my day","out of the blue (de repente)","I was over the moon (muy feliz)"],"m":"An old friend called me out of the blue and invited me to his wedding. It really made my day."},{"c":"Small talk","q":"Do you usually cook at home or do you eat out more often?","es":"¿Sueles cocinar en casa o comes fuera más a menudo?","t":["present_simple"],"p":["on weeknights (entre semana)","to treat myself (darme un capricho)","it depends on…"],"m":"I usually cook at home on weeknights because it's healthier and cheaper, but I treat myself to dinner out on Fridays."},{"c":"Small talk","q":"Have you watched anything good recently?","es":"¿Has visto algo bueno últimamente?","t":["present_perfect","past_simple"],"p":["I binge-watched… (vi de un tirón)","it's worth watching","it really grew on me (me fue gustando)"],"m":"I've just finished a Spanish thriller series. I binge-watched it in two days, and it's definitely worth watching."},{"c":"Small talk","q":"What did you have for lunch today?","es":"¿Qué comiste hoy?","t":["past_simple"],"p":["I grabbed something quick","leftovers (sobras)","I skipped lunch"],"m":"I just grabbed a sandwich because I had a meeting at two, so I didn't have time for a proper lunch."},{"c":"Elevator","q":"Which floor are you on? I don't think we've met.","es":"¿A qué piso vas? Creo que no nos conocemos.","t":["present_simple","present_perfect"],"p":["I've just moved in","nice to finally meet you","I'm on the fifth floor"],"m":"I'm on the fifth floor. I've just moved in, so I don't know many people yet. Nice to finally meet you."},{"c":"Elevator","q":"Have you noticed the elevator keeps breaking down lately?","es":"¿Has notado que el ascensor se estropea mucho últimamente?","t":["present_perfect","present_simple"],"p":["it's been acting up (dando problemas)","someone should report it","I'd rather take the stairs"],"m":"Yes, it's been acting up for weeks. I think someone should report it to the building manager, because I'd rather not get stuck."},{"c":"Elevator","q":"Are you heading out or coming back?","es":"¿Vas saliendo o vuelves?","t":["present_continuous"],"p":["I'm heading out to…","I'm running late","just popping out (salgo un momento)"],"m":"I'm heading out to the supermarket. I'm just popping out to get a few things before it closes."},{"c":"Elevator","q":"Did you hear the noise from the apartment upstairs last night?","es":"¿Oíste el ruido del piso de arriba anoche?","t":["past_simple","past_continuous"],"p":["they were throwing a party","it kept me up (no me dejó dormir)","to let it slide (dejarlo pasar)"],"m":"I did! I think they were throwing a party. It kept me up until two, but I decided to let it slide this time."},{"c":"Work","q":"What do you do for a living, and how did you end up in that job?","es":"¿A qué te dedicas y cómo acabaste en ese trabajo?","t":["present_simple","past_simple"],"p":["I ended up… (acabé…)","by chance","it wasn't my first choice"],"m":"I work in marketing. Honestly, I ended up there by chance: I studied economics, but I did an internship in a marketing team and I loved it."},{"c":"Work","q":"What are you working on at the moment?","es":"¿En qué estás trabajando ahora mismo?","t":["present_continuous","present_simple","present_perfect_continuous"],"p":["I'm in charge of…","we're on a tight deadline (plazo ajustado)","it's quite challenging"],"m":"I'm in charge of a new project for a client, and we're on a tight deadline, so it's quite challenging."},{"c":"Work","q":"How did your meeting go this morning?","es":"¿Cómo te fue la reunión esta mañana?","t":["past_simple"],"p":["it went better than expected","we didn't reach an agreement","it dragged on (se alargó)"],"m":"It went better than expected, although it dragged on for two hours and we didn't reach a final agreement."},{"c":"Work","q":"What would you change about your job if you could?","es":"¿Qué cambiarías de tu trabajo si pudieras?","t":["conditional"],"p":["I would cut down on…","work-life balance","flexible hours"],"m":"I would cut down on meetings and I would have more flexible hours, because my work-life balance isn't great right now."},{"c":"Work","q":"Have you ever had a really difficult boss? What happened?","es":"¿Has tenido alguna vez un jefe muy difícil? ¿Qué pasó?","t":["present_perfect","past_simple"],"p":["he was a micromanager","we didn't see eye to eye (no coincidíamos)","in the end"],"m":"Yes, I have. My first boss was a micromanager and we didn't see eye to eye on anything, so in the end I changed departments."},{"c":"Work","q":"Where do you see yourself in five years?","es":"¿Dónde te ves dentro de cinco años?","t":["future_will","future_going","future_continuous"],"p":["I'll probably be…","I'm aiming to… (aspiro a)","ideally"],"m":"Ideally, I'll be leading a small team. I'm aiming to get a promotion within the next two years, so I'm going to take a management course."},{"c":"Work","q":"Are you working from home today or going into the office?","es":"¿Trabajas hoy desde casa o vas a la oficina?","t":["present_continuous","present_simple"],"p":["hybrid schedule","I'm going in on…","it saves me a long commute"],"m":"I'm working from home today. We have a hybrid schedule, so I only go into the office on Tuesdays and Thursdays."},{"c":"Work","q":"What is the most useful thing you have learned at work?","es":"¿Qué es lo más útil que has aprendido en el trabajo?","t":["present_perfect"],"p":["to prioritize","to speak up (decir lo que piensas)","it has made a huge difference"],"m":"I have learned to prioritize and to speak up in meetings. It has made a huge difference to my confidence."},{"c":"Study","q":"What are you studying at the moment, and why did you choose it?","es":"¿Qué estás estudiando ahora y por qué lo elegiste?","t":["present_continuous","past_simple"],"p":["I've always been drawn to… (me atrae)","job prospects","it was a tough decision"],"m":"I'm studying English to reach a C1 level. I chose it because it will open more doors for my career, and I've always been drawn to languages."},{"c":"Study","q":"How do you usually prepare for an important exam?","es":"¿Cómo te preparas normalmente para un examen importante?","t":["present_simple"],"p":["I make a study plan","I cram the night before (estudio a última hora)","past papers (exámenes anteriores)"],"m":"I usually make a study plan two weeks before, and I practice with past papers. I try not to cram the night before."},{"c":"Study","q":"What was your favorite subject at school, and who was your favorite teacher?","es":"¿Cuál era tu asignatura favorita en el colegio y quién era tu profesor favorito?","t":["past_simple"],"p":["she brought the subject to life","I was hooked (me enganché)","looking back (en retrospectiva)"],"m":"History was my favorite subject because my teacher brought it to life. Looking back, she was the reason I started reading so much."},{"c":"Study","q":"Had you studied English before you started this course?","es":"¿Habías estudiado inglés antes de empezar este curso?","t":["past_perfect","past_simple"],"p":["I had only learned grammar","I had never practiced speaking","that's why…"],"m":"Yes, I had studied it at school, but I had never practiced speaking, and that's why I still find conversations hard."},{"c":"Study","q":"What do you find hardest about speaking English?","es":"¿Qué es lo que más te cuesta al hablar inglés?","t":["present_simple"],"p":["I freeze up (me bloqueo)","I translate in my head","I lack fluency"],"m":"I understand almost everything I read, but I freeze up when I speak because I translate in my head first."},{"c":"Study","q":"If you could master any skill overnight, which one would it be?","es":"Si pudieras dominar cualquier habilidad de la noche a la mañana, ¿cuál sería?","t":["conditional"],"p":["I'd love to…","it would come in handy (me vendría bien)","without a doubt"],"m":"Without a doubt, I would choose to speak English fluently, because it would come in handy at work and when I travel."},{"c":"Study","q":"How are you going to improve your English this month?","es":"¿Cómo vas a mejorar tu inglés este mes?","t":["future_going","future_will"],"p":["I'm going to make a habit of…","consistently","step out of my comfort zone"],"m":"I'm going to make a habit of answering ten questions every day, and I'm going to step out of my comfort zone by speaking more."},{"c":"Travel","q":"Where did you go on your last holiday, and what was the highlight?","es":"¿Adónde fuiste en tus últimas vacaciones y qué fue lo mejor?","t":["past_simple"],"p":["the highlight was…","breathtaking views","off the beaten track (fuera de lo turístico)"],"m":"I went to Portugal. The highlight was a small village off the beaten track, where we had breathtaking views of the coast."},{"c":"Travel","q":"Have you ever had a disaster while traveling?","es":"¿Has tenido alguna vez un desastre viajando?","t":["present_perfect","past_simple","past_continuous"],"p":["it was a nightmare","we were stranded (nos quedamos tirados)","in hindsight (visto en retrospectiva)"],"m":"Yes, I have. Our flight was cancelled while we were waiting at the gate, and we were stranded in Paris for a night. In hindsight, it was quite funny."},{"c":"Travel","q":"What's the next place you're going to visit?","es":"¿Cuál es el próximo lugar que vas a visitar?","t":["future_going","present_continuous"],"p":["it's been on my bucket list (mi lista de deseos)","I've booked…","I can't wait"],"m":"I'm going to visit Japan next spring. It has been on my bucket list for years, and I've already booked the flights."},{"c":"Travel","q":"Do you prefer traveling alone or with other people? Why?","es":"¿Prefieres viajar solo o acompañado? ¿Por qué?","t":["present_simple"],"p":["I'm more of a… person","it gives me freedom","on the other hand"],"m":"I prefer traveling with friends because I enjoy sharing the experience. On the other hand, traveling alone gives you more freedom."},{"c":"Travel","q":"What were you doing when you realized you had lost your passport, keys or wallet?","es":"¿Qué estabas haciendo cuando te diste cuenta de que habías perdido el pasaporte, las llaves o la cartera?","t":["past_continuous","past_perfect"],"p":["my heart sank (se me cayó el alma)","I retraced my steps","it turned up (apareció)"],"m":"I was paying for dinner when I realized I had left my wallet at the hotel. My heart sank, but luckily my friend paid."},{"c":"Travel","q":"If you could live in another country for a year, where would you go?","es":"Si pudieras vivir en otro país un año, ¿adónde irías?","t":["conditional"],"p":["I'd jump at the chance","to immerse myself in…","it would be a game-changer"],"m":"I would go to Ireland, because I would immerse myself in English and it would be a game-changer for my career."},{"c":"Family","q":"How often do you see your family, and what do you usually do together?","es":"¿Con qué frecuencia ves a tu familia y qué soléis hacer juntos?","t":["present_simple"],"p":["we get together","every other weekend (fin de semana sí, fin de semana no)","family gatherings"],"m":"We get together every other weekend. We usually have a long lunch at my parents' house and end up chatting for hours."},{"c":"Family","q":"Who are you closest to in your family, and why?","es":"¿Con quién tienes más confianza en tu familia y por qué?","t":["present_simple"],"p":["we're very close","she has my back (me apoya)","we can talk about anything"],"m":"I'm closest to my older sister. She always has my back, and we can talk about anything without judging each other."},{"c":"Family","q":"What is a family tradition that you have kept since you were a child?","es":"¿Qué tradición familiar mantienes desde que eras niño?","t":["present_perfect","present_simple"],"p":["it's a tradition we've kept","it brings us together","every year without fail (sin falta)"],"m":"We have kept the tradition of making paella on New Year's Day. Every year without fail, the whole family cooks together."},{"c":"Family","q":"What did your parents teach you that you still use today?","es":"¿Qué te enseñaron tus padres que todavía usas hoy?","t":["past_simple","present_simple"],"p":["they instilled in me… (me inculcaron)","to stand on my own two feet (ser independiente)","I still live by that"],"m":"They taught me to stand on my own two feet and to work hard. I still live by that today."},{"c":"Family","q":"Is anyone in your family going through a big change right now?","es":"¿Alguien de tu familia está pasando por un gran cambio ahora?","t":["present_continuous","present_simple"],"p":["she's going through…","it's a big adjustment","we're supporting her"],"m":"Yes, my brother is moving abroad for work. It's a big adjustment for him, so we're supporting him as much as we can."},{"c":"Family","q":"How did your family celebrate the last birthday or holiday?","es":"¿Cómo celebró tu familia el último cumpleaños o fiesta?","t":["past_simple"],"p":["we threw a surprise party","it was a blast (fue genial)","we stayed up late"],"m":"We threw a surprise party for my grandmother's eightieth birthday. It was a blast, and we stayed up late telling old stories."},{"c":"Feelings","q":"How are you really feeling today, not just 'fine'?","es":"¿Cómo te sientes de verdad hoy, no solo 'bien'?","t":["present_simple","present_continuous"],"p":["a bit overwhelmed (agobiado)","I'm hanging in there (voy tirando)","on top of things (con todo bajo control)"],"m":"To be honest, I'm a bit overwhelmed because I have a lot on my plate, but I'm hanging in there."},{"c":"Feelings","q":"What usually stresses you out, and how do you deal with it?","es":"¿Qué te estresa normalmente y cómo lo manejas?","t":["present_simple"],"p":["it gets to me (me afecta)","to unwind (desconectar)","I try to keep things in perspective"],"m":"Deadlines usually stress me out. When it gets to me, I go for a run to unwind and try to keep things in perspective."},{"c":"Feelings","q":"When was the last time you felt really proud of yourself?","es":"¿Cuándo fue la última vez que te sentiste muy orgulloso de ti?","t":["past_simple"],"p":["it paid off (valió la pena)","I pushed myself","I couldn't believe it"],"m":"Last month I gave a presentation in English. I had pushed myself to practice every day, and it really paid off."},{"c":"Feelings","q":"What has been worrying you lately?","es":"¿Qué te ha estado preocupando últimamente?","t":["present_perfect_continuous","present_perfect"],"p":["it has been on my mind","I can't shake the feeling…","to overthink"],"m":"My job has been worrying me lately. It has been on my mind a lot, and I tend to overthink everything."},{"c":"Feelings","q":"What do you do when you feel unmotivated?","es":"¿Qué haces cuando te sientes desmotivado?","t":["present_simple"],"p":["I set small goals","to get back on track (volver al buen camino)","I remind myself why…"],"m":"I set small goals and remind myself why I started. That usually helps me get back on track."},{"c":"Feelings","q":"What would make you happier in your daily life?","es":"¿Qué te haría más feliz en tu día a día?","t":["conditional"],"p":["it would make a big difference","to have more time for…","less screen time"],"m":"Having more time for my hobbies would make a big difference, and I would also spend less time on my phone."},{"c":"Feelings","q":"Have you ever regretted a decision? What happened?","es":"¿Te has arrepentido alguna vez de una decisión? ¿Qué pasó?","t":["present_perfect","past_simple"],"p":["I regret not… (me arrepiento de no…)","I learned the hard way","if I had known…"],"m":"Yes, I have. I regret not studying abroad when I had the chance. I learned the hard way that opportunities don't always come back."},{"c":"Football","q":"Did you catch the game last night? What did you think?","es":"¿Viste el partido anoche? ¿Qué te pareció?","t":["past_simple"],"p":["they were all over the place (desorganizados)","a last-minute winner","they deserved to win"],"m":"I did! They were all over the place in the first half, but they scored a last-minute winner, so I can't complain."},{"c":"Football","q":"Who do you think will win the league this season, and why?","es":"¿Quién crees que ganará la liga esta temporada y por qué?","t":["future_will"],"p":["they're the favorites","strength in depth (buen banquillo)","it will go down to the wire (hasta el final)"],"m":"I think Madrid will win it because they have strength in depth, but it will probably go down to the wire."},{"c":"Football","q":"Have you ever been to a big match in a stadium? What was the atmosphere like?","es":"¿Has ido a un gran partido en un estadio? ¿Cómo era el ambiente?","t":["present_perfect","past_simple"],"p":["the atmosphere was electric","goosebumps (piel de gallina)","the crowd went wild"],"m":"Yes, I have been to a Champions League final. The atmosphere was electric and the crowd went wild when we scored."},{"c":"Football","q":"What was happening in the game when you turned on the TV?","es":"¿Qué estaba pasando en el partido cuando encendiste la tele?","t":["past_continuous"],"p":["they were already losing","the referee was showing a red card","I had missed…"],"m":"They were already losing one-nil, and the referee was showing a red card to our captain. I had missed the best part."},{"c":"Football","q":"If you were the coach of your team, what would you change?","es":"Si fueras el entrenador de tu equipo, ¿qué cambiarías?","t":["conditional"],"p":["I'd give the young players a chance","change the formation","to tighten up the defense"],"m":"I would change the formation and give the young players a chance, because the defense needs to tighten up."},{"c":"Football","q":"Do you play any sport yourself, or do you just watch?","es":"¿Practicas algún deporte o solo lo ves?","t":["present_simple"],"p":["I play five-a-side (fútbol sala)","to keep fit","I'm more of a spectator"],"m":"I play five-a-side with my colleagues every Wednesday to keep fit, but I'm more of a spectator, to be honest."},{"c":"Opinions","q":"What do you think about social media? Is it good or bad for us?","es":"¿Qué opinas de las redes sociales? ¿Son buenas o malas?","t":["present_simple"],"p":["it's a double-edged sword (arma de doble filo)","on the one hand… on the other hand…","it depends on how you use it"],"m":"I think it's a double-edged sword. On the one hand, it keeps us connected; on the other hand, it can be very addictive."},{"c":"Opinions","q":"Do you think working from home is better than working in an office?","es":"¿Crees que trabajar desde casa es mejor que en la oficina?","t":["present_simple"],"p":["it has its pros and cons","you save time on commuting","you miss out on…"],"m":"It has its pros and cons. You save a lot of time on commuting, but you miss out on the social side of work."},{"c":"Opinions","q":"How has technology changed the way people communicate?","es":"¿Cómo ha cambiado la tecnología la forma de comunicarnos?","t":["present_perfect"],"p":["it has made… easier","face-to-face","nowadays"],"m":"It has made communication faster, but I think people have lost some of the patience they had for face-to-face conversations."},{"c":"Opinions","q":"What will cities look like in thirty years?","es":"¿Cómo serán las ciudades dentro de treinta años?","t":["future_will"],"p":["there will be more…","self-driving cars","it's hard to predict"],"m":"It's hard to predict, but I think there will be more green spaces and fewer cars, because people will use public transport more."},{"c":"Opinions","q":"If you were in charge of your country for a day, what would you do?","es":"Si estuvieras al mando de tu país un día, ¿qué harías?","t":["conditional"],"p":["my first priority would be…","to invest in education","affordable housing"],"m":"My first priority would be affordable housing, and I would also invest more in education for young people."},{"c":"Opinions","q":"Is it better to have a well-paid job you don't enjoy or a job you love that pays less?","es":"¿Es mejor un trabajo bien pagado que no te gusta o uno que amas pero paga menos?","t":["present_simple","conditional"],"p":["at the end of the day","job satisfaction","I would rather… (preferiría)"],"m":"At the end of the day, I think job satisfaction matters more. I would rather earn less and enjoy what I do."},{"c":"Food","q":"What's your go-to meal when you're too tired to cook?","es":"¿Cuál es tu comida de emergencia cuando estás muy cansado para cocinar?","t":["present_simple"],"p":["my go-to is…","it takes ten minutes","comfort food"],"m":"My go-to is pasta with tomato sauce. It takes ten minutes, and it's my favorite comfort food."},{"c":"Food","q":"Have you ever tried a dish that you really didn't like?","es":"¿Has probado alguna vez un plato que no te gustó nada?","t":["present_perfect","past_simple"],"p":["it wasn't my cup of tea (no era lo mío)","an acquired taste (hay que acostumbrarse)","I couldn't finish it"],"m":"Yes, I have. I tried blue cheese once and it wasn't my cup of tea. I think it's an acquired taste."},{"c":"Food","q":"What are you going to have for dinner tonight?","es":"¿Qué vas a cenar esta noche?","t":["future_going","present_continuous"],"p":["I'm thinking of…","something light","I'll probably just…"],"m":"I'm going to have something light, probably a salad, because I had a big lunch."},{"c":"Food","q":"Can you recommend a good restaurant in your city?","es":"¿Puedes recomendar un buen restaurante en tu ciudad?","t":["present_simple","conditional"],"p":["you can't go wrong with…","it's a hidden gem (una joya escondida)","I'd recommend booking"],"m":"You can't go wrong with a small tapas bar near my house. It's a hidden gem, but I would recommend booking in advance."},{"c":"Routine","q":"What does a typical weekday look like for you?","es":"¿Cómo es un día normal entre semana para ti?","t":["present_simple"],"p":["first thing in the morning","I tend to…","by the time I get home…"],"m":"I get up at seven and check my emails first thing in the morning. I tend to work until six, and by the time I get home I'm exhausted."},{"c":"Routine","q":"What time did you wake up today, and how did your morning go?","es":"¿A qué hora te despertaste hoy y qué tal la mañana?","t":["past_simple"],"p":["I hit snooze (apagué la alarma)","it was a rush","I managed to…"],"m":"I woke up at seven, but I hit snooze twice, so it was a rush. I managed to catch the train just in time."},{"c":"Routine","q":"Is there a habit you're trying to build or break at the moment?","es":"¿Hay algún hábito que estés intentando crear o dejar ahora?","t":["present_continuous"],"p":["I'm trying to cut down on… (reducir)","to stick to it (mantenerlo)","so far, so good"],"m":"I'm trying to cut down on sugar and I'm trying to read before bed. So far, so good, but it's hard to stick to it."},{"c":"Routine","q":"What do you usually do to relax after a long day?","es":"¿Qué sueles hacer para relajarte después de un día largo?","t":["present_simple"],"p":["to wind down","I put my feet up (descanso)","it helps me clear my head"],"m":"I usually go for a walk and then put my feet up with a series. It helps me clear my head."},{"c":"Routine","q":"How many hours do you spend on your phone every day, and what would you like to change?","es":"¿Cuántas horas pasas con el móvil al día y qué te gustaría cambiar?","t":["present_simple","conditional"],"p":["way too many (demasiadas)","I'd like to…","mindless scrolling"],"m":"Way too many, probably four hours. I would like to spend less time on mindless scrolling and more time reading."},{"c":"Plans","q":"What are your plans for the holidays?","es":"¿Qué planes tienes para las vacaciones?","t":["future_going","present_continuous"],"p":["we're spending them at…","nothing fancy","I'm looking forward to… (tengo ganas de)"],"m":"We're spending them at my parents' house. Nothing fancy, but I'm looking forward to resting and eating well."},{"c":"Plans","q":"Is there anything you have always wanted to do but haven't done yet?","es":"¿Hay algo que siempre has querido hacer y aún no has hecho?","t":["present_perfect"],"p":["I've always wanted to…","I keep putting it off (lo sigo posponiendo)","one day"],"m":"I have always wanted to learn to surf, but I keep putting it off. One day I'll do it."},{"c":"Plans","q":"What will you do if it rains this weekend?","es":"¿Qué harás si llueve este fin de semana?","t":["future_will"],"p":["I'll stay in","plan B","a cozy day at home"],"m":"If it rains, I'll stay in and have a cozy day at home. I'll probably cook something and watch a movie."},{"c":"Plans","q":"Where do you think you'll be living ten years from now?","es":"¿Dónde crees que vivirás dentro de diez años?","t":["future_will","future_continuous"],"p":["I'll probably be living…","who knows","settle down (establecerse)"],"m":"Who knows? I'll probably be living in a smaller city, because I want to settle down somewhere quieter."},{"c":"Problems","q":"Have you ever had to complain about something in a shop or restaurant?","es":"¿Alguna vez has tenido que quejarte en una tienda o restaurante?","t":["present_perfect","past_simple"],"p":["I asked to speak to the manager","they gave me a refund","it wasn't up to standard (no estaba a la altura)"],"m":"Yes, I have. My food wasn't up to standard, so I politely complained and they gave me a discount."},{"c":"Problems","q":"What happened the last time your phone or computer stopped working?","es":"¿Qué pasó la última vez que se te estropeó el móvil o el ordenador?","t":["past_simple","past_continuous","past_perfect"],"p":["it crashed (se colgó)","I hadn't backed it up (no había hecho copia)","I lost everything"],"m":"My laptop crashed while I was writing a report, and I hadn't backed it up, so I lost two hours of work."},{"c":"Problems","q":"How would you handle a disagreement with a friend?","es":"¿Cómo manejarías un desacuerdo con un amigo?","t":["conditional"],"p":["I would talk it through (lo hablaría)","to clear the air (aclarar las cosas)","to see it from their point of view"],"m":"I would talk it through calmly and try to see it from their point of view, because clearing the air is always better."},{"c":"Problems","q":"Why were you late the last time you were late for something?","es":"¿Por qué llegaste tarde la última vez que llegaste tarde?","t":["past_simple","past_continuous","past_perfect"],"p":["I got stuck in traffic","I had lost track of time (perdí la noción del tiempo)","there was a delay"],"m":"I was late for a dinner because I had lost track of time at work, and then I got stuck in traffic."},{"c":"Experiences","q":"What is the bravest thing you have ever done?","es":"¿Qué es lo más valiente que has hecho?","t":["present_perfect","past_simple"],"p":["it took a lot of courage","I faced my fear of…","it was nerve-racking (muy estresante)"],"m":"The bravest thing I have ever done is move to another city alone. It took a lot of courage, but it was worth it."},{"c":"Experiences","q":"Tell me about a person who has had a big influence on your life.","es":"Háblame de una persona que ha influido mucho en tu vida.","t":["present_perfect","past_simple"],"p":["she has been a role model (modelo a seguir)","he always encouraged me","I look up to her (la admiro)"],"m":"My grandfather has had a huge influence on me. He always encouraged me to be curious, and I still look up to him."},{"c":"Experiences","q":"What were you like as a teenager?","es":"¿Cómo eras de adolescente?","t":["past_simple"],"p":["I was quite shy","I used to… (solía)","I've changed a lot since then"],"m":"I was quite shy and I used to spend hours playing guitar in my room. I have changed a lot since then."},{"c":"Experiences","q":"Had you ever spoken English with a native speaker before you traveled abroad?","es":"¿Habías hablado inglés con un nativo antes de viajar al extranjero?","t":["past_perfect"],"p":["I had never…","it was a reality check (un baño de realidad)","I realized that…"],"m":"No, I had never spoken with a native speaker before that trip. It was a reality check, because I realized that they speak much faster than in class."},{"c":"Hypothetical","q":"If you had a whole free day tomorrow, how would you spend it?","es":"Si mañana tuvieras un día entero libre, ¿cómo lo pasarías?","t":["conditional"],"p":["I'd sleep in (dormiría hasta tarde)","I'd treat myself to…","I wouldn't check my emails"],"m":"I would sleep in, have a long breakfast and then go to the beach. I wouldn't check my emails at all."},{"c":"Hypothetical","q":"What would you do if you found a wallet full of money on the street?","es":"¿Qué harías si encontraras una cartera llena de dinero en la calle?","t":["conditional"],"p":["I'd hand it in to the police (la entregaría)","it's the right thing to do","I'd try to find the owner"],"m":"I would try to find the owner, and if I couldn't, I would hand it in to the police. It's the right thing to do."},{"c":"Hypothetical","q":"If you could have dinner with any famous person, who would it be?","es":"Si pudieras cenar con cualquier persona famosa, ¿quién sería?","t":["conditional"],"p":["I'd love to pick their brain (aprender de ellos)","I'd ask them about…","it would be fascinating"],"m":"I would have dinner with a famous chef, because I would ask them about their recipes and it would be fascinating."},{"c":"Hypothetical","q":"If you didn't have to work, what would you do with your time?","es":"Si no tuvieras que trabajar, ¿qué harías con tu tiempo?","t":["conditional"],"p":["I'd devote myself to… (me dedicaría a)","volunteer","travel the world"],"m":"I would travel the world and I would volunteer in projects that help animals."},{"c":"Shopping","q":"What was the last thing you bought that you really loved?","es":"¿Qué fue lo último que compraste que te encantó?","t":["past_simple"],"p":["it was a bargain (una ganga)","it was worth every penny","I splurged on… (me di un capricho con)"],"m":"I splurged on a pair of running shoes. They were expensive, but they were worth every penny."},{"c":"Shopping","q":"Do you prefer shopping online or in stores?","es":"¿Prefieres comprar por internet o en tiendas?","t":["present_simple"],"p":["it's more convenient","I like to try things on (probármelas)","returns are a hassle (las devoluciones son un lío)"],"m":"I prefer shopping online because it's more convenient, but I buy clothes in stores because I like to try things on."},{"c":"Health","q":"What do you do to stay healthy?","es":"¿Qué haces para mantenerte sano?","t":["present_simple"],"p":["I try to eat a balanced diet","I work out (hago ejercicio)","I could do better (podría hacerlo mejor)"],"m":"I work out three times a week and I try to eat a balanced diet, although I could do better with sleep."},{"c":"Health","q":"When was the last time you were sick, and how did you get over it?","es":"¿Cuándo fue la última vez que estuviste enfermo y cómo te recuperaste?","t":["past_simple"],"p":["I came down with… (pillé)","I got over it (me recuperé)","I was off work for…"],"m":"I came down with the flu last winter. I was off work for a week, and I got over it with lots of rest and soup."},{"c":"Friends","q":"How did you meet your best friend?","es":"¿Cómo conociste a tu mejor amigo?","t":["past_simple"],"p":["we hit it off (conectamos)","we've been friends ever since","we were in the same class"],"m":"We met at university because we were in the same class. We hit it off immediately and we have been friends ever since."},{"c":"Friends","q":"What do you and your friends usually do when you hang out?","es":"¿Qué soléis hacer tus amigos y tú cuando quedáis?","t":["present_simple"],"p":["we hang out (quedamos)","we grab a drink","it's always a laugh (siempre nos reímos)"],"m":"We usually grab a drink and then have dinner somewhere. It's always a laugh, even when we don't do anything special."},{"c":"Friends","q":"Have you lost touch with any old friends? Why do you think it happened?","es":"¿Has perdido el contacto con algún amigo antiguo? ¿Por qué crees que pasó?","t":["present_perfect","past_simple"],"p":["we drifted apart (nos distanciamos)","life got in the way","we've reconnected"],"m":"Yes, I have lost touch with some school friends. We drifted apart when we moved to different cities, and life got in the way."},{"c":"Language","q":"Why do you want to reach a C1 level in English?","es":"¿Por qué quieres llegar a un nivel C1 de inglés?","t":["present_simple","future_will"],"p":["it will open doors","to express myself naturally","to feel confident"],"m":"I want to express myself naturally, not just understand. A C1 level will open doors at work, and I will feel more confident when I travel."},{"c":"Language","q":"What have you done this week to practice your English?","es":"¿Qué has hecho esta semana para practicar inglés?","t":["present_perfect"],"p":["I've been listening to podcasts","I've made an effort to…","not as much as I'd like"],"m":"I have listened to podcasts on my way to work, and I have made an effort to answer questions out loud every day."},{"c":"Language","q":"What was your first experience speaking English with someone, and how did it go?","es":"¿Cómo fue tu primera experiencia hablando inglés con alguien?","t":["past_simple"],"p":["I was so nervous that…","I got my point across (me hice entender)","it broke the ice"],"m":"I was so nervous that I forgot simple words, but I got my point across and the other person was really patient."},{"c":"Morning","q":"Walk me through your morning routine, from the moment your alarm goes off.","es":"Cuéntame tu rutina de la mañana desde que suena la alarma.","t":["present_simple"],"p":["as soon as my alarm goes off","the first thing I do is…","then / after that / once I've…"],"m":"As soon as my alarm goes off, I check my phone, which is a bad habit. Then I take a quick shower, get dressed and have breakfast before I head out."},{"c":"Morning","q":"Are you a morning person or a night owl?","es":"¿Eres de mañanas o noctámbulo?","t":["present_simple"],"p":["I'm definitely a night owl","I struggle to get up","I'm at my best in the…"],"m":"I'm definitely a night owl. I struggle to get up early, but I'm at my best late in the evening, when everything is quiet."},{"c":"Morning","q":"What did you have for breakfast this morning?","es":"¿Qué desayunaste esta mañana?","t":["past_simple"],"p":["I grabbed…","I skipped breakfast","on the go (sobre la marcha)"],"m":"I just grabbed a coffee and a piece of toast, because I was running late and had to eat on the go."},{"c":"Morning","q":"What usually makes you late in the morning?","es":"¿Qué suele hacerte llegar tarde por la mañana?","t":["present_simple"],"p":["I tend to hit snooze","I lose track of time","I can never find my keys"],"m":"I tend to hit snooze too many times, and I can never find my keys when I'm about to leave."},{"c":"Morning","q":"What time did you get up today, and how did you feel?","es":"¿A qué hora te levantaste hoy y cómo te sentiste?","t":["past_simple"],"p":["I felt groggy (atontado)","I woke up refreshed","I didn't want to get out of bed"],"m":"I got up at half past six, and honestly I felt a bit groggy because I had stayed up late watching a series."},{"c":"Morning","q":"If you could change one thing about your mornings, what would it be?","es":"Si pudieras cambiar una cosa de tus mañanas, ¿qué sería?","t":["conditional"],"p":["I would get up earlier","I'd have more time to…","I wouldn't check my phone"],"m":"I would get up thirty minutes earlier so that I could have breakfast calmly, and I wouldn't check my phone in bed."},{"c":"Commute","q":"How do you get to work or class, and how long does it take?","es":"¿Cómo vas al trabajo o a clase y cuánto tardas?","t":["present_simple"],"p":["it takes me about…","I take the… / I catch the…","door to door (puerta a puerta)"],"m":"I take the metro and then walk for ten minutes. It takes me about forty minutes door to door."},{"c":"Commute","q":"What do you usually do during your commute?","es":"¿Qué sueles hacer durante el trayecto?","t":["present_simple"],"p":["I listen to podcasts","I catch up on the news","I just zone out (desconecto)"],"m":"I usually listen to podcasts in English, and sometimes I just zone out and look out of the window."},{"c":"Commute","q":"Tell me about the worst journey to work you have ever had.","es":"Cuéntame el peor trayecto al trabajo que has tenido.","t":["past_simple","past_continuous","present_perfect"],"p":["the train broke down","I got stuck in traffic","by the time I got there…"],"m":"Once the train broke down while we were in a tunnel. We were stuck for an hour, and by the time I got to the office, the meeting had finished."},{"c":"Commute","q":"Would you rather live close to work in a small flat or far away in a big house?","es":"¿Preferirías vivir cerca del trabajo en un piso pequeño o lejos en una casa grande?","t":["conditional"],"p":["I'd rather…","it would save me…","the trade-off is… (la contrapartida es)"],"m":"I would rather live close to work, because it would save me a lot of time every day, even if the flat were small."},{"c":"Work day","q":"What does a typical day at work or university look like for you?","es":"¿Cómo es un día típico en el trabajo o la universidad?","t":["present_simple"],"p":["I start off by…","most of the day I…","I wrap up by… (termino)"],"m":"I start off by checking my emails, then I have a couple of meetings. Most of the afternoon I work on projects, and I wrap up around six."},{"c":"Work day","q":"What are you working on today?","es":"¿En qué estás trabajando hoy?","t":["present_continuous"],"p":["I'm finishing…","I'm dealing with…","I'm trying to get through… (sacar adelante)"],"m":"Today I'm finishing a report for my boss, and I'm also dealing with a lot of emails that I didn't answer yesterday."},{"c":"Work day","q":"What did you have for lunch at work, and who did you eat with?","es":"¿Qué comiste en el trabajo y con quién?","t":["past_simple"],"p":["I had lunch with…","we went to a place nearby","I ate at my desk"],"m":"I had lunch with two colleagues. We went to a small place nearby and had the menu of the day."},{"c":"Work day","q":"How do you feel at the end of a long working day?","es":"¿Cómo te sientes al final de un día largo de trabajo?","t":["present_simple"],"p":["I feel drained (agotado)","I just want to switch off","it depends on the day"],"m":"It depends on the day, but usually I feel drained and I just want to switch off and have a quiet dinner."},{"c":"Work day","q":"Have you finished everything you needed to do this week?","es":"¿Has terminado todo lo que tenías que hacer esta semana?","t":["present_perfect"],"p":["I haven't finished yet","I've managed to…","I'm a bit behind (voy un poco atrasado)"],"m":"Not yet. I have managed to finish the most urgent tasks, but I haven't answered all my emails, so I'm a bit behind."},{"c":"Home","q":"Who does the housework at your place, and how do you split the chores?","es":"¿Quién hace las tareas de casa y cómo os las repartís?","t":["present_simple"],"p":["we take turns","I'm in charge of…","I can't stand ironing"],"m":"We take turns. I'm usually in charge of cooking and doing the dishes, and my partner does the laundry because I can't stand ironing."},{"c":"Home","q":"What chores did you do last weekend?","es":"¿Qué tareas de casa hiciste el fin de semana pasado?","t":["past_simple"],"p":["I did the laundry","I vacuumed the whole flat","I finally tidied up…"],"m":"I did the laundry, vacuumed the whole flat and finally tidied up my wardrobe, which was a real mess."},{"c":"Home","q":"Which household chore do you hate the most, and why?","es":"¿Qué tarea doméstica odias más y por qué?","t":["present_simple"],"p":["it drives me crazy","it takes forever","I keep putting it off"],"m":"I hate cleaning the bathroom because it takes forever, so I keep putting it off until the weekend."},{"c":"Home","q":"Describe your home. What's your favorite spot in it?","es":"Describe tu casa. ¿Cuál es tu rincón favorito?","t":["present_simple"],"p":["it's quite cozy","my favorite spot is…","it gets a lot of light"],"m":"It's a small but cozy flat. My favorite spot is the sofa next to the window, because it gets a lot of light in the afternoon."},{"c":"Home","q":"Has anything broken down at home recently? What did you do?","es":"¿Se ha estropeado algo en casa últimamente? ¿Qué hiciste?","t":["present_perfect","past_simple"],"p":["it stopped working","I called a technician","I fixed it myself"],"m":"Yes, the washing machine has broken down twice this month. The first time I fixed it myself, but the second time I called a technician."},{"c":"Kitchen","q":"What did you cook for dinner last night?","es":"¿Qué cocinaste anoche para cenar?","t":["past_simple"],"p":["I made…","I just heated up leftovers","it turned out really well"],"m":"I made a vegetable soup and some grilled chicken. It turned out really well, so I've got leftovers for today."},{"c":"Kitchen","q":"Explain how you make one of your favorite dishes.","es":"Explica cómo preparas uno de tus platos favoritos.","t":["present_simple"],"p":["first, you… then…","let it simmer for…","season it with…"],"m":"First, I chop an onion and fry it in olive oil. Then I add tomatoes and garlic, and I let it simmer for twenty minutes before I add the pasta."},{"c":"Kitchen","q":"Do you plan your meals for the week or decide every day?","es":"¿Planificas las comidas de la semana o decides cada día?","t":["present_simple"],"p":["I do meal prep on Sundays","I decide on the spot (sobre la marcha)","it saves me time"],"m":"I usually do meal prep on Sundays because it saves me time, but on Fridays I decide on the spot or order in."},{"c":"Kitchen","q":"What are you going to have for dinner tonight?","es":"¿Qué vas a cenar esta noche?","t":["future_going","present_continuous"],"p":["I'm going to make…","I'll probably order in","something light"],"m":"I'm going to make an omelette with some salad, because I want something light after a big lunch."},{"c":"Errands","q":"How often do you do the grocery shopping, and where do you go?","es":"¿Con qué frecuencia haces la compra y adónde vas?","t":["present_simple"],"p":["once a week","I stock up on…","I pop into the corner shop (me paso por)"],"m":"I do a big shop once a week at the supermarket, and I pop into the corner shop when I run out of milk or bread."},{"c":"Errands","q":"What errands do you need to run this week?","es":"¿Qué recados tienes que hacer esta semana?","t":["present_simple","future_going"],"p":["I need to pick up…","I have to drop off…","I'm going to stop by…"],"m":"I need to pick up a parcel from the post office, and I'm going to stop by the pharmacy to get some medicine."},{"c":"Errands","q":"Have you ever had a problem when returning something to a shop?","es":"¿Has tenido algún problema al devolver algo en una tienda?","t":["present_perfect","past_simple"],"p":["they wouldn't give me a refund","I had lost the receipt","they offered me a voucher"],"m":"Yes, I have. I had lost the receipt, so they wouldn't give me a refund, but they offered me a voucher instead."},{"c":"Errands","q":"What was the last thing you bought online, and did it arrive on time?","es":"¿Qué fue lo último que compraste por internet y llegó a tiempo?","t":["past_simple"],"p":["it arrived a day late","it was exactly as described","I had to send it back"],"m":"I bought a pair of headphones. They arrived a day late, but they were exactly as described, so I was happy."},{"c":"Evening","q":"What do you usually do when you get home in the evening?","es":"¿Qué sueles hacer cuando llegas a casa por la tarde-noche?","t":["present_simple"],"p":["the first thing I do is…","I get changed","I unwind by…"],"m":"The first thing I do is get changed into comfy clothes. Then I make dinner and unwind by watching a series."},{"c":"Evening","q":"What time do you usually go to bed, and do you fall asleep easily?","es":"¿A qué hora te sueles acostar y te duermes con facilidad?","t":["present_simple"],"p":["I'm a light sleeper","I toss and turn","I drop off quickly (me quedo dormido rápido)"],"m":"I usually go to bed around midnight. I'm a light sleeper, so sometimes I toss and turn for a while before I drop off."},{"c":"Evening","q":"What were you doing yesterday at nine in the evening?","es":"¿Qué estabas haciendo ayer a las nueve de la noche?","t":["past_continuous"],"p":["I was having dinner","I was talking on the phone with…","I was just relaxing"],"m":"I was having dinner with my family, and we were talking about our plans for the holidays."},{"c":"Evening","q":"Do you have a routine before going to sleep?","es":"¿Tienes una rutina antes de dormir?","t":["present_simple"],"p":["I try to avoid screens","I read for a while","I set my alarm and…"],"m":"I try to avoid screens for half an hour, so I read for a while, set my alarm and turn off the lights around midnight."},{"c":"Weekend","q":"How is your weekend routine different from your weekday routine?","es":"¿En qué se diferencia tu rutina del fin de semana de la de entre semana?","t":["present_simple"],"p":["on weekends I sleep in","whereas during the week…","I take it easy (me lo tomo con calma)"],"m":"On weekends I sleep in and take it easy, whereas during the week I get up at seven and everything is a rush."},{"c":"Weekend","q":"What did you do last Sunday from morning to night?","es":"¿Qué hiciste el domingo pasado de la mañana a la noche?","t":["past_simple"],"p":["in th io","ex":"I was reluctant to accept the offer."},{"w":"looking forward","es":"con ganas de","ex":"I'm really looking forward to it."},{"w":"cozy","es":"acogedor","ex":"We found a cozy little café."},{"w":"awkward","es":"incómodo","ex":"There was an awkward silence."},{"w":"rewarding","es":"gratificante","ex":"Teaching is very rewarding."},{"w":"setback","es":"contratiempo","ex":"We had a small setback, but we fixed it."},{"w":"cope","es":"sobrellevar, arreglárselas","ex":"I don't know how she copes with so much stress."},{"w":"struggle","es":"costar, luchar","ex":"I struggle to wake up early."},{"w":"manage","es":"conseguir, lograr","ex":"I managed to finish on time."},{"w":"realize","es":"darse cuenta","ex":"I realized I had forgotten my keys."},{"w":"tend","es":"tender a, soler","ex":"I tend to eat late."},{"w":"afford","es":"permitirse","ex":"I can't afford a new car right now."},{"w":"approach","es":"enfoque; abordar","ex":"We need a different approach."},{"w":"issue","es":"asunto, problema","ex":"The main issue is the price."},{"w":"genuinely","es":"de verdad, sinceramente","ex":"I'm genuinely happy for you."},{"w":"barely","es":"apenas","ex":"I barely slept last night."},{"w":"eventually","es":"al final","ex":"Eventually, everything worked out."},{"w":"apparently","es":"por lo visto","ex":"Apparently, the shop is closing."},{"w":"definitely","es":"sin duda","ex":"I'll definitely come to your party."},{"w":"commute","es":"trayecto al trabajo","ex":"My commute takes forty minutes."},{"w":"deadline","es":"fecha límite","ex":"The deadline is on Friday."},{"w":"routine","es":"rutina","ex":"Exercise is part of my routine."},{"w":"mood","es":"estado de ánimo","ex":"I'm not in the mood to go out."},{"w":"bother","es":"molestar, molestarse en","ex":"It doesn't bother me at all."}]};
const SX = {"rescue":[{"id":"spp","name":"Situación → Problema → Qué hacer","when":"Para explicar cualquier situación de trabajo en tres pasos.","items":[{"en":"The situation is…","es":"La situación es…"},{"en":"The problem is…","es":"El problema es…"},{"en":"What we need to do is…","es":"Lo que tenemos que hacer es…"},{"en":"The good news is…","es":"La buena noticia es…"},{"en":"The next step is…","es":"El siguiente paso es…"}]},{"id":"time","name":"Ganar tiempo","when":"Te quedas en blanco o necesitas pensar unos segundos.","items":[{"en":"Let me explain what I mean.","es":"Déjame explicar a qué me refiero."},{"en":"Give me a second.","es":"Dame un segundo."},{"en":"Let me think about that for a moment.","es":"Déjame pensarlo un momento."},{"en":"That's a good question.","es":"Buena pregunta."},{"en":"How can I put this?","es":"¿Cómo lo digo?"},{"en":"Let me start from the beginning.","es":"Déjame empezar por el principio."}]},{"id":"main","name":"Volver a la idea principal","when":"Te has perdido en detalles y quieres volver al punto clave.","items":[{"en":"The main point is…","es":"La cuestión principal es…"},{"en":"What I'm trying to say is…","es":"Lo que intento decir es…"},{"en":"Basically, …","es":"Básicamente, …"},{"en":"The key thing is…","es":"Lo importante es…"},{"en":"In short, …","es":"En resumen, …"},{"en":"Going back to my point, …","es":"Volviendo a lo que decía, …"}]},{"id":"rephrase","name":"Reformular","when":"Algo no te ha salido bien o ves caras de confusión.","items":[{"en":"Let me rephrase that.","es":"Déjame expresarlo de otra manera."},{"en":"In other words, …","es":"En otras palabras, …"},{"en":"Let me put it another way.","es":"Déjame decirlo de otra forma."},{"en":"Sorry, what I meant was…","es":"Perdón, lo que quería decir era…"},{"en":"To put it simply, …","es":"Dicho de forma sencilla, …"}]},{"id":"check","name":"Comprobar que te siguen","when":"Después de explicar algo importante.","items":[{"en":"Does that make sense?","es":"¿Se entiende lo que quiero decir?"},{"en":"Is that clear?","es":"¿Está claro?"},{"en":"Are you with me?","es":"¿Me sigues?"},{"en":"Any questions so far?","es":"¿Alguna pregunta hasta aquí?"},{"en":"Do you see what I mean?","es":"¿Ves a lo que me refiero?"}]},{"id":"word","name":"No me sale la palabra","when":"No recuerdas una palabra concreta: descríbela.","items":[{"en":"I can't think of the word, but it's like…","es":"No me sale la palabra, pero es como…"},{"en":"It's the thing you use to…","es":"Es eso que usas para…"},{"en":"What's the word for…?","es":"¿Cómo se dice…?"},{"en":"It's a kind of…","es":"Es un tipo de…"},{"en":"It's similar to…","es":"Es parecido a…"}]},{"id":"clarify","name":"Pedir aclaración","when":"No has entendido bien lo que te dicen.","items":[{"en":"Sorry, could you say that again?","es":"Perdona, ¿puedes repetirlo?"},{"en":"Could you speak a bit more slowly?","es":"¿Podrías hablar un poco más despacio?"},{"en":"What do you mean by…?","es":"¿Qué quieres decir con…?"},{"en":"So, if I understand correctly, …","es":"Entonces, si lo entiendo bien, …"},{"en":"Just to make sure, you mean…?","es":"Solo para asegurarme, ¿quieres decir…?"}]},{"id":"order","name":"Ordenar tus ideas","when":"Vas a explicar un proceso o un plan.","items":[{"en":"Our goal is to…","es":"Nuestro objetivo es…"},{"en":"First, we need to…","es":"Primero, tenemos que…"},{"en":"Then, we can…","es":"Después, podemos…"},{"en":"After that, …","es":"Después de eso, …"},{"en":"Finally, …","es":"Por último, …"},{"en":"This will help us…","es":"Esto nos ayudará a…"}]},{"id":"opinion","name":"Dar tu opinión con suavidad","when":"Quieres opinar o no estás de acuerdo sin sonar brusco.","items":[{"en":"In my opinion, …","es":"En mi opinión, …"},{"en":"I see your point, but…","es":"Entiendo lo que dices, pero…"},{"en":"I'm not sure that's the best option.","es":"No estoy seguro de que sea la mejor opción."},{"en":"Maybe we could…","es":"Quizá podríamos…"},{"en":"What if we…?","es":"¿Y si…?"}]}],"frame":[{"k":"goal","label":"Objetivo","hint":"Our goal is to… / The main point is…","re":"\\b(our|my|the) (goal|aim|objective|idea|plan|main point|priority|problem|issue)\\b|\\bwe want to\\b|\\bi want to\\b|\\bthe point is\\b|\\bbasically\\b"},{"k":"steps","label":"Pasos","hint":"First, … / Then, … / After that, … / Finally, …","re":"\\b(first|firstly|then|after that|next|finally|second|secondly|lastly|before that|once)\\b"},{"k":"benefit","label":"Beneficio o resultado","hint":"This will help us… / That way, … / So, …","re":"\\b(this|that|it) (will|would|should|can) (help|allow|mean|make|save|reduce|improve|avoid|give)\\b|\\bthat way\\b|\\bas a result\\b|\\bso that\\b|\\bin the end\\b"},{"k":"check","label":"Comprobar","hint":"Does that make sense? / Any questions?","re":"does that make sense|is that clear|are you with me|any questions|do you see what i mean|what do you think"}],"scenarios":[{"id":"p1","c":"Situación → Problema → Qué hacer","idea":"Tenemos la entrega al cliente el viernes. Estructuras todavía no ha subido su modelo actualizado y sin él no podemos ejecutar la detección de clashes completa.","model":["The situation is that we have a delivery to the client on Friday.","The problem is that the structural team hasn't uploaded their updated model yet.","Without it, we can't run the full clash detection.","What we need to do is ask them for the model by Wednesday."],"vocab":["delivery (entrega)","upload (subir)","updated (actualizado)","run (ejecutar)"],"frame":"spp"},{"id":"p2","c":"Situación → Problema → Qué hacer","idea":"El cliente ha pedido un informe semanal de incidencias. Ahora mismo lo hacemos a mano y cada informe nos lleva casi un día entero.","model":["The situation is that the client wants a weekly report of issues.","The problem is that we do it by hand.","Each report takes us almost a whole day.","What we need to do is automate part of the process."],"vocab":["weekly (semanal)","by hand (a mano)","a whole day (un día entero)","automate (automatizar)"],"frame":"spp"},{"id":"p3","c":"Situación → Problema → Qué hacer","idea":"Hay muchos clashes repetidos en cada informe porque los que ya aprobamos vuelven a aparecer. El cliente se confunde y pierde confianza en los datos.","model":["The situation is that we send a clash report every week.","The problem is that the approved clashes appear again in every report.","This confuses the client.","What we need to do is filter out the approved clashes before we send the report."],"vocab":["filter out (filtrar, quitar)","approved (aprobado)","confuse (confundir)","appear again (volver a aparecer)"],"frame":"spp"},{"id":"p4","c":"Situación → Problema → Qué hacer","idea":"Dos personas del equipo están de vacaciones la semana que viene y tenemos tres revisiones de modelo programadas. No vamos a llegar con la gente que queda.","model":["The situation is that two people are on holiday next week.","We have three model reviews planned.","The problem is that we don't have enough people.","What we need to do is move one review to the following week."],"vocab":["on holiday (de vacaciones)","planned (programado)","enough (suficiente)","move (mover, cambiar de fecha)"],"frame":"spp"},{"id":"p5","c":"Situación → Problema → Qué hacer","idea":"El software se cuelga cada vez que abrimos el modelo federado porque es demasiado pesado. Perdemos mucho tiempo esperando y reiniciando.","model":["The situation is that we work with a very large federated model.","The problem is that the software crashes every time we open it.","We waste a lot of time restarting.","What we need to do is split the model into smaller parts."],"vocab":["federated model (modelo federado)","crash (colgarse)","restart (reiniciar)","split (dividir)"],"frame":"spp"},{"id":"p6","c":"Situación → Problema → Qué hacer","idea":"El cliente nos manda cambios por WhatsApp, por correo y en las reuniones. Al final no sabemos cuál es la última decisión.","model":["The situation is that the client sends changes in different ways.","Some come by email, some by WhatsApp and some in meetings.","The problem is that we don't know which decision is the latest one.","What we need to do is agree on one single channel for changes."],"vocab":["latest (último)","agree on (acordar)","single channel (un único canal)"],"frame":"spp"},{"id":"p7","c":"Situación → Problema → Qué hacer","idea":"Un compañero nuevo empieza el lunes y no tenemos ningún documento que explique cómo trabajamos, así que siempre perdemos días formándole.","model":["The situation is that a new colleague starts on Monday.","The problem is that we don't have a guide that explains how we work.","Training new people always takes several days.","What we need to do is write a short onboarding guide."],"vocab":["colleague (compañero)","guide (guía)","training (formación)","onboarding (incorporación)"],"frame":"spp"},{"id":"p8","c":"Situación → Problema → Qué hacer","idea":"La reunión de coordinación dura dos horas porque revisamos todos los clashes uno a uno, incluso los que no son importantes.","model":["The situation is that our coordination meeting lasts two hours.","The problem is that we review every clash one by one.","Many of them are not important.","What we need to do is review only the critical clashes in the meeting."],"vocab":["last (durar)","one by one (uno a uno)","critical (crítico)"],"frame":"spp"},{"id":"p9","c":"Situación → Problema → Qué hacer","idea":"En casa llego tarde todos los días y no me da tiempo a cocinar, así que acabo pidiendo comida a domicilio y gastando demasiado.","model":["The situation is that I get home late every day.","The problem is that I don't have time to cook.","So I end up ordering food and spending too much.","What I need to do is cook for the whole week on Sunday."],"vocab":["get home (llegar a casa)","end up (acabar)","order food (pedir comida)","for the whole week (para toda la semana)"],"frame":"spp"},{"id":"p10","c":"Situación → Problema → Qué hacer","idea":"Entiendo el inglés cuando lo leo, pero en las reuniones me bloqueo porque intento traducir todo en la cabeza antes de hablar.","model":["The situation is that I understand English well when I read.","The problem is that I freeze in meetings.","I try to translate everything in my head first.","What I need to do is use short sentences: one idea per sentence."],"vocab":["freeze (bloquearse)","translate (traducir)","in my head (en la cabeza)"],"frame":"spp"},{"id":"p11","frame":"spp","c":"Situación → Problema → Qué hacer","idea":"El modelo de instalaciones llega siempre el último día, así que no tenemos tiempo de revisar los clashes antes de la reunión de coordinación.","model":["The situation is that we have a coordination meeting every Thursday.","The problem is that the MEP model always arrives on Wednesday night.","We don't have time to review the clashes.","What we need to do is ask for the model by Tuesday."],"vocab":["MEP model (modelo de instalaciones)","arrive (llegar)","review (revisar)","by Tuesday (antes del martes)"]},{"id":"p12","frame":"spp","c":"Situación → Problema → Qué hacer","idea":"Cada disciplina usa una plantilla diferente para nombrar las incidencias y en el informe final no se entiende nada.","model":["The situation is that each discipline reports its own issues.","The problem is that everyone uses a different template.","The final report is very hard to read.","What we need to do is agree on one template for all teams."],"vocab":["discipline (disciplina)","template (plantilla)","hard to read (difícil de leer)","agree on (acordar)"]},{"id":"p13","frame":"spp","c":"Situación → Problema → Qué hacer","idea":"El cliente quiere ver el avance cada semana pero preparamos una presentación de veinte diapositivas que nos lleva medio día.","model":["The situation is that the client wants a weekly update.","The problem is that we prepare twenty slides every week.","It takes us half a day.","What we need to do is send a one-page summary instead."],"vocab":["weekly update (actualización semanal)","slides (diapositivas)","half a day (medio día)","one-page summary (resumen de una página)"]},{"id":"p14","frame":"spp","c":"Situación → Problema → Qué hacer","idea":"Muchos clashes son de elementos pequeños que no importan, pero aparecen igual en el informe y esconden los importantes.","model":["The situation is that our clash report is very long.","The problem is that many clashes are small and not important.","They hide the critical ones.","What we need to do is set a tolerance and filter the small clashes."],"vocab":["tolerance (tolerancia)","filter (filtrar)","hide (esconder)","critical (crítico)"]},{"id":"p15","frame":"spp","c":"Situación → Problema → Qué hacer","idea":"Trabajo desde casa dos días, pero mi conexión es lenta y los modelos tardan muchísimo en abrirse.","model":["The situation is that I work from home two days a week.","The problem is that my internet connection is slow.","The models take forever to open.","What I need to do is ask for a better connection or work with smaller files."],"vocab":["connection (conexión)","take forever (tardar muchísimo)","smaller files (archivos más pequeños)"]},{"id":"p16","frame":"spp","c":"Situación → Problema → Qué hacer","idea":"En casa siempre discutimos por quién hace la compra porque nadie se acuerda de lo que falta.","model":["The situation is that we do the shopping twice a week.","The problem is that nobody remembers what we need.","So we argue about it.","What we need to do is use a shared shopping list on our phones."],"vocab":["do the shopping (hacer la compra)","argue (discutir)","shared list (lista compartida)"]},{"id":"p17","frame":"spp","c":"Situación → Problema → Qué hacer","idea":"Duermo mal porque me acuesto mirando el móvil y luego me cuesta mucho levantarme por la mañana.","model":["The situation is that I go to bed with my phone.","The problem is that I sleep badly.","In the morning, I can't get up.","What I need to do is leave my phone in the kitchen at night."],"vocab":["sleep badly (dormir mal)","get up (levantarse)","leave (dejar)"]},{"id":"p18","frame":"spp","c":"Situación → Problema → Qué hacer","idea":"Tengo una reunión en inglés el lunes y me pongo muy nervioso porque siempre me bloqueo al principio.","model":["The situation is that I have a meeting in English on Monday.","The problem is that I always freeze at the beginning.","Then I feel nervous for the whole meeting.","What I need to do is prepare my first three sentences."],"vocab":["freeze (bloquearse)","at the beginning (al principio)","prepare (preparar)"]},{"id":"s1","c":"Reunión de trabajo","idea":"Revisar los clashes, comprobar cuáles están resueltos, identificar los aprobados, evitar que vuelvan a aparecer en el siguiente informe y reducir la cantidad de incidencias que mostramos al cliente.","model":["Our goal is to reduce the number of clashes in each report.","First, we need to review the clashes and identify the approved ones.","Then, we can check that they don't appear in the next report.","This will help us reduce the number of clashes shown to the client."],"vocab":["clash (interferencia, choque de elementos)","approved (aprobado)","report (informe)","issue (incidencia)","shown to the client (que se muestra al cliente)"]},{"id":"s2","c":"Reunión de trabajo","idea":"Antes de enviar el modelo al cliente tenemos que asegurarnos de que todas las disciplinas han subido la última versión, porque la semana pasada mandamos una versión antigua de estructuras y eso generó muchas preguntas y retrasos.","model":["Before we send the model to the client, we need to check one thing.","All the disciplines must upload their latest version.","Last week we sent an old structural model by mistake.","It caused a lot of questions and delays.","So let's check the versions first."],"vocab":["discipline (disciplina, especialidad)","upload (subir)","latest version (última versión)","by mistake (por error)","delay (retraso)"]},{"id":"s3","c":"Reunión de trabajo","idea":"Propongo que hagamos una reunión corta cada lunes para revisar el estado del proyecto, ver qué tareas están bloqueadas y decidir prioridades, porque ahora mismo cada uno trabaja por su lado y nos enteramos tarde de los problemas.","model":["I'd like to suggest a short meeting every Monday.","We can review the status of the project.","We can also see which tasks are blocked.","Then we can agree on the priorities for the week.","Right now, we find out about problems too late.","Does that make sense?"],"vocab":["status (estado)","blocked (bloqueado)","priorities (prioridades)","find out (enterarse)","agree on (acordar)"]},{"id":"s4","c":"Reunión de trabajo","idea":"No vamos a poder entregar el viernes porque el cliente cambió los requisitos el martes y eso nos obliga a rehacer parte del diseño, así que necesitamos una semana más o reducir el alcance de esta entrega.","model":["I'm afraid we can't deliver on Friday.","The client changed the requirements on Tuesday.","Because of that, we need to redo part of the design.","We have two options.","We can get one more week, or we can reduce the scope of this delivery."],"vocab":["deliver (entregar)","requirements (requisitos)","redo (rehacer)","scope (alcance)","delivery (entrega)"]},{"id":"s5","c":"Reunión de trabajo","idea":"He detectado que muchos errores vienen de que no usamos la misma plantilla y cada uno nombra los archivos a su manera, lo que hace que se pierda tiempo buscando y que a veces se trabaje sobre archivos equivocados.","model":["I've noticed a problem with our files.","We don't all use the same template.","Everyone names the files in a different way.","As a result, we waste time looking for things.","Sometimes we even work on the wrong file.","The main point is that we need one naming rule."],"vocab":["template (plantilla)","name files (nombrar archivos)","naming rule (regla de nombres)","waste time (perder tiempo)","wrong file (archivo equivocado)"]},{"id":"s6","c":"Reunión de trabajo","idea":"Quiero presentar el estado del proyecto: hemos terminado la fase de diseño, estamos revisando los comentarios del cliente y esperamos empezar la fase de construcción a mediados del mes que viene si no hay cambios importantes.","model":["Let me give you a quick update on the project.","We have finished the design phase.","Right now, we are reviewing the client's comments.","We expect to start construction in the middle of next month.","That depends on having no major changes."],"vocab":["update (actualización)","phase (fase)","comments (comentarios)","major changes (cambios importantes)","expect to (esperar, prever)"]},{"id":"s7","c":"Reunión de trabajo","idea":"No estoy de acuerdo con usar esa herramienta nueva ahora, porque estamos al final del proyecto, el equipo no la conoce y aprender a usarla nos haría perder tiempo justo cuando más presión tenemos.","model":["I see your point, but I'm not sure it's the right time.","We are at the end of the project.","The team doesn't know the new tool yet.","Learning it now would take time.","Maybe we could try it in the next project."],"vocab":["tool (herramienta)","the right time (el momento adecuado)","take time (llevar tiempo)","next project (próximo proyecto)"]},{"id":"s8","c":"Reunión de trabajo","idea":"Necesito que me ayudes con el informe porque tengo tres entregas esta semana, y si lo hacemos juntos podemos terminarlo el jueves y tener el viernes para revisarlo con calma.","model":["Could you help me with the report?","I have three deadlines this week.","If we work on it together, we can finish it by Thursday.","That way, we'll have Friday to review it calmly."],"vocab":["deadline (fecha de entrega)","by Thursday (para el jueves)","that way (así)","review (revisar)"]},{"id":"s9","c":"Reunión de trabajo","idea":"El problema no es técnico sino de comunicación: la información llega por correo, por chat y por teléfono, nadie sabe cuál es la versión buena y al final tomamos decisiones con datos antiguos.","model":["The main problem is not technical.","It's a communication problem.","We get information by email, chat and phone.","Nobody knows which version is the right one.","So we make decisions with old data.","We need one single place for information."],"vocab":["communication (comunicación)","the right one (la correcta)","make decisions (tomar decisiones)","one single place (un único sitio)"]},{"id":"s10","c":"Reunión de trabajo","idea":"Para la próxima entrega propongo que cada disciplina revise sus propios clashes antes de la coordinación general, así llegaremos a la reunión con menos problemas y podremos centrarnos en los que de verdad necesitan una decisión.","model":["I have a proposal for the next delivery.","Each discipline should check its own clashes first.","Then we can have the general coordination meeting.","That way, we'll bring fewer problems to the meeting.","We can focus on the ones that really need a decision."],"vocab":["proposal (propuesta)","coordination meeting (reunión de coordinación)","fewer (menos)","focus on (centrarse en)"]},{"id":"s11","c":"Con el cliente","idea":"Entendemos que el cliente quiere el cambio, pero si lo hacemos ahora afectará al presupuesto y al plazo, así que necesitamos que nos confirme por escrito antes de empezar.","model":["We understand that you want this change.","However, it will affect the budget.","It will also affect the schedule.","So we need your written confirmation before we start.","Is that okay with you?"],"vocab":["budget (presupuesto)","schedule (plazo, calendario)","written confirmation (confirmación por escrito)","affect (afectar)"]},{"id":"s12","c":"Con el cliente","idea":"Le explico al cliente que el retraso se debe a que el proveedor no entregó los materiales a tiempo, que ya tenemos fecha nueva y que vamos a reorganizar los trabajos para recuperar parte del tiempo perdido.","model":["I'd like to explain the delay.","Our supplier didn't deliver the materials on time.","We now have a new delivery date.","We are going to reorganize the work.","This will help us recover some of the lost time."],"vocab":["supplier (proveedor)","on time (a tiempo)","reorganize (reorganizar)","recover (recuperar)","lost time (tiempo perdido)"]},{"id":"s13","c":"Entrevista de trabajo","idea":"Explica tu experiencia: llevas varios años trabajando en coordinación de proyectos, te encargas de revisar modelos, detectar problemas entre disciplinas y comunicarte con el cliente, y lo que más te gusta es resolver problemas en equipo.","model":["I have several years of experience in project coordination.","I review models and detect problems between disciplines.","I also communicate with the client.","What I enjoy most is solving problems as a team."],"vocab":["experience (experiencia)","coordination (coordinación)","detect (detectar)","as a team (en equipo)"]},{"id":"s14","c":"Entrevista de trabajo","idea":"Cuenta tu punto débil: a veces quieres que todo esté perfecto y tardas demasiado en entregar, pero ahora te pones plazos intermedios y pides opinión antes para no perder tiempo.","model":["Sometimes I want everything to be perfect.","Because of that, I can take too long to deliver.","Now I set small deadlines for myself.","I also ask for feedback early.","This helps me save time."],"vocab":["take too long (tardar demasiado)","set deadlines (ponerse plazos)","feedback (opinión, comentarios)","early (pronto, al principio)"]},{"id":"s15","c":"Rutina diaria","idea":"Explica tu mañana: te levantas a las siete, te duchas rápido, desayunas algo ligero mientras miras las noticias, preparas la comida para llevar y sales de casa a las ocho para coger el metro.","model":["I get up at seven.","I have a quick shower.","Then I have a light breakfast and check the news.","I pack my lunch for work.","I leave home at eight and take the metro."],"vocab":["get up (levantarse)","light breakfast (desayuno ligero)","pack my lunch (preparar la comida para llevar)","take the metro (coger el metro)"]},{"id":"s16","c":"Rutina diaria","idea":"Explica cómo os organizáis en casa: tu pareja cocina entre semana porque llega antes, tú haces la compra el sábado y limpiáis juntos el domingo por la mañana para tener la tarde libre.","model":["We share the housework at home.","My partner cooks on weekdays because she gets home earlier.","I do the shopping on Saturdays.","We clean the house together on Sunday mornings.","That way, we have the afternoon free."],"vocab":["share (compartir, repartir)","housework (tareas de casa)","on weekdays (entre semana)","get home (llegar a casa)"]},{"id":"s17","c":"Problemas cotidianos","idea":"Llamas al casero porque hay una fuga en el baño desde hace dos días, el agua está mojando el suelo del pasillo y necesitas que venga alguien lo antes posible porque mañana trabajas todo el día.","model":["I'm calling about a problem in the bathroom.","There has been a leak for two days.","The water is getting into the hallway.","Could someone come as soon as possible?","I'm working all day tomorrow."],"vocab":["leak (fuga)","landlord (casero)","hallway (pasillo)","as soon as possible (lo antes posible)"]},{"id":"s18","c":"Problemas cotidianos","idea":"Explicas al médico que llevas una semana con dolor de cabeza, que empeora por la tarde después de mirar la pantalla del ordenador y que has tomado paracetamol pero solo te ayuda un poco.","model":["I've had a headache for a week.","It gets worse in the afternoon.","It usually starts after I work on the computer.","I've taken paracetamol.","But it only helps a little."],"vocab":["headache (dolor de cabeza)","get worse (empeorar)","screen (pantalla)","help a little (ayudar un poco)"]},{"id":"s19","c":"Problemas cotidianos","idea":"En la tienda quieres devolver unos pantalones porque la talla no es correcta, no los has usado, tienes el tique y preferirías cambiarlos por otra talla en lugar de que te devuelvan el dinero.","model":["I'd like to return these trousers.","The size is wrong.","I haven't worn them, and I have the receipt.","If possible, I'd like to exchange them for another size."],"vocab":["return (devolver)","size (talla)","receipt (tique)","exchange (cambiar)"]},{"id":"s20","c":"Problemas cotidianos","idea":"Explicas en el trabajo que vas a llegar tarde porque el tren se ha averiado entre dos estaciones, llevas veinte minutos parado y calculas que llegarás media hora tarde a la reunión.","model":["I'm sorry, I'm going to be late.","My train has broken down between two stations.","We've been stopped for twenty minutes.","I think I'll be about thirty minutes late for the meeting.","Please start without me."],"vocab":["break down (averiarse)","between (entre)","be late for (llegar tarde a)","start without me (empezad sin mí)"]},{"id":"s21","c":"Vida social","idea":"Explicas a un amigo por qué no puedes ir a su cena del sábado: tu madre cumple años, toda la familia se reúne ese día y ya lo habías prometido hace semanas, pero te gustaría verle el domingo para tomar algo.","model":["I'm really sorry, but I can't come on Saturday.","It's my mom's birthday.","The whole family is getting together that day.","I promised her weeks ago.","Could we meet for a drink on Sunday instead?"],"vocab":["get together (reunirse)","promise (prometer)","instead (en su lugar)","meet for a drink (quedar para tomar algo)"]},{"id":"s22","c":"Opiniones","idea":"Opinas que el teletrabajo es positivo porque ahorras tiempo de transporte y te concentras mejor, aunque echas de menos el contacto con los compañeros, así que lo ideal para ti sería un modelo mixto.","model":["In my opinion, working from home is positive.","I save time because I don't commute.","I can also concentrate better.","But I miss my colleagues.","So for me, the ideal option is a hybrid model."],"vocab":["commute (desplazarse al trabajo)","concentrate (concentrarse)","miss (echar de menos)","hybrid model (modelo mixto)"]},{"id":"s23","c":"Opiniones","idea":"Explicas por qué estás aprendiendo inglés: lo entiendes cuando lees, pero te bloqueas al hablar, y en tu trabajo cada vez hay más reuniones con clientes extranjeros, así que necesitas expresarte con más seguridad.","model":["I understand English well when I read.","But I freeze when I have to speak.","At work, we have more and more meetings with foreign clients.","So I need to speak with more confidence.","That's why I practice every day."],"vocab":["freeze (bloquearse)","more and more (cada vez más)","foreign (extranjero)","confidence (seguridad)"]},{"id":"s24","c":"Reunión de trabajo","idea":"Quieres cerrar la reunión resumiendo: hemos acordado revisar los clashes antes del jueves, Ana enviará el informe al cliente el viernes y la próxima reunión será el lunes a las diez.","model":["Let me sum up what we agreed.","We'll review the clashes before Thursday.","Ana will send the report to the client on Friday.","Our next meeting is on Monday at ten.","Does that work for everyone?"],"vocab":["sum up (resumir)","agree (acordar)","send (enviar)","does that work for everyone (¿os va bien a todos?)"]},{"id":"s25","c":"Reunión de trabajo","idea":"Explicas que el número de incidencias ha bajado un treinta por ciento desde que empezamos a revisar los modelos cada semana, y propones seguir así y compartir el método con el otro equipo.","model":["I have some good news.","The number of issues has dropped by thirty percent.","This started when we began weekly model reviews.","I suggest we keep doing it.","We could also share the method with the other team."],"vocab":["drop by (bajar en)","weekly (semanal)","keep doing (seguir haciendo)","share (compartir)"]},{"id":"s26","c":"Reunión de trabajo","idea":"Quieres proponer que el equipo use una lista compartida de tareas para saber quién hace qué y cuándo, porque ahora todo se pierde en los correos.","model":["I'd like to suggest something.","Let's use a shared task list.","Everyone can see who is doing what.","We can also see the deadlines.","This will help us stop losing tasks in emails."],"vocab":["shared task list (lista de tareas compartida)","deadline (fecha límite)","lose (perder)"]},{"id":"s27","c":"Reunión de trabajo","idea":"Explicas que la revisión del modelo ha encontrado veinte clashes, de los cuales cinco son críticos y tienen que resolverse antes del viernes.","model":["We reviewed the model yesterday.","We found twenty clashes.","Five of them are critical.","They need to be solved before Friday.","I'll send the list after this meeting."],"vocab":["review (revisar)","critical (crítico)","solve (resolver)","before Friday (antes del viernes)"]},{"id":"s28","c":"Reunión de trabajo","idea":"Pides a los compañeros que actualicen el estado de sus incidencias en el sistema antes de cada reunión para no perder tiempo preguntando.","model":["I have a small request.","Please update your issues in the system before each meeting.","That way, we don't need to ask about every issue.","The meeting will be much shorter.","Is that okay with everyone?"],"vocab":["request (petición)","update (actualizar)","that way (así)","shorter (más corta)"]},{"id":"s29","c":"Con el cliente","idea":"Explicas al cliente que la solución que propone es posible pero más cara, y le ofreces dos alternativas más baratas.","model":["Your solution is possible.","However, it's quite expensive.","We have two cheaper alternatives.","The first one is…","The second one is…","Which one do you prefer?"],"vocab":["possible (posible)","expensive (caro)","cheaper alternatives (alternativas más baratas)","prefer (preferir)"]},{"id":"s30","c":"Con el cliente","idea":"Confirmas al cliente lo que se ha acordado en la reunión: cambios en la fachada, nueva fecha de entrega y la próxima reunión en dos semanas.","model":["Let me confirm what we agreed today.","We'll change the design of the facade.","The new delivery date is the fifteenth.","Our next meeting is in two weeks.","I'll send you the minutes by email."],"vocab":["confirm (confirmar)","facade (fachada)","minutes (acta)","delivery date (fecha de entrega)"]},{"id":"s31","c":"Con el cliente","idea
