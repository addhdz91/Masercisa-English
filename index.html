<style>
/* Layout: single-column app (max 760px), sticky top bar + bottom tab bar; chat-bubble transcripts with A/B speakers */
:root{
  --bg:#F5F3F1; --surface:#FFFFFF; --ink:#1C1A19; --muted:#5F5A57; --line:#DDD8D4;
  --accent:#C40F1A; --accent-soft:#FBE4E5; --b:#2A2726; --b-soft:#ECE8E5;
  --gold:#B07A10; --gold-soft:#F7ECD3; --ok:#1F7A3D; --bad:#B4500F;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141313; --surface:#1E1C1C; --ink:#EEEAE6; --muted:#A39D99; --line:#33302E;
  --accent:#FF4D57; --accent-soft:#3D1D20; --b:#D9D3CF; --b-soft:#2E2B2A;
  --gold:#E7B44D; --gold-soft:#3A2F17; --ok:#62C483; --bad:#F2924F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141313; --surface:#1E1C1C; --ink:#EEEAE6; --muted:#A39D99; --line:#33302E;
  --accent:#FF4D57; --accent-soft:#3D1D20; --b:#D9D3CF; --b-soft:#2E2B2A;
  --gold:#E7B44D; --gold-soft:#3A2F17; --ok:#62C483; --bad:#F2924F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:12px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.logo{height:32px;width:auto;display:block;flex-shrink:0}
.logo-d{display:none}
@media (min-width:900px){.logo{height:40px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
.appname{font-family:var(--f-display);font-weight:800;font-size:1rem;line-height:1.1;letter-spacing:-.01em;color:var(--ink);border-left:1px solid var(--line);padding-left:10px;min-width:0}
.appname small{display:block;font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:0}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);width:max-content;max-width:100%}
.seg button{border:0;background:none;padding:8px 14px;font:inherit;font-size:.88rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:700}
.top .spacer{flex:1}
.speed,.back{flex-shrink:0}.brand{min-width:0}
@media (max-width:440px){header.top{gap:8px}.logo{height:30px}.appname{font-size:.82rem;padding-left:8px}.appname small{display:none}.back:not([hidden])~.brand .appname{display:none}.back{padding:6px 12px}.speed button{padding:6px 8px}}
@media (max-width:340px){.appname{display:none}}
.back{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.speed{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.speed button{border:0;background:none;padding:6px 10px;font-size:.8rem;font-family:var(--f-mono)}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800;line-height:1.1}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.hero{padding-block:22px 8px;display:flex;flex-direction:column;gap:10px}
.hero p{max-width:58ch;color:var(--muted)}
.ladder{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.78rem}
.ladder span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.ladder i{font-style:normal;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere;hyphens:auto}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.topic{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:transform .15s,border-color .15s}
.topic:hover{border-color:var(--accent);transform:translateY(-2px)}
.ticon{flex:none;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ticon svg{width:24px;height:24px}
.topic .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.topic .d{font-size:.86rem;color:var(--muted)}
.pips{display:flex;gap:4px;margin-top:4px}
.pip{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--accent)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:22px;margin-bottom:10px}
/* builds */
.build{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.simples{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px dashed var(--muted);border-radius:10px;padding:6px 10px;background:transparent;display:inline-flex;gap:6px;align-items:center}
.plus{font-family:var(--f-mono);color:var(--muted);align-self:center}
.joined{border-left:3px solid var(--gold);padding:8px 12px;background:var(--gold-soft);border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:4px}
.joined mark{background:var(--gold);color:var(--surface);padding:0 4px;border-radius:4px;font-weight:700}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:default}
.icon{width:16px;height:16px;flex:none}
/* convo list */
.convos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.convo-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.convo-card:hover{border-color:var(--accent)}
.lvl{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bars{display:inline-flex;gap:2px;align-items:flex-end}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:12px}
.bars i.on{background:var(--accent)}
.done-tag{font-size:.78rem;color:var(--ok);font-weight:700}
/* player */
.player-head{display:flex;flex-direction:column;gap:8px;padding-block:16px 6px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.line{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.line.B{align-self:flex-end;flex-direction:row-reverse}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.line.B .avatar{background:var(--b-soft);color:var(--b)}
.bubble{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.line.B .bubble{border-radius:16px 16px 4px 16px;background:var(--b-soft);border-color:transparent}
.line.playing .bubble{outline:2px solid var(--gold)}
.en{font-size:1.06rem}
.w{cursor:pointer;border-radius:4px}
.w:hover{background:var(--accent-soft)}
.es{font-size:.9rem;color:var(--muted);font-style:italic}
.bubble .rowbtns{gap:6px}
.iconbtn{border:0;background:transparent;padding:4px;border-radius:8px;color:var(--muted);display:inline-flex}
.iconbtn:hover{color:var(--accent);background:var(--accent-soft)}
.hiddenline .en{filter:blur(6px);user-select:none}
.try{display:flex;gap:6px;flex-wrap:wrap}
.try input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:.95rem}
.feedback{font-size:.85rem;font-weight:700}
.feedback.good{color:var(--ok)}.feedback.meh{color:var(--gold)}.feedback.bad{color:var(--bad)}
.player-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
/* popover */
.pop{position:fixed;z-index:30;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pop .pw{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.pop .pp{font-family:var(--f-mono);font-size:.7rem;opacity:.7;text-transform:uppercase}
.pop .pt{flex:1;min-width:0}
.pop button{background:transparent;border:1px solid currentColor;border-radius:999px;color:inherit;padding:5px 10px;font-size:.8rem}
/* vocab */
.card-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:14px}
.flash{width:100%;max-width:440px;min-height:230px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.flash .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.8rem);letter-spacing:-.02em;overflow-wrap:anywhere}
.flash .tr{font-size:1.25rem}
.flash .rank{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px}
.grade button{border-radius:12px;padding:12px 6px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem}
.grade .g0{color:var(--bad)}.grade .g1{color:var(--gold)}.grade .g2{color:var(--ok)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;width:100%}
.meter i{display:block;height:100%;background:var(--accent)}

.htxt{overflow-wrap:anywhere}.hok.good{color:var(--ok);font-weight:700}.hok.bad{color:var(--bad);font-weight:700}
@media (max-width:480px){.hlist li{grid-template-columns:auto minmax(0,1fr) auto}.hlist .htag{grid-column:1/-1;order:-1}}
.permrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.permrow .good{color:var(--ok)}
.adapt{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.adapt h2{margin:2px 0 4px;font-size:1.15rem}.adapt p{margin:0;font-size:.9rem}
.stats.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.stats.four{grid-template-columns:repeat(2,1fr)}}
.actchart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:120px;padding:8px 0 0}
.ac-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.ac-col i{display:block;width:100%;max-width:22px;min-height:2px;border-radius:4px 4px 1px 1px;background:var(--accent-soft)}
.ac-col i.sess{background:var(--accent)}
.ac-col small{font-size:.7rem;color:var(--muted)}.ac-n{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.catlist{display:flex;flex-direction:column;gap:8px}
.catrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:.9rem}
.catrow b{text-align:right;font-variant-numeric:tabular-nums}
.catrow .minibar{height:8px}
.rvbox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badline{font-size:1.15rem;margin:4px 0;text-decoration:underline wavy var(--bad);text-underline-offset:5px;text-decoration-thickness:1px}
.recdot{display:inline-block;margin-left:10px;color:var(--bad);font-weight:700;font-size:.9rem;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.switch{display:inline-flex;align-items:center;gap:6px;font-weight:700}
@media (max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:1.2rem}.line{max-width:96%}}
@media (max-width:360px){.stat{padding:10px 8px}.stat b{font-size:1.05rem}.stat span{font-size:.72rem}}
</style>

<script>
/* Rule-based English grammar checker for learners (no AI).
   createGrammar({verbs:{base:[vbz,vbd,vbn,vbg]}, pos:{word:'n'|'v'|'adj'|...}}) -> {analyze(text), check(text, target)} */
function createGrammar(opts){
  const VERBS=opts.verbs, POS=opts.pos||{};
  // ---------- form index ----------
  const FORM={}; // form -> [{lemma, tag}]
  const add=(f,lemma,tag)=>{ if(!f) return; (FORM[f]=FORM[f]||[]).push({lemma,tag}); };
  for(const b in VERBS){ const [z,d,n,g]=VERBS[b]; add(b,b,'VB'); add(z,b,'VBZ'); add(d,b,'VBD'); add(n,b,'VBN'); add(g,b,'VBG'); }
  // irregular extras
  [['lie','lied','VBD'],['lie','lied','VBN'],['get','gotten','VBN'],['get','got','VBN'],['dream','dreamt','VBD'],['learn','learnt','VBD'],['learn','learnt','VBN'],['spell','spelt','VBD'],['burn','burnt','VBD'],['burn','burnt','VBN'],['smell','smelt','VBD']]
    .forEach(([l,f,t])=>add(f,l,t));
  const BE={am:{p:'1s',t:'pres'},is:{p:'3s',t:'pres'},are:{p:'pl',t:'pres'},was:{p:'sg',t:'past'},were:{p:'pl',t:'past'}};
  const BEALL=new Set(['am','is','are','was','were','be','been','being']);
  const DO=new Set(['do','does','did']);
  const HAVE=new Set(['have','has','had']);
  const MODALS=new Set(['will','would','can','could','should','must','might','may','shall']);

          E(`Después de "going to" el verbo va en forma base: "${lemmaOf(v)}", no "${v}".`, `${cap(subjText)} ${w} going to ${lemmaOf(v)}…`);

        }
      }
      if(hasTag(nx,'VBG')&&!(POS[nx]==='adj'&&!hasTag(nx,'VB'))&&!['interesting','amazing','boring','exciting','surprising','annoying','disappointing','embarrassing','tiring','relaxing','confusing','frightening','charming','loving','outstanding','missing'].includes(nx)){
        take(); res.parts.push({role:'verb',w:nx,note:'-ing'}); res.main=lemmaOf(nx);
        res.tense=[w==='was'||w==='were'?'past_continuous':w==='be'?'modal':'present_continuous'];
        stative(nx); timeCheck(); return res;
      }
      // be + base verb (I am go)
      if(FORM[nx]&&hasTag(nx,'VB')&&POS[nx]==='v'&&!isAdj(nx)&&!hasTag(nx,'VBN')&&!(subj.relSkip||/\b(thing|things|all|what|best|worst)\b/.test(subj.words.join(' ')))){
        take();
        const g=VERBS[nx]?VERBS[nx][3]:nx+'ing';
        if(nx==='agree') E('"Estar de acuerdo" es un verbo en inglés: I agree (no "I am agree").', `${cap(subjText)} ${is3s?'agrees':'agree'}${bePast?' (pasado: agreed)':''}…`);
        else E(`No se usa "${w}" + verbo base. Quita "${w}" (${subjText} ${is3s&&!bePast?(VERBS[nx]?VERBS[nx][0]:nx+'s'):bePast?(VERBS[nx]?VERBS[nx][1]:nx+'ed'):nx}) o usa la forma continua (${subjText} ${w} ${g}).`, `${cap(subjText)} ${w} ${g}…`);
        res.parts.push({role:'verb',w:nx,note:'forma incorrecta'}); res.main=nx;
        res.tense=[bePast?'past_simple':'present_simple'];
        return res;
      }
      // be + VBD (not VBN): I was went
      if(FORM[nx]&&hasTag(nx,'VBD')&&!hasTag(nx,'VBN')&&!isAdj(nx)){
        take();
        E(`"${w} ${nx}" no es correcto. Para el pasado simple basta "${subjText} ${nx}"; para el continuo, "${subjText} ${w} ${VERBS[lemmaOf(nx)]?VERBS[lemmaOf(nx)][3]:'…ing'}".`, `${cap(subjText)} ${nx}…`);
        res.parts.push({role:'verb',w:nx,note:'forma incorrecta'}); res.tense=['past_simple']; return res;
      }
      // passive or adjective/complement
      if(nx&&hasTag(nx,'VBN')&&!isAdj(nx)&&POS[nx]!=='adj'&&!['born'].includes('x')){
        take(); res.parts.push({role:'verb',w:nx,note:'participio (pasiva)'}); res.passive=true; res.main=lemmaOf(nx);
        res.tense=[w==='was'||w==='were'?'past_simple':w==='been'?'present_perfect':'present_simple'];
        timeCheck(); return res;
      }
      res.be=true; res.main='be'; res.parts.push({role:'comp',w:nx});
      res.tense=[w==='was'||w==='were'?'past_simple':'present_simple'];
      timeCheck();
      return res;
    }
    // ---------- MAIN VERB (no auxiliary) ----------
    if(['near','about','over','under','through','around','behind','inside','outside','past','since','until','after','before'].includes(w)&&POS[w]!=='v'){ res.noVerb=true; res.tense=[]; return res; }
    if(ADJ_ED.has(w)){
      const nx=T[k]?T[k].w:null;
      if(!nx||['today','now','because','and','but','so','of','with','about','at','in','right','very','too','again','tonight','this'].includes(nx)){
        E(`Falta el verbo "to be": "${w}" aquí es un adjetivo.`, `${cap(subjText)} ${is1s?'am':is3s?'is':'are'} ${w}…`);
        res.tense=['present_simple']; res.be=true; res.parts.push({role:'comp',w,note:'adjetivo sin to be'}); return res;
      }
    }
    if(FORM[w]){
      const F=forms(w); const tags=new Set(F.map(f=>f.tag)); const base=lemmaOf(w);
      res.main=base;
      const cands=[];
      if(tags.has('VBD')) cands.push('past_simple');
      if(tags.has('VB')||tags.has('VBZ')) cands.push('present_simple');
      res.parts.push({role:'verb',w,note:tags.has('VBD')&&!tags.has('VB')?'pasado':tags.has('VBZ')?'presente (-s)':tags.has('VB')&&tags.has('VBD')?'base / pasado':'base'});
      if(tags.has('VBN')&&!tags.has('VBD')&&!tags.has('VB')){
        const past=VERBS[base]?VERBS[base][1]:w;
        E(`"${w}" es participio: necesita have/has (${subjText} ${is3s?'has':'have'} ${w}) o usa el pasado "${past}".`, `${cap(subjText)} ${past}…`);
        res.tense=['past_simple']; return res;
      }
      if(tags.has('VBG')&&!tags.has('VB')&&!tags.has('VBD')){
        E(`Falta "to be" antes de "${w}".`, `${cap(subjText)} ${is1s?'am':is3s?'is':'are'} ${w}…`); res.tense=['present_continuous']; return res;
      }
      // present simple agreement (only when not unambiguously past)
      const pastOnly=tags.has('VBD')&&!tags.has('VB')&&!tags.has('VBZ');
      if(!pastOnly){
        if(is3s&&tags.has('VB')&&!tags.has('VBZ')&&!tags.has('VBD')){
          const z=VERBS[base]?VERBS[base][0]:w+'s';
          E(`Con "${subjText}" (he/she/it) el presente simple lleva -s: "${z}".`, `${cap(subjText)} ${z}…`);
          cands.splice(0,cands.length,'present_simple');
        } else if(is3s&&tags.has('VB')&&tags.has('VBD')&&!tags.has('VBZ')){
          // "he read" -> only past is correct
          cands.splice(0,cands.length,'past_simple');

          E(`Con "${subjText}" el verbo no lleva -s: "${base}".`, `${cap(subjText)} ${base}…`);
        }

      timeCheck();
      return res;
    }
    // unknown word as verb
    res.noVerb=true;
    return res;

    // helpers bound to scope
    function agreeHave(hw){
      if(hw==='has'&&!is3s&&P!=='?'&&!isThere) E(`Con "${subjText}" se usa "have", no "has".`, `${inverted?'Have '+subjText:cap(subjText)+' have'} …`);
      if(hw==='have'&&is3s) E(`Con "${subjText}" (3.ª persona) se usa "has", no "have".`, `${inverted?'Has '+subjText:cap(subjText)+' has'} …`);
    }
    function stative(ing){ const b=lemmaOf(ing); if(STATIVE.has(b)) Wn(`"${b}" es un verbo de estado: normalmente no se usa en -ing (mejor: ${b}${is3s?'s':''}).`); }
    function timeCheck(){}
  }
  function C_IF(ctx){ return ctx.conj==='if'||ctx.wish; }

  // ---------- time markers per clause ----------
  const PAST_M=[/\byesterday\b(?!'s)/,/\bago\b/,/\blast (night|week|weekend|month|year|summer|winter|time|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b(?!'s)/,/\bin (19|20)\d\d\b/,/\bwhen i was (a )?(kid|child|young|little|teenager)\b/];
  const FUT_M=[/\btomorrow\b/,/\bnext (week|weekend|month|year|summer|winter|time|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/,/\bin the future\b/,/\bsoon\b/];
  const NOW_M=[/\bright now\b/,/\bat the moment\b/,/\bat this moment\b/,/\bcurrently\b/];
  const PERF_M=[/\bsince\b/,/\bever\b/,/\balready\b/,/\byet\b/,/\bso far\b/,/\bfor (two|three|four|five|six|many|several|a few|\d+) (years|months|weeks|days|hours)\b/];
  function timeMarkers(res,text){
    const s=' '+text.toLowerCase()+' ';
    const t=res.tense;
    const has=a=>a.some(r=>r.test(s));
    const isPast=t.some(x=>/^past/.test(x)), isFut=t.some(x=>/^future/.test(x)), isPerf=t.includes('present_perfect')||t.includes('present_perfect_continuous');
    if(res.ifClause) return;
    if(has(PAST_M)){
      if(isPerf) res.errors.push({msg:'Con una fecha terminada (yesterday, ago, last week…) se usa el pasado simple, no el presente perfecto.',fix:null});
      else if(!isPast&&!t.includes('conditional')&&!t.includes('modal')&&!t.includes('imperative')&&t.length) res.errors.push({msg:'Hay un marcador de pasado (yesterday, ago, last…), pero el verbo no está en pasado.',fix:null});
      res.marker='past';
    }
    if(has(FUT_M)&&!/\b(for|until|by|from|before) (next|tomorrow)/.test(s)&&!/\b(decided|agreed|planned|arranged|promised|wanted|hoped|needed|offered|asked|told \w+|said|were going|was going) to\b/.test(s)){
      if(isPast&&!res.wasGoingTo) res.errors.push({msg:'Hay un marcador de futuro (tomorrow, next…), pero el verbo está en pasado.',fix:null});
      res.marker='future';
    }
    if(has(NOW_M)&&t.length===1&&t[0]==='present_simple'&&!res.be&&res.main&&!STATIVE.has(res.main)) res.warnings.push({msg:'Con "now / right now / at the moment" normalmente se usa el presente continuo (am/is/are + -ing).'});
    if(/\bsince\b/.test(s)&&t.length===1&&(t[0]==='present_simple'||t[0]==='present_continuous')) res.warnings.push({msg:'Con "since" + momento se usa el presente perfecto: I have lived here since 2020.'});
    if(/\bfor (two|three|four|five|six|many|several|a few|\d+) (years|months|weeks)\b/.test(s)&&t.length===1&&t[0]==='present_simple'&&!res.be&&res.main!=='be'&&/\b(live|work|know|study|be)\b/.test(s)) res.warnings.push({msg:'Para algo que empezó en el pasado y sigue: presente perfecto (I have lived here for two years).'});
    if(res.neg&&res.neverAdv) res.errors.push({msg:'Doble negación: "never" ya es negativo. Usa "I have never…" o "I haven\'t ever…".',fix:null});
  }

  const AUXW=x=>BEALL.has(x)||DO.has(x)||HAVE.has(x)||MODALS.has(x);
  function startsQ(C){
    const T=C.toks; if(!T.length) return false;
    if(AUXW(T[0].w)) return true;
    if(WH.has(T[0].w)){
      let k=1; while(k<4&&T[k]&&!AUXW(T[k].w)&&!PRON[T[k].w]) k++;
      return !!T[k]&&(AUXW(T[k].w)||(k===1&&isVerbForm(T[k].w)));
    }
    return false;
  }
  // ---------- public ----------
  function analyze(text){
    const tokens=tokenize(text);
    const sents=sentences(tokens);
    const out={sentences:[],tenses:new Set(),errors:[],warnings:[],neg:false,question:false,subjects:[],mains:[]};
    for(const s of sents){
      const isQ=s.end==='?';
      const cls=clauses(s);
      let prevSubj=null; const resC=[];
      cls.forEach((C,ci)=>{
        const prevR=resC[resC.length-1]; const sharedAux=(C.conj==='and'||C.conj==='or')&&prevR&&(prevR.modal||prevR.parts.some(p=>p.role==='aux'&&DO.has(p.w)))&&C.toks[0]&&hasTag(C.toks[0].w,'VB');
        const ctx={question:!sharedAux&&isQ&&(startsQ(C)||cls.length===1||(ci===0&&!cls.some(startsQ))),prevSubj,prevRes:resC[resC.length-1],conj:C.conj,elliptic:true};
        // treat 'if' clause
        const r=analyzeClause(C,ctx);
        const clauseText=C.toks.map(t=>t.poss?t.w+"'s":t.w).join(' ');
        if(r.tense) timeMarkers(r,clauseText);
        if(r.subject&&!/implícito/.test(r.subject)) prevSubj={words:[r.subject],person:r.person};
        // capital I
        C.toks.forEach(t=>{ if(t.o==='i') r.warnings.push({msg:'"I" (yo) siempre se escribe en mayúscula.'}); });
        resC.push(r);
        r.tense.forEach(x=>out.tenses.add(x));
        if(r.neg||r.neverAdv) out.neg=true;
        if(r.question) out.question=true;
        if(r.subject) out.subjects.push({s:r.subject,p:r.person});
        if(r.main) out.mains.push(r.main);
      });
      // a question that is not inverted: "You like pizza?"
      if(isQ&&resC[0]&&!resC[0].parts.some(p=>p.note==='auxiliar (invertido)')&&!resC[0].errors.length&&resC[0].subject&&!['who','what','which'].includes(resC[0].subject)){
        resC[0].warnings.push({msg:'Pregunta sin invertir: suena coloquial. Forma estándar: Do you…? / Are you…? / Did you…?'});
      }
      out.sentences.push({text:s.toks.map(t=>t.o).filter(Boolean).join(' ')+(s.end||''),clauses:resC,question:isQ});
    }
    // dedupe and collect
    const seen=new Set();
    out.sentences.forEach(s=>s.clauses.forEach(c=>{
      c.errors.forEach(e=>{ if(!seen.has(e.msg)){ seen.add(e.msg); out.errors.push(e);} });
      c.warnings.forEach(e=>{ if(!seen.has(e.msg)){ seen.add(e.msg); out.warnings.push(e);} });
    }));
    if(!out.tenses.size&&tokens.length) out.noVerb=true;
    const low=' '+text.toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ')+' ';
    const RULES=[
      [/\b(i|we)('m| am| are| was| were) (so |really |very |a bit |quite )?(boring|interesting|tiring|exciting|confusing|embarrassing|annoying|frightening|disappointing)\b/, m=>`Para cómo te sientes se usa -ed: "${m[4].replace(/ing$/,'ed').replace(/tireded/,'tired')}" (${m[4]} = que causa esa sensación).`, m=>null],
      [/\bexplain(s|ed|ing)? (me|him|her|us|them)\b/, m=>`Se dice "explain something to someone": explain it to ${m[2]}.`, m=>null],
      [/\bwant(s|ed)? that (i|you|he|she|we|they|it)\b/, m=>`Se dice "want someone to do something": want ${({i:'me',he:'him',she:'her',we:'us',they:'them'})[m[2]]||m[2]} to…`, m=>null],
      [/\b(go|goes|going|went|come|comes|coming|came|get|got|arrive|arrived) to home\b/, m=>'"Home" no lleva "to": go home, get home, come home.', m=>null],
      [/\b(live|lives|work|works|know|knows|study|studies|am|is|are|be) (here |there |in [a-z]+ |at [a-z]+ )?since\b/, m=>'Con "since" se usa el presente perfecto: I have lived here since 2020 / I have been here since…', m=>null],
      [/\bpeople is\b/, m=>'"People" es plural: people are.', m=>null],
      [/\bthe news are\b/, m=>'"News" es singular: the news is.', m=>null],
      [/\bdepends of\b/, m=>'Se dice "depends on".', m=>null],
      [/\b(married|marry) with\b/, m=>'Se dice "married to" (o "marry someone").', m=>null],
      [/\bdiscuss about\b/, m=>'"Discuss" no lleva "about": discuss the problem.', m=>null],
      [/\bon the weekend days\b|\bin the weekend\b/, m=>'Se dice "at the weekend" (UK) o "on the weekend" (US).', m=>null]
    ];
    for(const [rx,msg] of RULES){ const m=low.match(rx); if(m){ const t=msg(m); if(!seen.has(t)){ seen.add(t); out.errors.push({msg:t,fix:null}); } } }
    out.warnings=out.warnings.filter(w=>!/since/.test(w.msg)||!out.errors.some(e=>/since/.test(e.msg)));
    out.tenses=[...out.tenses];
    return out;
  }

  // target: {tense:[...], neg:bool?, question:bool?, person:'3s'|'1s'|..., verb:'go'?, minWords}
  function check(text,target){
    const a=analyze(text);
    const issues=[];
    const words=(text.match(/[A-Za-z']+/g)||[]).length;
    if(!words){ return {ok:false,a,issues:[{msg:'Escribe una respuesta.'}]}; }
    if(target.minWords&&words<target.minWords) issues.push({msg:`Responde con una frase completa (mínimo ${target.minWords} palabras).`});
    if(target.tense&&target.tense.length){
      const okT=a.sentences.some(s=>s.clauses.some(c=>c.tense.some(t=>target.tense.includes(t))&&(target.question===undefined||!target.question||c.question)));
      if(!okT){
        const got=a.tenses.length?a.tenses.map(t=>LABEL[t]||t).join(', '):'ningún verbo';
        issues.push({msg:`Aquí tienes que usar ${target.tense.map(t=>LABEL[t]).join(' o ')}. He detectado: ${got}.`,tense:true});
      }
    }
    if(target.neg===true&&!a.neg) issues.push({msg:'La frase tiene que ser negativa (not / never).'});
    if(target.question===true&&!a.question) issues.push({msg:'Tiene que ser una pregunta (termina con "?" y usa auxiliar).'});
    if(target.question===true&&a.question){
      const inv=a.sentences.some(s=>s.question&&s.clauses[0]&&(s.clauses[0].parts.some(p=>p.note==='auxiliar (invertido)')||['who','what','which'].includes(s.clauses[0].subject)));
      if(!inv) issues.push({msg:'En la pregunta, pon el auxiliar antes del sujeto (Do you…? / Did she…? / Have they…?).'});
    }
    if(target.person){
      const want=target.person; const okP=a.subjects.some(s=>s.p===want||(want==='pl'&&s.p==='pl2'));
      if(!okP) issues.push({msg:`Usa un sujeto ${want==='3s'?'en 3.ª persona (he, she, my brother…)':want==='1s'?'"I"':'en plural (we, they, my friends…)'}.`});
    }
    if(target.verb){ const vs=[].concat(target.verb); if(!a.mains.some(m=>vs.includes(m))) issues.push({msg:`Usa el verbo "${vs[0]}".`}); }
    const ok=!a.errors.length&&!issues.length;
    return {ok,a,issues};
  }
  return {analyze,check,LABEL,tokenize,lemmaOf,FORM};
}

"Charla corta con un vecino o compañero de trabajo.","builds":[{"simple":["It's cold today.","I forgot my jacket."],"complex":"It's cold today, and I forgot my jacket.","es":"Hace frío hoy y se me olvidó la chaqueta.","link":"and"},{"simple":["The elevator is slow.","It's very old."],"complex":"The elevator is slow because it's very old.","es":"El ascensor es lento porque es muy viejo.","link":"because"},{"simple":["I live on the fifth floor.","I usually take the stairs."],"complex":"I live on the fifth floor, but I usually take the stairs.","es":"Vivo en el quinto piso, pero normalmente subo por las escaleras.","link":"but"},{"simple":["I just moved in.","I don't know anyone yet."],"complex":"I just moved in, so I don't know anyone yet.","es":"Me acabo de mudar, así que todavía no conozco a nadie.","link":"so"}],"convos":[{"title":"Hola rápido","level":1,"lines":[{"s":"A","en":"Good morning!","es":"¡Buenos días!"},{"s":"B","en":"Morning! Which floor?","es":"¡Buenos días! ¿Qué piso?"},{"s":"A","en":"Seven, please.","es":"El siete, por favor."},{"s":"B","en":"Sure. It's cold today.","es":"Claro. Hace frío hoy."},{"s":"A","en":"Yes, very cold.","es":"Sí, mucho frío."},{"s":"B","en":"Have a nice day!","es":"¡Que tengas un buen día!"},{"s":"A","en":"You too. Bye!","es":"Igualmente. ¡Adiós!"}]},{"title":"El vecino nuevo","level":2,"lines":[{"s":"A","en":"Hi! Are you new in the building?","es":"¡Hola! ¿Eres nuevo en el edificio?"},{"s":"B","en":"Yes, I moved in last week.","es":"Sí, me mudé la semana pasada."},{"s":"A","en":"Welcome! I'm Laura. I live on the fourth floor.","es":"¡Bienvenido! Soy Laura. Vivo en el cuarto piso."},{"s":"B","en":"Nice to meet you. I'm David, from the sixth floor.","es":"Encantado. Soy David, del sexto piso."},{"s":"A","en":"Do you like the neighborhood so far?","es":"¿Te gusta el barrio hasta ahora?"},{"s":"B","en":"I do, but I don't know where anything is yet.","es":"Sí, pero todavía no sé dónde está nada."},{"s":"A","en":"There's a great bakery around the corner.","es":"Hay una panadería genial a la vuelta de la esquina."},{"s":"B","en":"Thanks! I'll check it out.","es":"¡Gracias! Le echaré un vistazo."},{"s":"A","en":"This is my floor. See you around!","es":"Este es mi piso. ¡Nos vemos!"}]},{"title":"El ascensor se para","level":3,"lines":[{"s":"A","en":"Wait… did we just stop?","es":"Espera… ¿nos acabamos de parar?"},{"s":"B","en":"I think so. The lights are still on, at least.","es":"Creo que sí. Al menos las luces siguen encendidas."},{"s":"A","en":"This happened to me once before, and it took twenty minutes to fix.","es":"Esto me pasó una vez antes y tardaron veinte minutos en arreglarlo."},{"s":"B","en":"Twenty minutes? I have a meeting at nine, so I really hope it's faster this time.","es":"¿Veinte minutos? Tengo una reunión a las nueve, así que espero de verdad que esta vez sea más rápido."},{"s":"A","en":"Let's press the emergency button. Someone usually answers right away.","es":"Pulsemos el botón de emergencia. Normalmente alguien contesta enseguida."},{"s":"B","en":"Good idea. Honestly, I'm a little nervous in small spaces.","es":"Buena idea. Sinceramente, me pongo un poco nervioso en espacios pequeños."},{"s":"A","en":"Don't worry. If you want, we can talk about something else while we wait.","es":"No te preocupes. Si quieres, podemos hablar de otra cosa mientras esperamos."},{"s":"B","en":"Okay. So… how long have you worked here?","es":"Vale. Entonces… ¿cuánto tiempo llevas trabajando aquí?"},{"s":"A","en":"About three years. Oh, look — we're moving again!","es":"Unos tres años. ¡Oh, mira, ya nos movemos otra vez!"},{"s":"B","en":"Finally! Thanks for keeping me calm.","es":"¡Por fin! Gracias por mantenerme tranquilo."}]}]},{"id":"football","title":"Fútbol","icon":"ball","desc":"Hablar del partido, tu equipo y los jugadores.","builds":[{"simple":["I watched the game.","It was amazing."],"complex":"I watched the game last night, and it was amazing.","es":"Vi el partido anoche y fue increíble.","link":"and"},{"simple":["We lost.","We played well."],"complex":"We lost, although we played well.","es":"Perdimos, aunque jugamos bien.","link":"although"},{"simple":["The striker was injured.","The coach changed the team."],"complex":"The coach changed the team because the striker was injured.","es":"El entrenador cambió el equipo porque el delantero estaba lesionado.","link":"because"},{"simple":["We win on Sunday.","We go to the final."],"complex":"If we win on Sunday, we'll go to the final.","es":"Si ganamos el domingo, iremos a la final.","link":"if"}],"convos":[{"title":"¿Viste el partido?","level":1,"lines":[{"s":"A","en":"Did you watch the game?","es":"¿Viste el partido?"},{"s":"B","en":"Yes! It was great.","es":"¡Sí! Fue genial."},{"s":"A","en":"What was the score?","es":"¿Cómo quedó?"},{"s":"B","en":"Two to one.","es":"Dos a uno."},{"s":"A","en":"Who scored?","es":"¿Quién marcó?"},{"s":"B","en":"The new player. He's very fast.","es":"El jugador nuevo. Es muy rápido."},{"s":"A","en":"Nice! I love this team.","es":"¡Qué bien! Me encanta este equipo."}]},{"title":"Tu equipo favorito","level":2,"lines":[{"s":"A","en":"Which team do you support?","es":"¿De qué equipo eres?"},{"s":"B","en":"Real Madrid, since I was a kid. What about you?","es":"Del Real Madrid, desde que era niño. ¿Y tú?"},{"s":"A","en":"I'm an Atlético fan, so we're rivals!","es":"Soy del Atlético, ¡así que somos rivales!"},{"s":"B","en":"Ha! Are you going to the derby next month?","es":"¡Ja! ¿Vas a ir al derbi el mes que viene?"},{"s":"A","en":"I want to, but the tickets are really expensive.","es":"Quiero, pero las entradas son muy caras."},{"s":"B","en":"We could watch it together at a bar.","es":"Podríamos verlo juntos en un bar."},{"s":"A","en":"Deal. But the loser pays for the drinks.","es":"Trato hecho. Pero el que pierda paga las bebidas."}]},{"title":"Discusión del partido","level":3,"lines":[{"s":"A","en":"I still can't believe that penalty. The referee was completely wrong.","es":"Todavía no me creo ese penalti. El árbitro se equivocó por completo."},{"s":"B","en":"I don't know. I watched the replay, and the defender definitely touched him.","es":"No sé. Vi la repetición y el defensa definitivamente lo tocó."},{"s":"A","en":"Touched him, sure, but he fell way too easily.","es":"Lo tocó, vale, pero se cayó con demasiada facilidad."},{"s":"B","en":"Maybe. Anyway, the real problem was that we didn't create any chances in the second half.","es":"Puede ser. De todos modos, el verdadero problema fue que no creamos ninguna ocasión en la segunda parte."},{"s":"A","en":"That's true. The coach should have made changes earlier, when the players were obviously tired.","es":"Eso es verdad. El entrenador debería haber hecho cambios antes, cuando los jugadores estaban claramente cansados."},{"s":"B","en":"Exactly. If he had brought on the young winger at sixty minutes, we would have won.","es":"Exacto. Si hubiera metido al extremo joven en el minuto sesenta, habríamos ganado."},{"s":"A","en":"Well, there's still the second leg. We just need one goal to go through.","es":"Bueno, todavía queda la vuelta. Solo necesitamos un gol para pasar."},{"s":"B","en":"I hope you're right. I'm already nervous, and it's not until next Wednesday!","es":"Espero que tengas razón. Ya estoy nervioso, ¡y no es hasta el miércoles que viene!"}]}]},{"id":"feelings","title":"Cómo me siento","icon":"heart","desc":"Expresar emociones, estrés, alegría y cansancio.","builds":[{"simple":["I'm tired.","I didn't sleep well."],"complex":"I'm tired because I didn't sleep well.","es":"Estoy cansado porque no dormí bien.","link":"because"},{"simple":["I feel stressed.","I have a lot of work."],"complex":"I feel stressed since I have a lot of work this week.","es":"Me siento estresado porque tengo mucho trabajo esta semana.","link":"since"},{"simple":["I was sad.","My friend called me."],"complex":"I was sad until my friend called me.","es":"Estaba triste hasta que mi amigo me llamó.","link":"until"},{"simple":["I'm happy.","I passed the exam."],"complex":"I'm so happy that I passed the exam.","es":"Estoy muy feliz de haber aprobado el examen.","link":"that"}],"convos":[{"title":"¿Cómo estás?","level":1,"lines":[{"s":"A","en":"How are you?","es":"¿Cómo estás?"},{"s":"B","en":"I'm a bit tired.","es":"Estoy un poco cansado."},{"s":"A","en":"Why?","es":"¿Por qué?"},{"s":"B","en":"I didn't sleep well.","es":"No dormí bien."},{"s":"A","en":"Oh no. Drink some coffee!","es":"¡Oh, no! ¡Tómate un café!"},{"s":"B","en":"Good idea. Thanks.","es":"Buena idea. Gracias."}]},{"title":"Un día difícil","level":2,"lines":[{"s":"A","en":"You look worried. Is everything okay?","es":"Pareces preocupado. ¿Va todo bien?"},{"s":"B","en":"Not really. I had a bad day at work.","es":"No mucho. Tuve un mal día en el trabajo."},{"s":"A","en":"What happened?","es":"¿Qué pasó?"},{"s":"B","en":"My boss wasn't happy with my report, and he told me in front of everyone.","es":"Mi jefe no estaba contento con mi informe y me lo dijo delante de todos."},{"s":"A","en":"That's not fair. I'm sorry.","es":"Eso no es justo. Lo siento."},{"s":"B","en":"Thanks. I just feel a little embarrassed.","es":"Gracias. Solo me siento un poco avergonzado."},{"s":"A","en":"Do you want to go for a walk? It might help.","es":"¿Quieres ir a dar un paseo? Puede que te ayude."},{"s":"B","en":"Yes, that sounds good.","es":"Sí, me parece bien."}]},{"title":"Hablar de verdad","level":3,"lines":[{"s":"A","en":"Can I be honest with you? I've been feeling kind of lost lately.","es":"¿Puedo ser sincero contigo? Últimamente me siento un poco perdido."},{"s":"B","en":"Of course. What do you mean by lost?","es":"Claro. ¿A qué te refieres con perdido?"},{"s":"A","en":"I'm doing everything I'm supposed to do, but I don't feel excited about anything.","es":"Hago todo lo que se supone que debo hacer, pero nada me ilusiona."},{"s":"B","en":"I understand. I felt the same way last year, after I changed jobs.","es":"Te entiendo. Yo me sentí igual el año pasado, después de cambiar de trabajo."},{"s":"A","en":"Really? What helped you?","es":"¿En serio? ¿Qué te ayudó?"},{"s":"B","en":"Talking about it, mostly. And I started doing small things that I enjoyed, like cooking on weekends.","es":"Sobre todo, hablar de ello. Y empecé a hacer cosas pequeñas que me gustaban, como cocinar los fines de semana."},{"s":"A","en":"That makes sense. Maybe I need something outside of work that's just for me.","es":"Tiene sentido. Quizá necesito algo fuera del trabajo que sea solo para mí."},{"s":"B","en":"Exactly. And if it doesn't get better, it's okay to talk to a professional.","es":"Exacto. Y si no mejora, está bien hablar con un profesional."},{"s":"A","en":"Thanks for listening. I already feel a little lighter.","es":"Gracias por escucharme. Ya me siento un poco más ligero."}]}]},{"id":"university","title":"Universidad y estudio","icon":"book","desc":"Clases, exámenes, trabajos en grupo y profesores.","builds":[{"simple":["I have an exam tomorrow.","I need to study tonight."],"complex":"I have an exam tomorrow, so I need to study tonight.","es":"Tengo un examen mañana, así que necesito estudiar esta noche.","link":"so"},{"simple":["The class is interesting.","The professor talks too fast."],"complex":"The class is interesting, but the professor talks too fast.","es":"La clase es interesante, pero el profesor habla demasiado rápido.","link":"but"},{"simple":["I finish my degree.","I want to travel."],"complex":"When I finish my degree, I want to travel.","es":"Cuando termine la carrera, quiero viajar.","link":"when"},{"simple":["I study in the library.","It's quiet."],"complex":"I study in the library because it's quiet.","es":"Estudio en la biblioteca porque es tranquila.","link":"because"}],"convos":[{"title":"Antes de clase","level":1,"lines":[{"s":"A","en":"Hi! Is this the math class?","es":"¡Hola! ¿Es esta la clase de matemáticas?"},{"s":"B","en":"Yes, it is.","es":"Sí, lo es."},{"s":"A","en":"Is the professor nice?","es":"¿El profesor es simpático?"},{"s":"B","en":"Yes, but the exams are hard.","es":"Sí, pero los exámenes son difíciles."},{"s":"A","en":"Oh no!","es":"¡Oh, no!"},{"s":"B","en":"Don't worry. We can study together.","es":"No te preocupes. Podemos estudiar juntos."}]},{"title":"Trabajo en grupo","level":2,"lines":[{"s":"A","en":"When is the group project due?","es":"¿Cuándo hay que entregar el trabajo en grupo?"},{"s":"B","en":"Next Friday, so we only have one week.","es":"El viernes que viene, así que solo tenemos una semana."},{"s":"A","en":"Okay. Should we divide the work?","es":"Vale. ¿Nos dividimos el trabajo?"},{"s":"B","en":"Yes. I can do the research, and you can make the presentation.","es":"Sí. Yo puedo hacer la investigación y tú puedes hacer la presentación."},{"s":"A","en":"Sounds good. Can we meet on Wednesday to check everything?","es":"Me parece bien. ¿Podemos quedar el miércoles para revisarlo todo?"},{"s":"B","en":"Sure. Let's meet at the library at four.","es":"Claro. Quedemos en la biblioteca a las cuatro."}]},{"title":"Elegir carrera","level":3,"lines":[{"s":"A","en":"Have you decided what you're going to study next year?","es":"¿Ya has decidido qué vas a estudiar el año que viene?"},{"s":"B","en":"Not yet. My parents want me to study law, but I'm not sure it's for me.","es":"Todavía no. Mis padres quieren que estudie Derecho, pero no estoy seguro de que sea para mí."},{"s":"A","en":"What would you choose if it were only your decision?","es":"¿Qué elegirías si fuera solo tu decisión?"},{"s":"B","en":"Probably design. I've always loved drawing, and I spend hours on it without getting bored.","es":"Probablemente diseño. Siempre me ha encantado dibujar y paso horas haciéndolo sin aburrirme."},{"s":"A","en":"That's a good sign. Have you told your parents how you feel?","es":"Es buena señal. ¿Les has dicho a tus padres cómo te sientes?"},{"s":"B","en":"Sort of. They're worried that it's harder to find a stable job in design.","es":"Más o menos. Les preocupa que sea más difícil encontrar un trabajo estable en diseño."},{"s":"A","en":"That's a fair concern, but you could show them examples of people who work in the field.","es":"Es una preocupación razonable, pero podrías enseñarles ejemplos de gente que trabaja en ese campo."},{"s":"B","en":"You're right. If I have a real plan, they'll probably take me more seriously.","es":"Tienes razón. Si tengo un plan real, probablemente me tomen más en serio."}]}]},{"id":"travel","title":"Viajes","icon":"plane","desc":"Aeropuerto, hotel, pedir direcciones y contar tu viaje.","builds":[{"simple":["The flight was delayed.","We missed our connection."],"complex":"The flight was delayed, so we missed our connection.","es":"El vuelo se retrasó, así que perdimos la conexión.","link":"so"},{"simple":["I went to London.","I visited my cousin."],"complex":"I went to London to visit my cousin.","es":"Fui a Londres a visitar a mi primo.","link":"to"},{"simple":["The hotel was small.","It was very clean."],"complex":"Although the hotel was small, it was very clean.","es":"Aunque el hotel era pequeño, estaba muy limpio.","link":"although"},{"simple":["We were walking in the old town.","It started to rain."],"complex":"While we were walking in the old town, it started to rain.","es":"Mientras paseábamos por el casco antiguo, empezó a llover.","link":"while"}],"convos":[{"title":"Pedir direcciones","level":1,"lines":[{"s":"A","en":"Excuse me. Where is the train station?","es":"Perdone. ¿Dónde está la estación de tren?"},{"s":"B","en":"Go straight, then turn left.","es":"Siga recto y luego gire a la izquierda."},{"s":"A","en":"Is it far?","es":"¿Está lejos?"},{"s":"B","en":"No. It's about five minutes.","es":"No. Unos cinco minutos."},{"s":"A","en":"Thank you very much!","es":"¡Muchas gracias!"},{"s":"B","en":"You're welcome.","es":"De nada."}]},{"title":"En el hotel","level":2,"lines":[{"s":"A","en":"Hi, I have a reservation under the name García.","es":"Hola, tengo una reserva a nombre de García."},{"s":"B","en":"Welcome! Yes, a double room for three nights.","es":"¡Bienvenido! Sí, una habitación doble para tres noches."},{"s":"A","en":"That's right. Is breakfast included?","es":"Correcto. ¿El desayuno está incluido?"},{"s":"B","en":"Yes, it's served from seven to ten in the restaurant.","es":"Sí, se sirve de siete a diez en el restaurante."},{"s":"A","en":"Great. And what's the Wi-Fi password?","es":"Genial. ¿Y cuál es la contraseña del wifi?"},{"s":"B","en":"It's on your key card. Enjoy your stay!","es":"Está en su tarjeta de la habitación. ¡Disfrute de su estancia!"}]},{"title":"Contar un viaje","level":3,"lines":[{"s":"A","en":"So, how was your trip to Italy? I want to hear everything.","es":"¿Y qué tal tu viaje a Italia? Quiero saberlo todo."},{"s":"B","en":"It was amazing, although it didn't start very well.","es":"Fue increíble, aunque no empezó muy bien."},{"s":"A","en":"Why? What happened?","es":"¿Por qué? ¿Qué pasó?"},{"s":"B","en":"The airline lost my suitcase, so I spent the first day in the same clothes.","es":"La aerolínea perdió mi maleta, así que pasé el primer día con la misma ropa."},{"s":"A","en":"Oh no! Did they find it?","es":"¡Oh, no! ¿La encontraron?"},{"s":"B","en":"Yes, they brought it to the hotel the next morning, and after that everything was perfect.","es":"Sí, la llevaron al hotel a la mañana siguiente, y después de eso todo fue perfecto."},{"s":"A","en":"What was your favorite place?","es":"¿Cuál fue tu lugar favorito?"},{"s":"B","en":"Probably a small town near Florence where we ate the best pasta of my life.","es":"Probablemente un pueblito cerca de Florencia donde comimos la mejor pasta de mi vida."},{"s":"A","en":"You have to send me the name. I'm planning a trip there next summer.","es":"Tienes que mandarme el nombre. Estoy planeando un viaje allí el verano que viene."}]}]},{"id":"family","title":"Familia","icon":"home","desc":"Hermanos, padres, planes familiares y anécdotas.","builds":[{"simple":["I have two brothers.","They are older than me."],"complex":"I have two brothers who are older than me.","es":"Tengo dos hermanos que son mayores que yo.","link":"who"},{"simple":["My grandmother is eighty.","She still drives."],"complex":"My grandmother is eighty, but she still drives.","es":"Mi abuela tiene ochenta años, pero todavía conduce.","link":"but"},{"simple":["We eat together.","It's Sunday."],"complex":"We always eat together on Sundays.","es":"Siempre comemos juntos los domingos.","link":"on"},{"simple":["My sister got married.","I cried all day."],"complex":"When my sister got married, I cried all day.","es":"Cuando mi hermana se casó, lloré todo el día.","link":"when"}],"convos":[{"title":"Tu familia","level":1,"lines":[{"s":"A","en":"Do you have brothers or sisters?","es":"¿Tienes hermanos o hermanas?"},{"s":"B","en":"Yes, I have one sister.","es":"Sí, tengo una hermana."},{"s":"A","en":"Is she older or younger?","es":"¿Es mayor o menor?"},{"s":"B","en":"She's younger. She's sixteen.","es":"Es menor. Tiene dieciséis años."},{"s":"A","en":"Do you get along?","es":"¿Os lleváis bien?"},{"s":"B","en":"Yes, most of the time!","es":"¡Sí, casi siempre!"}]},{"title":"Planes del fin de semana","level":2,"lines":[{"s":"A","en":"What are you doing this weekend?","es":"¿Qué haces este fin de semana?"},{"s":"B","en":"I'm visiting my parents. It's my dad's birthday.","es":"Voy a visitar a mis padres. Es el cumpleaños de mi padre."},{"s":"A","en":"Nice! Are you having a party?","es":"¡Qué bien! ¿Vais a hacer una fiesta?"},{"s":"B","en":"Just a big lunch with the whole family. My mom is cooking paella.","es":"Solo una gran comida con toda la familia. Mi madre va a cocinar paella."},{"s":"A","en":"That sounds delicious. What did you buy him?","es":"Suena delicioso. ¿Qué le compraste?"},{"s":"B","en":"Nothing yet! Any ideas?","es":"¡Nada todavía! ¿Alguna idea?"},{"s":"A","en":"Maybe a book or a nice watch?","es":"¿Quizás un libro o un reloj bonito?"}]},{"title":"Anécdota familiar","level":3,"lines":[{"s":"A","en":"Your family seems really close. Was it always like that?","es":"Tu familia parece muy unida. ¿Siempre fue así?"},{"s":"B","en":"Not exactly. When I was a teenager, my brother and I fought all the time.","es":"No exactamente. Cuando era adolescente, mi hermano y yo nos peleábamos todo el tiempo."},{"s":"A","en":"What changed?","es":"¿Qué cambió?"},{"s":"B","en":"He moved abroad for work, and suddenly I realized how much I missed him.","es":"Se fue a vivir al extranjero por trabajo y de repente me di cuenta de cuánto lo echaba de menos."},{"s":"A","en":"That happens a lot. Distance makes you appreciate people more.","es":"Eso pasa mucho. La distancia hace que valores más a la gente."},{"s":"B","en":"Exactly. Now we call each other every week, and we tell each other everything.","es":"Exacto. Ahora nos llamamos cada semana y nos lo contamos todo."},{"s":"A","en":"Does he ever come back to visit?","es":"¿Vuelve alguna vez de visita?"},{"s":"B","en":"Every Christmas. My mom starts cooking three days before he arrives!","es":"Cada Navidad. ¡Mi madre empieza a cocinar tres días antes de que llegue!"}]}]},{"id":"random","title":"Cosas random","icon":"spark","desc":"Comida, el tiempo, series, planes y charla del día a día.","builds":[{"simple":["I'm hungry.","Let's order pizza."],"complex":"I'm hungry, so let's order pizza.","es":"Tengo hambre, así que pidamos pizza.","link":"so"},{"simple":["I started a new series.","I can't stop watching it."],"complex":"I started a new series that I can't stop watching.","es":"Empecé una serie nueva que no puedo dejar de ver.","link":"that"},{"simple":["It rains tomorrow.","We'll stay home."],"complex":"If it rains tomorrow, we'll stay home.","es":"Si llueve mañana, nos quedaremos en casa.","link":"if"},{"simple":["I lost my keys.","I was already late."],"complex":"I lost my keys when I was already late.","es":"Perdí las llaves cuando ya llegaba tarde.","link":"when"}],"convos":[{"title":"¿Qué comemos?","level":1,"lines":[{"s":"A","en":"I'm hungry.","es":"Tengo hambre."},{"s":"B","en":"Me too. What do you want?","es":"Yo también. ¿Qué quieres?"},{"s":"A","en":"Pizza?","es":"¿Pizza?"},{"s":"B","en":"Again? We had pizza yesterday.","es":"¿Otra vez? Comimos pizza ayer."},{"s":"A","en":"Okay, sushi then.","es":"Vale, entonces sushi."},{"s":"B","en":"Perfect!","es":"¡Perfecto!"}]},{"title":"Recomiéndame una serie","level":2,"lines":[{"s":"A","en":"Can you recommend a good series? I'm bored.","es":"¿Me recomiendas una buena serie? Estoy aburrido."},{"s":"B","en":"What kind of shows do you like?","es":"¿Qué tipo de series te gustan?"},{"s":"A","en":"Something funny, but not too silly.","es":"Algo divertido, pero no demasiado tonto."},{"s":"B","en":"I'm watching a comedy about a group of friends who open a restaurant.","es":"Estoy viendo una comedia sobre un grupo de amigos que abren un restaurante."},{"s":"A","en":"Is it long?","es":"¿Es larga?"},{"s":"B","en":"Three seasons, and the episodes are only twenty minutes.","es":"Tres temporadas, y los episodios duran solo veinte minutos."},{"s":"A","en":"Perfect. I'll start it tonight.","es":"Perfecto. La empiezo esta noche."}]},{"title":"Un día de mala suerte","level":3,"lines":[{"s":"A","en":"You won't believe the morning I've had.","es":"No te vas a creer la mañana que he tenido."},{"s":"B","en":"Uh-oh. What happened this time?","es":"Ay, ay. ¿Qué pasó esta vez?"},{"s":"A","en":"First, my alarm didn't go off, so I woke up forty minutes late.","es":"Primero, no me sonó la alarma, así que me desperté cuarenta minutos tarde."},{"s":"B","en":"That's a bad start.","es":"Mal comienzo."},{"s":"A","en":"Then I spilled coffee on my shirt while I was running to the bus.","es":"Luego me eché café en la camisa mientras corría hacia el autobús."},{"s":"B","en":"No way! Did you catch it at least?","es":"¡No puede ser! ¿Al menos lo pillaste?"},{"s":"A","en":"I did, but then I realized that I had left my wallet at home.",
