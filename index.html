":"El cliente te pregunta algo y no sabes la respuesta; quieres decirle que lo vas a comprobar y que le respondes mañana.","model":["That's a good question.","I'm not sure right now.","Let me check with the team.","I'll get back to you tomorrow.","Is that okay?"],"vocab":["check (comprobar)","get back to you (volver a contactarte)","right now (ahora mismo)"]},{"id":"s32","c":"Rutina diaria","idea":"Explicas tu tarde: sales del trabajo a las seis, vas al gimnasio, compras algo para cenar y llegas a casa sobre las ocho y media.","model":["I leave work at six.","Then I go to the gym for an hour.","On the way home, I buy something for dinner.","I usually get home at about half past eight."],"vocab":["leave work (salir del trabajo)","on the way home (de camino a casa)","get home (llegar a casa)"]},{"id":"s33","c":"Rutina diaria","idea":"Explicas tu domingo: te levantas tarde, desayunas tranquilo, llamas a tus padres, preparas la comida de la semana y por la tarde ves una película.","model":["On Sundays, I get up late.","I have a long breakfast.","Then I call my parents.","After lunch, I prepare food for the week.","In the evening, I watch a movie."],"vocab":["get up late (levantarse tarde)","prepare food (preparar comida)","in the evening (por la tarde-noche)"]},{"id":"s34","c":"Rutina diaria","idea":"Explicas cómo estudias inglés cada día: escuchas un audio en el metro, respondes preguntas en voz alta por la tarde y repasas tus errores antes de dormir.","model":["I practice English every day.","On the metro, I listen to a short audio.","In the afternoon, I answer questions out loud.","Before bed, I review my mistakes.","It only takes thirty minutes."],"vocab":["out loud (en voz alta)","review (repasar)","mistakes (errores)"]},{"id":"s35","c":"Problemas cotidianos","idea":"Llamas a la compañía de internet porque llevas dos días sin conexión, ya has reiniciado el router y necesitas que venga un técnico.","model":["Hi, I'm calling about my internet connection.","It hasn't worked for two days.","I've already restarted the router.","It still doesn't work.","Could you send a technician, please?"],"vocab":["restart (reiniciar)","router (router)","technician (técnico)","still (todavía)"]},{"id":"s36","c":"Problemas cotidianos","idea":"En el restaurante te traen un plato equivocado; quieres explicarlo con educación y pedir el que habías pedido.","model":["Excuse me.","I think there's a mistake.","I ordered the grilled chicken.","This is the fish.","Could you change it, please?"],"vocab":["mistake (error)","order (pedir)","change (cambiar)"]},{"id":"s37","c":"Problemas cotidianos","idea":"Explicas al vecino que su música está muy alta por la noche y que tú te levantas muy temprano para trabajar.","model":["Sorry to bother you.","Your music is quite loud at night.","I have to get up very early for work.","Could you turn it down after eleven?","Thanks a lot."],"vocab":["bother (molestar)","loud (alto, ruidoso)","turn down (bajar el volumen)"]},{"id":"s38","c":"Vida social","idea":"Invitas a un compañero a tomar algo el viernes después del trabajo para celebrar que habéis terminado el proyecto.","model":["We finally finished the project!","Let's celebrate.","Are you free on Friday after work?","We could go for a drink near the office.","What do you think?"],"vocab":["celebrate (celebrar)","be free (estar libre)","go for a drink (tomar algo)"]},{"id":"s39","c":"Vida social","idea":"Explicas a un amigo que llegas tarde a la cena porque la reunión se ha alargado y que empiecen sin ti.","model":["I'm so sorry.","My meeting took longer than expected.","I'll be about thirty minutes late.","Please start without me.","I'll be there as soon as I can."],"vocab":["take longer (alargarse)","than expected (de lo esperado)","as soon as I can (en cuanto pueda)"]},{"id":"s40","c":"Opiniones","idea":"Opinas que las reuniones deberían ser más cortas porque la gente pierde la concentración después de media hora y es mejor decidir rápido.","model":["In my opinion, meetings should be shorter.","After thirty minutes, people lose focus.","It's better to make decisions quickly.","We can send the details by email.","That's my view, anyway."],"vocab":["lose focus (perder la concentración)","make decisions (tomar decisiones)","details (detalles)"]},{"id":"s41","c":"Entrevista de trabajo","idea":"Explicas por qué quieres este trabajo: te interesan los proyectos internacionales, quieres crecer profesionalmente y te gusta trabajar en equipo.","model":["I'm very interested in international projects.","I want to grow professionally.","I also enjoy working in a team.","I think this job is a great opportunity for me.","And I believe I can add value to your team."],"vocab":["grow professionally (crecer profesionalmente)","opportunity (oportunidad)","add value (aportar valor)"]},{"id":"s42","c":"Entrevista de trabajo","idea":"Explicas un logro: redujiste los clashes de los informes a la mitad organizando revisiones semanales con cada disciplina.","model":["I'm proud of one achievement.","Our reports had too many clashes.","I organized weekly reviews with each discipline.","After three months, the clashes went down by half.","The client was very happy."],"vocab":["achievement (logro)","weekly reviews (revisiones semanales)","go down by half (reducirse a la mitad)"]}],"frame2":[{"k":"situation","label":"Situación","hint":"The situation is…","re":"\\bthe situation is\\b|\\bright now\\b|\\bat the moment\\b|\\bcurrently\\b|\\bat present\\b"},{"k":"problem","label":"Problema","hint":"The problem is…","re":"\\bthe (problem|issue|thing|challenge|risk) is\\b|\\bthe main (problem|issue) is\\b"},{"k":"action","label":"Qué hacer","hint":"What we need to do is…","re":"\\bwhat we need to do is\\b|\\bwe need to\\b|\\bwe should\\b|\\bwe have to\\b|\\blet's\\b|\\bi suggest\\b|\\bmy suggestion is\\b"}]};
const SE = {"shadow":[{"id":"sh1","title":"My morning routine","lines":[["My alarm goes off at half past six.","Mi alarma suena a las seis y media."],["I usually hit snooze once, maybe twice.","Normalmente la aplazo una vez, quizá dos."],["Then I get up, open the curtains and go straight to the kitchen.","Luego me levanto, abro las cortinas y voy directo a la cocina."],["I make a strong coffee and have some toast.","Me hago un café cargado y tomo unas tostadas."],["While I eat, I check the news on my phone.","Mientras como, miro las noticias en el móvil."],["After that, I take a quick shower and get dressed.","Después me doy una ducha rápida y me visto."],["I leave home at a quarter to eight.","Salgo de casa a las ocho menos cuarto."],["If I'm lucky, I catch the train on time.","Si tengo suerte, cojo el tren a tiempo."],["On the train, I listen to a podcast or answer a few emails.","En el tren, escucho un pódcast o contesto algunos correos."],["I get to the office at about half past eight.","Llego a la oficina sobre las ocho y media."],["The first thing I do is make another coffee.","Lo primero que hago es hacerme otro café."]]},{"id":"sh2","title":"Running late","lines":[["Hi, it's me. I'm really sorry, but I'm running late.","Hola, soy yo. Lo siento mucho, pero voy con retraso."],["My train stopped between two stations.","Mi tren se ha parado entre dos estaciones."],["We've been waiting for about fifteen minutes.","Llevamos unos quince minutos esperando."],["They say it's a technical problem.","Dicen que es un problema técnico."],["I think I'll be there in half an hour.","Creo que llegaré en media hora."],["Please start the meeting without me.","Por favor, empezad la reunión sin mí."],["I'll catch up as soon as I get there.","Me pondré al día en cuanto llegue."],["I've sent you the slides by email.","Te he enviado las diapositivas por correo."],["The figures are on page three.","Las cifras están en la página tres."],["If you need anything urgent, just call me.","Si necesitas algo urgente, llámame."],["Again, sorry about this. See you soon.","Otra vez, perdona. Nos vemos pronto."]]},{"id":"sh3","title":"Small talk in the elevator","lines":[["Morning! Cold today, isn't it?","¡Buenos días! Hace frío hoy, ¿verdad?"],["Yes, I almost didn't get out of bed.","Sí, casi no salgo de la cama."],["Are you heading to work?","¿Vas al trabajo?"],["Yeah, I've got a meeting at nine.","Sí, tengo una reunión a las nueve."],["How about you?","¿Y tú?"],["I'm working from home today, so I'm just going to the bakery.","Hoy trabajo desde casa, así que solo voy a la panadería."],["Lucky you! Have a good day.","¡Qué suerte! Que tengas un buen día."],["You too. See you around.","Igualmente. Nos vemos."],["By the way, did you hear about the new neighbors?","Por cierto, ¿te has enterado de los vecinos nuevos?"],["Yes, they moved in on the third floor last week.","Sí, se mudaron al tercer piso la semana pasada."],["They seem really nice.","Parecen muy simpáticos."],["Oh, this is my floor. Bye!","Ah, este es mi piso. ¡Adiós!"]]},{"id":"sh4","title":"A busy day at work","lines":[["Today was really hectic.","Hoy ha sido un día muy ajetreado."],["I had three meetings in the morning, one after another.","Tuve tres reuniones por la mañana, una detrás de otra."],["I barely had time for lunch.","Apenas tuve tiempo para comer."],["In the afternoon, I finally finished the report.","Por la tarde, por fin terminé el informe."],["I sent it to the client at around five.","Se lo envié al cliente sobre las cinco."],["Now I'm exhausted, but I'm happy it's done.","Ahora estoy agotado, pero contento de haberlo terminado."],["Tonight I just want to relax and watch something on TV.","Esta noche solo quiero relajarme y ver algo en la tele."],["Tomorrow will be a bit calmer, I hope.","Mañana será un poco más tranquilo, espero."],["I only have one meeting, at eleven.","Solo tengo una reunión, a las once."],["So I'm going to use the morning to catch up on emails.","Así que voy a aprovechar la mañana para ponerme al día con los correos."]]},{"id":"sh5","title":"Ordering coffee","lines":[["Hi, could I get a large latte, please?","Hola, ¿me pones un café con leche grande, por favor?"],["Sure. For here or to go?","Claro. ¿Para tomar aquí o para llevar?"],["To go, please.","Para llevar, por favor."],["Would you like anything else?","¿Quieres algo más?"],["Yes, one of those croissants, please.","Sí, uno de esos cruasanes, por favor."],["That's five fifty. Card or cash?","Son cinco cincuenta. ¿Tarjeta o efectivo?"],["Card, please. Thanks a lot.","Con tarjeta, por favor. Muchas gracias."],["Can I have a receipt, please?","¿Me puede dar el tique, por favor?"],["Of course. Here you go.","Claro. Aquí tiene."],["Your coffee will be ready in a minute at the end of the counter.","Su café estará listo en un minuto al final de la barra."],["Perfect. Have a nice day!","Perfecto. ¡Que tenga un buen día!"],["You too!","¡Igualmente!"]]},{"id":"sh6","title":"Weekend plans","lines":[["So, what are you doing this weekend?","Bueno, ¿qué haces este fin de semana?"],["Nothing special. I'm going to sleep in on Saturday.","Nada especial. El sábado voy a dormir hasta tarde."],["Then I'm meeting some friends for lunch.","Luego he quedado con unos amigos para comer."],["On Sunday, I need to do some chores.","El domingo tengo que hacer algunas tareas de casa."],["The flat is a mess, to be honest.","El piso está hecho un desastre, la verdad."],["What about you? Any plans?","¿Y tú? ¿Algún plan?"],["We might go to the beach if the weather is nice.","Puede que vayamos a la playa si hace buen tiempo."],["That sounds lovely. Send me some photos!","Qué bien suena. ¡Mándame fotos!"],["I will. And let's have lunch next week.","Lo haré. Y comamos juntos la semana que viene."],["Sure. How about Wednesday?","Claro. ¿Qué tal el miércoles?"],["Wednesday works for me.","El miércoles me va bien."]]},{"id":"sh7","title":"At the doctor's","lines":[["Hi, doctor. I haven't been feeling well lately.","Hola, doctor. No me encuentro bien últimamente."],["I've had a sore throat for three days.","Llevo tres días con dolor de garganta."],["Last night I had a bit of a fever.","Anoche tuve un poco de fiebre."],["I've taken some painkillers, but they don't help much.","He tomado analgésicos, pero no me ayudan mucho."],["I also feel really tired.","También me siento muy cansado."],["Do I need antibiotics?","¿Necesito antibióticos?"],["Let me have a look. Open your mouth, please.","Déjeme ver. Abra la boca, por favor."],["Your throat is a bit red, but it's not serious.","Tiene la garganta un poco roja, pero no es grave."],["You don't need antibiotics.","No necesita antibióticos."],["Drink plenty of water and get some rest.","Beba mucha agua y descanse."],["If it gets worse, come back next week.","Si empeora, vuelva la semana que viene."]]},{"id":"sh8","title":"Explaining a work problem","lines":[["Our goal is to reduce the number of clashes in each report.","Nuestro objetivo es reducir el número de clashes en cada informe."],["First, we need to review the clashes and identify the approved ones.","Primero, tenemos que revisar los clashes e identificar los aprobados."],["Then, we can check that they don't appear in the next report.","Después, podemos comprobar que no aparecen en el siguiente informe."],["This will help us reduce the number of clashes shown to the client.","Esto nos ayudará a reducir los clashes que mostramos al cliente."],["Does that make sense?","¿Se entiende?"],["The main point is that the client should only see new issues.","Lo principal es que el cliente solo vea incidencias nuevas."],["We don't want to show the same problems again and again.","No queremos mostrar los mismos problemas una y otra vez."],["So let's review the approved clashes before Friday.","Así que revisemos los clashes aprobados antes del viernes."],["I'll send you the list this afternoon.","Os mando la lista esta tarde."]]},{"id":"sh9","title":"Cooking dinner","lines":[["Tonight I'm making a simple pasta.","Esta noche voy a hacer una pasta sencilla."],["First, I chop an onion and some garlic.","Primero, pico una cebolla y un poco de ajo."],["I fry them in olive oil for a few minutes.","Los frío en aceite de oliva unos minutos."],["Then I add tomatoes and let it simmer.","Luego añado tomate y lo dejo a fuego lento."],["While the sauce is cooking, I boil the pasta.","Mientras se hace la salsa, cuezo la pasta."],["It takes about twenty minutes, and it's delicious.","Tarda unos veinte minutos y está buenísima."],["I add some salt, pepper and a bit of basil.","Le pongo sal, pimienta y un poco de albahaca."],["When the pasta is ready, I drain it and mix it with the sauce.","Cuando la pasta está lista, la escurro y la mezclo con la salsa."],["Sometimes I grate some cheese on top.","A veces le rallo un poco de queso por encima."],["It's my go-to dinner when I'm tired.","Es mi cena de emergencia cuando estoy cansado."]]},{"id":"sh10","title":"Catching up with a friend","lines":[["Hey! Long time no see. How have you been?","¡Hola! ¡Cuánto tiempo! ¿Qué tal estás?"],["Pretty good, thanks. Busy, but good.","Bastante bien, gracias. Liado, pero bien."],["I started a new job two months ago.","Empecé un trabajo nuevo hace dos meses."],["Really? That's great! How is it going?","¿En serio? ¡Qué bien! ¿Qué tal va?"],["It's challenging, but I'm learning a lot.","Es exigente, pero estoy aprendiendo mucho."],["We should grab a drink one of these days.","Deberíamos tomar algo un día de estos."],["Definitely. Let me know when you're free.","Por supuesto. Avísame cuando estés libre."],["How about Thursday after work?","¿Qué tal el jueves después del trabajo?"],["Thursday is perfect. Where shall we meet?","El jueves es perfecto. ¿Dónde quedamos?"],["There's a nice bar near my office.","Hay un bar agradable cerca de mi oficina."],["Great. I'll text you the address.","Genial. Te mando la dirección por mensaje."]]},{"id":"sh11","title":"Doing the shopping","lines":[["I usually do the shopping on Saturday mornings.","Normalmente hago la compra los sábados por la mañana."],["I always take a list, but I never stick to it.","Siempre llevo una lista, pero nunca la cumplo."],["I end up buying snacks I don't need.","Acabo comprando picoteo que no necesito."],["The supermarket is always crowded at that time.","El supermercado siempre está lleno a esa hora."],["So this week I'm going to try going on Friday evening.","Así que esta semana voy a probar a ir el viernes por la tarde."],["I've heard it's much quieter then.","He oído que entonces hay mucha menos gente."],["I'll also try to stick to my list this time.","Esta vez también intentaré cumplir la lista."],["No more snacks!","¡Se acabó el picoteo!"],["Well, maybe just one bag of crisps.","Bueno, quizá solo una bolsa de patatas."]]},{"id":"sh12","title":"Going to bed","lines":[["I try to go to bed before midnight.","Intento acostarme antes de medianoche."],["But to be honest, I often stay up too late.","Pero, sinceramente, muchas veces me quedo despierto hasta muy tarde."],["I start watching one episode, and then another one.","Empiezo a ver un episodio, y luego otro."],["The next morning, I feel groggy and tired.","A la mañana siguiente, me siento atontado y cansado."],["So now I leave my phone in the kitchen at night.","Así que ahora dejo el móvil en la cocina por la noche."],["It really helps me fall asleep.","Me ayuda mucho a dormirme."],["Instead of scrolling, I read a book for twenty minutes.","En lugar de mirar el móvil, leo un libro veinte minutos."],["I usually fall asleep before I finish a chapter.","Normalmente me duermo antes de terminar el capítulo."],["And I wake up feeling much better.","Y me despierto sintiéndome mucho mejor."]]},{"id":"sh13","title":"Giving a quick update","lines":[["Let me give you a quick update.","Os doy una actualización rápida."],["We finished the design phase last week.","Terminamos la fase de diseño la semana pasada."],["Right now, we're reviewing the client's comments.","Ahora mismo estamos revisando los comentarios del cliente."],["There are a few small changes, nothing major.","Hay algunos cambios pequeños, nada importante."],["We expect to send the final version on Friday.","Esperamos enviar la versión final el viernes."],["Any questions so far?","¿Alguna pregunta hasta aquí?"],["If not, I'll move on to the budget.","Si no, paso al presupuesto."],["So far, we're within budget.","Hasta ahora, estamos dentro del presupuesto."],["We've spent about sixty percent of it.","Hemos gastado un sesenta por ciento."],["I'll share the details in the report.","Compartiré los detalles en el informe."]]},{"id":"sh14","title":"A problem at home","lines":[["Hi, I'm calling about a problem in my flat.","Hola, llamo por un problema en mi piso."],["The washing machine stopped working this morning.","La lavadora dejó de funcionar esta mañana."],["There's water all over the kitchen floor.","Hay agua por todo el suelo de la cocina."],["I've turned off the water for now.","De momento he cerrado el agua."],["Could someone come and have a look today?","¿Podría venir alguien a echar un vistazo hoy?"],["I'll be at home all afternoon.","Estaré en casa toda la tarde."],["Yes, the washing machine is quite old.","Sí, la lavadora es bastante vieja."],["I think it might be the pipe at the back.","Creo que puede ser la tubería de atrás."],["Thank you. Please call me before you come.","Gracias. Llámeme antes de venir, por favor."],["My number is in the contract.","Mi número está en el contrato."]]},{"id":"sh15","title":"Working from home","lines":[["On Mondays and Fridays, I work from home.","Los lunes y los viernes trabajo desde casa."],["I start at nine, but I get up a bit later.","Empiezo a las nueve, pero me levanto un poco más tarde."],["I set up my laptop on the kitchen table.","Monto el portátil en la mesa de la cocina."],["The best part is that I don't have to commute.","Lo mejor es que no tengo que desplazarme."],["The worst part is that I sometimes forget to take breaks.","Lo peor es que a veces se me olvida hacer pausas."],["So now I set an alarm every two hours.","Así que ahora pongo una alarma cada dos horas."],["When it goes off, I stand up and stretch.","Cuando suena, me levanto y me estiro."],["At lunchtime, I go for a short walk around the block.","A la hora de comer, doy un paseo corto por la manzana."],["It really helps me clear my head.","Me ayuda mucho a despejarme."]]},{"id":"sh16","title":"At the supermarket checkout","lines":[["Hi there. Do you need a bag?","Hola. ¿Necesita bolsa?"],["No, thanks. I brought my own.","No, gracias. He traído la mía."],["Do you have a loyalty card?","¿Tiene tarjeta de cliente?"],["Yes, here you go.","Sí, aquí tiene."],["That's thirty-two euros and forty cents.","Son treinta y dos euros con cuarenta."],["Can I pay by card?","¿Puedo pagar con tarjeta?"],["Of course. Just tap it on the reader.","Claro. Acérquela al lector."],["Would you like the receipt?","¿Quiere el tique?"],["Yes, please. Thanks, have a good day.","Sí, por favor. Gracias, que tenga un buen día."]]},{"id":"sh17","title":"Calling in sick","lines":[["Hi, it's me. I'm afraid I can't come in today.","Hola, soy yo. Me temo que hoy no puedo ir."],["I woke up with a high temperature and a terrible headache.","Me he despertado con mucha fiebre y un dolor de cabeza horrible."],["I think I've caught the flu.","Creo que he pillado la gripe."],["I'm going to see the doctor this morning.","Voy a ir al médico esta mañana."],["I've already told the client about the delay.","Ya le he avisado al cliente del retraso."],["Laura can cover for me in the afternoon meeting.","Laura puede cubrirme en la reunión de la tarde."],["I'll check my emails if I feel a bit better later.","Miraré los correos si luego me encuentro un poco mejor."],["Sorry for the short notice.","Perdona por avisar con tan poco tiempo."]]},{"id":"sh18","title":"My commute","lines":[["My commute takes about forty minutes each way.","Mi trayecto dura unos cuarenta minutos de ida y otros tantos de vuelta."],["I walk to the metro station, which takes ten minutes.","Voy andando a la estación de metro, que está a diez minutos."],["Then I take line three and change at the city center.","Luego cojo la línea tres y hago transbordo en el centro."],["During rush hour, the trains are always packed.","En hora punta, los trenes siempre van llenos."],["I usually stand, so I can't read.","Normalmente voy de pie, así que no puedo leer."],["Instead, I listen to podcasts in English.","En su lugar, escucho pódcasts en inglés."],["It's a good way to use the time.","Es una buena forma de aprovechar el tiempo."],["On sunny days, I sometimes cycle to work instead.","Los días de sol, a veces voy en bici al trabajo."]]},{"id":"sh19","title":"Booking a table","lines":[["Hello, I'd like to book a table for Saturday night.","Hola, quería reservar una mesa para el sábado por la noche."],["Of course. For how many people?","Por supuesto. ¿Para cuántas personas?"],["For four, please, at around nine.","Para cuatro, por favor, sobre las nueve."],["Let me check. We have a table at nine fifteen.","Déjeme mirar. Tenemos una mesa a las nueve y cuarto."],["That's perfect.","Perfecto."],["Could we sit outside on the terrace?","¿Podríamos sentarnos fuera, en la terraza?"],["I'll make a note, but I can't promise it.","Lo apunto, pero no se lo puedo prometer."],["No problem. The name is García.","No hay problema. A nombre de García."],["Great, see you on Saturday.","Genial, nos vemos el sábado."]]},{"id":"sh20","title":"Explaining a delay to a client","lines":[["I'd like to give you an update on the schedule.","Quería informarle sobre el calendario."],["Unfortunately, we're running about a week behind.","Por desgracia, vamos una semana retrasados."],["The main reason is that some materials arrived late.","El motivo principal es que algunos materiales llegaron tarde."],["We've already reorganized the team to recover time.","Ya hemos reorganizado el equipo para recuperar tiempo."],["The new delivery date is the twentieth of next month.","La nueva fecha de entrega es el veinte del mes que viene."],["This won't affect the budget.","Esto no afectará al presupuesto."],["I'll send you a detailed plan by Friday.","Le enviaré un plan detallado antes del viernes."],["Does that work for you?","¿Le parece bien?"]]},{"id":"sh21","title":"Sunday with the family","lines":[["On Sundays, we usually have lunch at my parents' house.","Los domingos solemos comer en casa de mis padres."],["My mom always cooks way too much food.","Mi madre siempre cocina demasiada comida."],["My brother brings dessert, and I bring the wine.","Mi hermano trae el postre y yo el vino."],["We spend hours talking at the table.","Pasamos horas hablando en la mesa."],["My dad tells the same old stories every week.","Mi padre cuenta las mismas historias cada semana."],["But we still laugh every time.","Pero aun así nos reímos siempre."],["After lunch, we go for a walk in the park.","Después de comer, damos un paseo por el parque."],["It's my favorite part of the week.","Es mi parte favorita de la semana."]]},{"id":"sh22","title":"At the gym","lines":[["I try to go to the gym three times a week.","Intento ir al gimnasio tres veces por semana."],["I usually go early in the morning, before work.","Normalmente voy temprano por la mañana, antes de trabajar."],["It's quieter, and I don't have to wait for the machines.","Hay menos gente y no tengo que esperar por las máquinas."],["I start with ten minutes on the treadmill to warm up.","Empiezo con diez minutos en la cinta para calentar."],["Then I do some weights and finish with stretching.","Luego hago pesas y termino estirando."],["I'm not very fit yet, but I'm getting better.","Todavía no estoy muy en forma, pero voy mejorando."],["The hardest part is getting out of bed.","Lo más difícil es salir de la cama."],["Once I'm there, I always feel great.","Una vez allí, siempre me siento genial."]]},{"id":"sh23","title":"Asking for directions","lines":[["Excuse me, could you help me?","Perdone, ¿me puede ayudar?"],["I'm looking for the train station.","Estoy buscando la estación de tren."],["Sure. Go straight ahead until you reach the square.","Claro. Siga recto hasta llegar a la plaza."],["Then turn left at the bank.","Luego gire a la izquierda en el banco."],["The station is at the end of that street.","La estación está al final de esa calle."],["Is it far from here?","¿Está lejos de aquí?"],["No, it's about a ten-minute walk.","No, son unos diez minutos andando."],["Thank you so much.","Muchísimas gracias."],["You're welcome. Have a good trip!","De nada. ¡Buen viaje!"]]},{"id":"sh24","title":"A team meeting","lines":[["Okay, let's get started.","Bueno, empecemos."],["Today we have three points on the agenda.","Hoy tenemos tres puntos en el orden del día."],["First, the status of the current project.","Primero, el estado del proyecto actual."],["Second, the feedback from the client.","Segundo, los comentarios del cliente."],["And finally, the plan for next week.","Y por último, el plan para la semana que viene."],["Let's try to finish in thirty minutes.","Intentemos terminar en treinta minutos."],["Ana, could you start with the update?","Ana, ¿puedes empezar con la actualización?"],["Sure. We finished the model review yesterday.","Claro. Terminamos la revisión del modelo ayer."],["We found twelve clashes, and we've solved eight of them.","Encontramos doce clashes y hemos resuelto ocho."]]},{"id":"sh25","title":"Making small talk at a party","lines":[["Hi, I don't think we've met. I'm Carlos.","Hola, creo que no nos conocemos. Soy Carlos."],["Nice to meet you. I'm Emma.","Encantada. Soy Emma."],["How do you know Marta?","¿De qué conoces a Marta?"],["We work together. And you?","Trabajamos juntas. ¿Y tú?"],["We went to university together.","Fuimos juntos a la universidad."],["Oh, really? What did you study?","¿Ah, sí? ¿Qué estudiaste?"],["Architecture. It was a long time ago now.","Arquitectura. Fue hace mucho ya."],["Do you still work in that field?","¿Sigues trabajando en ese sector?"],["Yes, more or less. I coordinate building projects.","Sí, más o menos. Coordino proyectos de edificación."]]},{"id":"sh26","title":"Cleaning day","lines":[["Saturday morning is cleaning day at our place.","El sábado por la mañana toca limpieza en casa."],["We put on some music and share the chores.","Ponemos música y nos repartimos las tareas."],["I usually vacuum and mop the floors.","Yo normalmente paso la aspiradora y friego el suelo."],["My partner cleans the bathroom and the kitchen.","Mi pareja limpia el baño y la cocina."],["Then we change the sheets and do the laundry.","Luego cambiamos las sábanas y ponemos la lavadora."],["It takes about two hours.","Nos lleva unas dos horas."],["It's not fun, but the flat looks great afterwards.","No es divertido, pero el piso queda genial después."],["And then we have the rest of the weekend free.","Y luego tenemos el resto del fin de semana libre."]]},{"id":"sh27","title":"A job interview answer","lines":[["I've been working as a project coordinator for five years.","Llevo cinco años trabajando como coordinador de proyectos."],["My main responsibility is to make sure that everyone is on the same page.","Mi principal responsabilidad es que todos estén en la misma línea."],["I organize meetings, review models and track deadlines.","Organizo reuniones, reviso modelos y controlo los plazos."],["I'm good at solving problems under pressure.","Se me da bien resolver problemas bajo presión."],["For example, last year we had a big delay with a supplier.","Por ejemplo, el año pasado tuvimos un gran retraso con un proveedor."],["I reorganized the schedule, and we delivered on time.","Reorganicé el calendario y entregamos a tiempo."],["Now I'm looking for a role with more international projects.","Ahora busco un puesto con más proyectos internacionales."]]},{"id":"sh28","title":"Planning a trip","lines":[["We're planning a trip to Portugal in June.","Estamos planeando un viaje a Portugal en junio."],["We're going to fly to Lisbon and rent a car.","Vamos a volar a Lisboa y alquilar un coche."],["Then we'll drive down the coast to the Algarve.","Luego bajaremos en coche por la costa hasta el Algarve."],["We haven't booked the hotels yet.","Todavía no hemos reservado los hoteles."],["I want to find small places near the beach.","Quiero encontrar sitios pequeños cerca de la playa."],["My friend went last year and loved it.","Mi amigo fue el año pasado y le encantó."],["He said the food is amazing and not too expensive.","Dijo que la comida es increíble y no muy cara."],["I can't wait to switch off for a week.","Tengo muchas ganas de desconectar una semana."]]},{"id":"sh29","title":"Returning something to a shop","lines":[["Hi, I bought this jacket last week.","Hola, compré esta chaqueta la semana pasada."],["Unfortunately, it's too small for me.","Por desgracia, me queda pequeña."],["Could I exchange it for a larger size?","¿Podría cambiarla por una talla más grande?"],["Let me check. Do you have the receipt?","Déjeme ver. ¿Tiene el tique?"],["Yes, here it is. I haven't worn it.","Sí, aquí está. No me la he puesto."],["We don't have a large in this color.","No tenemos la talla grande en este color."],["Would you like it in black instead?","¿La quiere en negro?"],["Black is fine. Thank you.","El negro está bien. Gracias."]]},{"id":"sh30","title":"Talking about stress","lines":[["To be honest, this month has been really stressful.","La verdad es que este mes ha sido muy estresante."],["We have two big deadlines at the same time.","Tenemos dos entregas grandes a la vez."],["I've been working late almost every day.","He estado trabajando hasta tarde casi todos los días."],["I'm not sleeping well, and I feel tired all the time.","No duermo bien y estoy cansado todo el tiempo."],["I know I need to slow down a bit.","Sé que tengo que bajar un poco el ritmo."],["So this weekend I'm not going to check my emails.","Así que este fin de semana no voy a mirar el correo."],["I'm going to go hiking and spend time with friends.","Voy a ir de excursión y pasar tiempo con amigos."],["I think it will help me recharge.","Creo que me ayudará a recargar pilas."]]},{"id":"sh31","title":"Ordering food at a restaurant","lines":[["Are you ready to order?","¿Ya saben qué van a pedir?"],["Yes, I'll have the soup to start, please.","Sí, de primero tomaré la sopa, por favor."],["And for the main course?","¿Y de segundo?"],["The grilled fish with vegetables.","El pescado a la plancha con verduras."],["Would you like anything to drink?","¿Quieren algo de beber?"],["Just some sparkling water, please.","Solo agua con gas, por favor."],["Is there anything without gluten?","¿Hay algo sin gluten?"],["Yes, the fish and the salads are gluten-free.","Sí, el pescado y las ensaladas no llevan gluten."],["Perfect, thank you.","Perfecto, gracias."]]},{"id":"sh32","title":"Explaining a new process","lines":[["From next week, we're changing how we share files.","A partir de la semana que viene, cambiamos la forma de compartir archivos."],["The situation is that we have files in too many places.","La situación es que tenemos archivos en demasiados sitios."],["The problem is that people work on old versions.","El problema es que la gente trabaja con versiones antiguas."],["What we need to do is use one shared folder.","Lo que tenemos que hacer es usar una única carpeta compartida."],["Every file will follow the same naming rule.","Todos los archivos seguirán la misma regla de nombres."],["I'll send you a short guide today.","Hoy os envío una guía corta."],["If you have any questions, just let me know.","Si tenéis alguna pregunta, decídmelo."]]},{"id":"sh33","title":"Neighbors and noise","lines":[["Hi, sorry to bother you.","Hola, perdona que te moleste."],["I live in the flat below yours.","Vivo en el piso de debajo del tuyo."],["Last night there was a lot of noise until two in the morning.","Anoche hubo mucho ruido hasta las dos de la mañana."],["I have to get up very early for work.","Tengo que levantarme muy temprano para trabajar."],["Could you keep it down a bit after midnight?","¿Podríais bajar un poco el ruido después de medianoche?"],["Oh, I'm so sorry. It was my birthday.","Ay, lo siento mucho. Era mi cumpleaños."],["It won't happen again.","No volverá a pasar."],["No worries, and happy birthday!","No te preocupes, ¡y feliz cumpleaños!"]]},{"id":"sh34","title":"Learning English","lines":[["I can read English quite well.","Leo en inglés bastante bien."],["But when I have to speak, my mind goes blank.","Pero cuando tengo que hablar, me quedo en blanco."],["So now I practice a little every day.","Así que ahora practico un poco cada día."],["I repeat short audios to copy the rhythm.","Repito audios cortos para copiar el ritmo."],["I answer questions out loud without writing first.","Respondo preguntas en voz alta sin escribir antes."],["And I use short sentences: one idea per sentence.","Y uso frases cortas: una idea por frase."],["When I get stuck, I say: let me rephrase that.","Cuando me atasco, digo: déjame decirlo de otra manera."],["Little by little, it's getting easier.","Poco a poco, me resulta más fácil."]]},{"id":"sh35","title":"Saying good morning at work","lines":[["Morning, everyone! How was your weekend?","¡Buenos días a todos! ¿Qué tal el fin de semana?"],["Pretty good, thanks. I finally got some rest.","Bastante bien, gracias. Por fin descansé un poco."],["Lucky you. Mine was really busy.","Qué suerte. El mío fue muy ajetreado."],["We had my nephew's birthday party on Saturday.","El sábado tuvimos la fiesta de cumpleaños de mi sobrino."],["Twenty kids in one flat. Can you imagine?","Veinte niños en un piso. ¿Te lo imaginas?"],["Oh no! You must be exhausted.","¡Oh, no! Debes de estar agotado."],["I am. I need a big coffee before the meeting.","Lo estoy. Necesito un café enorme antes de la reunión."],["Let's grab one together. I'm going now.","Vamos a por uno juntos. Voy ahora."]]},{"id":"sh36","title":"At the pharmacy","lines":[["Hi, I need something for a sore throat.","Hola, necesito algo para el dolor de garganta."],["How long have you had it?","¿Cuánto tiempo hace que lo tiene?"],["Since yesterday. It hurts when I swallow.","Desde ayer. Me duele al tragar."],["Do you have a fever?","¿Tiene fiebre?"],["No, I don't think so.","No, creo que no."],["Try these lozenges. Take one every four hours.","Pruebe estas pastillas. Tome una cada cuatro horas."],["Drink warm water with honey, too.","Beba también agua tibia con miel."],["If it doesn't get better in three days, see a doctor.","Si no mejora en tres días, vaya al médico."]]},{"id":"sh37","title":"Talking about the weekend","lines":[["Last weekend was really relaxing.","El fin de semana pasado fue muy relajante."],["On Saturday morning, I went to the market.","El sábado por la mañana fui al mercado."],["I bought fresh fruit, cheese and some bread.","Compré fruta fresca, queso y un poco de pan."],["In the afternoon, I read on the balcony.","Por la tarde, leí en el balcón."],["On Sunday, we went hiking in the mountains.","El domingo fuimos de excursión a la montaña."],["The views were amazing, and the weather was perfect.","Las vistas eran increíbles y el tiempo, perfecto."],["We had lunch in a small village.","Comimos en un pueblo pequeño."],["I came home tired but very happy.","Volví a casa cansado, pero muy contento."]]},{"id":"sh38","title":"A short presentation","lines":[["Good morning. Thank you for coming.","Buenos días. Gracias por venir."],["Today I'm going to talk about our new process.","Hoy voy a hablar de nuestro nuevo proceso."],["The situation is that our reports are too long.","La situación es que nuestros informes son demasiado largos."],["The problem is that the client can't find the important issues.","El problema es que el cliente no encuentra las incidencias importantes."],["What we need to do is show only the critical clashes.","Lo que tenemos que hacer es mostrar solo los clashes críticos."],["This will save time for everyone.","Esto ahorrará tiempo a todos."],["Let me show you an example.","Les muestro un ejemplo."],["Does that make sense so far?","¿Se entiende hasta aquí?"]]},{"id":"sh39","title":"Buying train tickets","lines":[["Hi, I'd like a return ticket to Valencia, please.","Hola, quería un billete de ida y vuelta a Valencia, por favor."],["When would you like to travel?","¿Cuándo quiere viajar?"],["Tomorrow morning, and back on Sunday evening.","Mañana por la mañana, y vuelta el domingo por la tarde."],["There's a train at eight fifteen. Is that okay?","Hay un tren a las ocho y cuarto. ¿Le va bien?"],["Perfect. Can I have a window seat?","Perfecto. ¿Me puede dar asiento de ventanilla?"],["Sure. That's sixty-four euros in total.","Claro. Son sesenta y cuatro euros en total."],["Which platform does it leave from?","¿De qué andén sale?"],["Platform six. Check the screen before you go.","Andén seis. Mire la pantalla antes de ir."]]},{"id":"sh40","title":"My evening routine","lines":[["I usually get home at about seven.","Normalmente llego a casa sobre las siete."],["First, I take off my shoes and change my clothes.","Primero me quito los zapatos y me cambio de ropa."],["Then I check what's in the fridge and cook something simple.","Luego miro qué hay en la nevera y cocino algo sencillo."],["We have dinner at around nine.","Cenamos sobre las nueve."],["After dinner, I do the dishes and tidy up the kitchen.","Después de cenar, friego y recojo la cocina."],["I relax on the sofa for an hour.","Me relajo en el sofá una hora."],["Before bed, I prepare my bag for the next day.","Antes de acostarme, preparo la mochila para el día siguiente."],["I'm usually asleep by midnight.","Normalmente estoy dormido a medianoche."]]},{"id":"sh41","title":"Asking a colleague for help","lines":[["Hey, do you have a minute?","Oye, ¿tienes un minuto?"],["Sure, what's up?","Claro, ¿qué pasa?"],["I'm stuck with this model. Something isn't working.","Estoy atascado con este modelo. Algo no funciona."],["Let me have a look.","Déjame echar un vistazo."],["I think the problem is the file version.","Creo que el problema es la versión del archivo."],["You're using last week's file.","Estás usando el archivo de la semana pasada."],["Oh, that makes sense. Thanks a lot!","Ah, tiene sentido. ¡Muchas gracias!"],["No problem. Let me know if you need anything else.","De nada. Avísame si necesitas algo más."]]},{"id":"sh42","title":"At a hotel reception","lines":[["Good evening. I have a reservation for two nights.","Buenas noches. Tengo una reserva para dos noches."],["Can I have your name, please?","¿Me dice su nombre, por favor?"],["It's Hernández. H-E-R-N-A-N-D-E-Z.","Hernández. H-E-R-N-A-N-D-E-Z."],["Thank you. Could I see your passport?","Gracias. ¿Me enseña el pasaporte?"],["Here you are.","Aquí tiene."],["Your room is on the fourth floor. Breakfast is from seven to ten.","Su habitación está en la cuarta planta. El desayuno es de siete a diez."],["What time is check-out?","¿A qué hora hay que dejar la habitación?"],["At noon. Enjoy your stay!","A mediodía. ¡Disfrute de su estancia!"]]},{"id":"sh43","title":"Talking about a series","lines":[["Have you seen that new series everyone is talking about?","¿Has visto esa serie nueva de la que habla todo el mundo?"],["Not yet. Is it good?","Todavía no. ¿Está bien?"],["It's brilliant. I watched three episodes last night.","Es buenísima. Anoche vi tres episodios."],["What's it about?","¿De qué va?"],["It's about a family that runs a restaurant in New York.","Va de una familia que lleva un restaurante en Nueva York."],["It sounds a bit boring, to be honest.","Suena un poco aburrida, la verdad."],["I thought so too, but it's really funny.","Yo también lo pensaba, pero es muy divertida."],["Okay, I'll give it a try this weekend.","Vale, le daré una oportunidad este fin de semana."]]},{"id":"sh44","title":"A complaint at a restaurant","lines":[["Excuse me, I'm sorry, but there's a problem with my order.","Perdone, lo siento, pero hay un problema con mi pedido."],["I asked for the steak well done, and it's quite rare.","Pedí el filete muy hecho y está bastante crudo."],["Oh, I'm so sorry about that.","Ay, lo siento mucho."],["I'll take it back to the kitchen right away.","Lo llevo a la cocina enseguida."],["Thank you. Could I also have some more water?","Gracias. ¿Me podría traer también más agua?"],["Of course. And the dessert is on us tonight.","Por supuesto. Y el postre corre de nuestra cuenta esta noche."],["That's very kind. Thank you.","Muy amable. Gracias."]]},{"id":"sh45","title":"Planning the week","lines":[["On Sunday evenings, I plan my week.","Los domingos por la tarde planifico mi semana."],["I write down my meetings and deadlines.","Apunto mis reuniones y plazos."],["Then I choose three main goals.","Luego elijo tres objetivos principales."],["I also plan when I'm going to exercise.","También planifico cuándo voy a hacer ejercicio."],["I try to keep one evening free for friends.","Intento dejar una tarde libre para los amigos."],["It only takes twenty minutes.","Solo me lleva veinte minutos."],["But it makes my Mondays much less stressful.","Pero hace que mis lunes sean mucho menos estresantes."]]},{"id":"sh46","title":"Talking to a new neighbor","lines":[["Hi! Are you the new neighbor on the second floor?","¡Hola! ¿Eres el nuevo vecino del segundo?"],["Yes, I moved in last week. I'm Sara.","Sí, me mudé la semana pasada. Soy Sara."],["Nice to meet you. I'm Andrés, from the fifth floor.","Encantado. Soy Andrés, del quinto."],["How are you finding the building?","¿Qué te parece el edificio?"],["I like it. It's quiet, and the neighbors are friendly.","Me gusta. Es tranquilo y los vecinos son simpáticos."],["If you need anything, just knock on my door.","Si necesitas algo, llama a mi puerta."],["Thanks, that's really kind of you.","Gracias, eres muy amable."]]},{"id":"sh47","title":"Explaining a mistake","lines":[["I need to tell you something about the report.","Tengo que contarte algo sobre el informe."],["I made a mistake in the numbers on page five.","Me equivoqué en las cifras de la página cinco."],["I used the old data by accident.","Usé los datos antiguos sin querer."],["I've already corrected it.","Ya lo he corregido."],["I'm sending you the new version now.","Te envío ahora la versión nueva."],["Next time, I'll double-check the source before I send it.","La próxima vez, comprobaré la fuente antes de enviarlo."],["Sorry for the inconvenience.","Disculpa las molestias."]]},{"id":"sh48","title":"A rainy day","lines":[["It's been raining since early this morning.","Lleva lloviendo desde primera hora de la mañana."],["I got soaked on my way to work.","Me empapé de camino al trabajo."],["I forgot my umbrella at home, of course.","Se me olvidó el paraguas en casa, claro."],["The streets are full of puddles.","Las calles están llenas de charcos."],["The good thing is that the traffic is lighter today.","Lo bueno es que hoy hay menos tráfico."],["Tonight I'm going to stay in and watch a movie.","Esta noche me voy a quedar en casa a ver una película."],["Rainy days are perfect for that.","Los días de lluvia son perfectos para eso."]]},{"id":"sh49","title":"Talking about a hobby","lines":[["A year ago, I started playing the guitar.","Hace un año empecé a tocar la guitarra."],["At first, it was really hard.","Al principio era muy difícil."],["My fingers hurt, and I couldn't play a single song.","Me dolían los dedos y no sabía tocar ni una canción."],["But I practiced for twenty minutes every day.","Pero practiqué veinte minutos cada día."],["Little by little, it got easier.","Poco a poco se hizo más fácil."],["Now I can play about ten songs.","Ahora sé tocar unas diez canciones."],["It's my favorite way to relax after work.","Es mi forma favorita de relajarme después del trabajo."]]},{"id":"sh50","title":"Asking for a day off","lines":[["Hi, do you have a moment?","Hola, ¿tienes un momento?"],["I'd like to ask for a day off next Friday.","Quería pedir el viernes que viene libre."],["My brother is getting married, and the wedding is in another city.","Mi hermano se casa y la boda es en otra ciudad."],["I've finished my main tasks for the week.","He terminado mis tareas principales de la semana."],["Laura has agreed to cover for me if anything comes up.","Laura ha aceptado cubrirme si surge algo."],["Would that be okay?","¿Te parecería bien?"],["Sure, no problem. Congratulations to your brother!","Claro, sin problema. ¡Felicidades a tu hermano!"]]},{"id":"sh51","title":"At the gym reception","lines":[["Hi, I'm interested in joining the gym.","Hola, me interesa apuntarme al gimnasio."],["Great! We have monthly and yearly memberships.","¡Genial! Tenemos cuotas mensuales y anuales."],["How much is the monthly one?","¿Cuánto cuesta la mensual?"],["It's forty euros, and it includes all the classes.","Son cuarenta euros e incluye todas las clases."],["Do you have yoga in the evenings?","¿Tenéis yoga por las tardes?"],["Yes, on Mondays and Wednesdays at seven.","Sí, los lunes y miércoles a las siete."],["Can I try a class before I sign up?","¿Puedo probar una clase antes de apuntarme?"],["Of course. The first class is free.","Por supuesto. La primera clase es gratis."]]},{"id":"sh52","title":"A video call with a client","lines":[["Hi, can you hear me okay?","Hola, ¿me oyes bien?"],["Yes, perfectly. Can you see my screen?","Sí, perfectamente. ¿Ves mi pantalla?"],["Yes, I can see the report.","Sí, veo el informe."],["Great. Let me walk you through the main issues.","Genial. Te explico las incidencias principales."],["There are twelve open clashes this week.","Esta semana hay doce clashes abiertos."],["Five of them are critical.","Cinco de ellos son críticos."],["We need your decision on two of them by Thursday.","Necesitamos tu decisión sobre dos de ellos antes del jueves."],["Does that work for you?","¿Te va bien?"]]},{"id":"sh53","title":"Talking about childhood","lines":[["When I was a kid, I lived in a small town.","De niño, vivía en un pueblo pequeño."],["We didn't have much, but we were happy.","No teníamos mucho, pero éramos felices."],["I spent every afternoon playing in the street.","Pasaba todas las tardes jugando en la calle."],["My grandmother lived next door.","Mi abuela vivía en la casa de al lado."],["She made the best cakes in the world.","Hacía los mejores bizcochos del mundo."],["In summer, we went to the river to swim.","En verano íbamos al río a nadar."],["I still miss those long, simple days.","Todavía echo de menos aquellos días largos y sencillos."]]},{"id":"sh54","title":"Moving house","lines":[["We're moving house next month.","Nos mudamos el mes que viene."],["The new flat is bigger and closer to my office.","El piso nuevo es más grande y está más cerca de mi oficina."],["We've already started packing.","Ya hemos empezado a hacer cajas."],["There are boxes everywhere.","Hay cajas por todas partes."],["I'm trying to throw away things I don't need.","Intento tirar cosas que no necesito."],["It's surprising how much stuff we have.","Sorprende la cantidad de cosas que tenemos."],["I can't wait to finally move in.","Tengo muchas ganas de mudarme por fin."]]},{"id":"sh55","title":"Talking about a book","lines":[["I've just finished a great book.","Acabo de terminar un libro estupendo."],["It's a novel about a woman who travels around Africa.","Es una novela sobre una mujer que viaja por África."],["The story is simple, but the characters are amazing.","La historia es sencilla, pero los personajes son increíbles."],["I couldn't put it down.","No podía dejar de leerlo."],["I read the last hundred pages in one night.","Leí las últimas cien páginas en una noche."],["I'll lend it to you if you want.","Te lo presto si quieres."],["I think you'll love it.","Creo que te va a encantar."]]},{"id":"sh56","title":"Organizing a dinner","lines":[["Are you free on Saturday night?","¿Estás libre el sábado por la noche?"],["I'm organizing a dinner at my place.","Estoy organizando una cena en mi casa."],["There will be about eight people.","Seremos unas ocho personas."],["I'm going to cook a big paella.","Voy a cocinar una paella grande."],["Could you bring something to drink?","¿Podrías traer algo de beber?"],["Sure! What time should I come?","¡Claro! ¿A qué hora vengo?"],["Around eight thirty. See you then!","Sobre las ocho y media. ¡Nos vemos!"]]},{"id":"sh57","title":"A delayed flight","lines":[["Attention, please. Flight two four seven to London is delayed.","Atención, por favor. El vuelo dos cuatro siete a Londres va con retraso."],["The new departure time is eleven forty.","La nueva hora de salida es las once y cuarenta."],["Oh no, I'm going to miss my connection.","Oh, no, voy a perder mi conexión."],["Excuse me, I have a connecting flight in London.","Perdone, tengo un vuelo de conexión en Londres."],["Let me check. You'll probably miss it.","Déjeme mirar. Probablemente lo perderá."],["But I can book you on the next one now.","Pero puedo reservarle en el siguiente ahora."],["Thank you, that would be great.","Gracias, sería genial."]]},{"id":"sh58","title":"Feeling better","lines":[["I was sick for most of last week.","Estuve enfermo casi toda la semana pasada."],["I had a terrible cold and a fever.","Tuve un resfriado horrible y fiebre."],["I stayed in bed for three days.","Me quedé en cama tres días."],["I drank a lot of tea and slept a lot.","Bebí mucho té y dormí mucho."],["Now I'm feeling much better.","Ahora me encuentro mucho mejor."],["I went back to work yesterday.","Volví al trabajo ayer."],["I still have a bit of a cough, but nothing serious.","Todavía tengo un poco de tos, pero nada grave."]]},{"id":"sh59","title":"Giving feedback","lines":[["I'd like to give you some feedback on the presentation.","Quería darte algunos comentarios sobre la presentación."],["First of all, it was really clear.","Ante todo, fue }

const CONTR={"i'm":"yo soy / yo estoy (I am)","you're":"tú eres / estás (you are)","we're":"nosotros somos / estamos","they're":"ellos son / están","he's":"él es / está / ha","she's":"ella es / está / ha","it's":"es / está (it is)","that's":"eso es","there's":"hay (there is)","what's":"qué es","let's":"vamos a… (let us)","don't":"no (do not)","doesn't":"no (does not)","didn't":"no (pasado: did not)","can't":"no poder (cannot)","won't":"no (futuro: will not)","wasn't":"no era / no estaba","isn't":"no es / no está","aren't":"no son / no están","haven't":"no he / no hemos","hasn't":"no ha","i'll":"yo + futuro (I will)","you'll":"tú + futuro (you will)","we'll":"nosotros + futuro","they'll":"ellos + futuro","i've":"yo he (I have)","you've":"tú has","we've":"hemos","i'd":"yo + condicional (I would / I had)","couldn't":"no podía / no podría","shouldn't":"no debería","wouldn't":"no + condicional","you'd":"tú + condicional","he'd":"él + condicional","we'd":"nosotros + condicional","they'd":"ellos + condicional","here's":"aquí está","who's":"quién es","how's":"cómo está","where's":"dónde está","dad's":"de papá","mom's":"de mamá"};
const NAMES={"david":"David (nombre)","laura":"Laura (nombre)","garcía":"García (apellido)","italy":"Italia","london":"Londres","florence":"Florencia","madrid":"Madrid","real":"real, verdadero","atlético":"Atlético (equipo)","paella":"paella","sushi":"sushi","uh-oh":"¡ay, ay!","wi-fi":"wifi","ha":"¡ja!","sundays":"los domingos"};
function lookup(raw){
  const w=raw.toLowerCase().replace(/[’]/g,"'").replace(/^'+|'+$/g,'');
  if(CONTR[w]) return {w:raw,p:'contr.',t:CONTR[w]};
  if(NAMES[w]) return {w:raw,p:'',t:NAMES[w]};
  if(DICT.has(w)) return DICT.get(w);
  if(DATA.lem[w]&&DICT.has(DATA.lem[w])) return Object.assign({},DICT.get(DATA.lem[w]),{from:w});
  const base=w.replace(/'s$/,'');
  const tries=[base, base.replace(/ies$/,'y'), base.replace(/es$/,''), base.replace(/s$/,''), base.replace(/ied$/,'y'), base.replace(/ed$/,''), base.replace(/d$/,''), base.replace(/ing$/,''), base.replace(/ing$/,'e'), base.replace(/([a-z])\1(ed|ing)$/,'$1'), base.replace(/er$/,''), base.replace(/est$/,''), base.replace(/ly$/,'')];
  for(const t of tries){ if(t&&DICT.has(t)) return Object.assign({},DICT.get(t),{from:w}); }
  return null;
}

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/natural|google|samantha|aria|jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,opts={}){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){res();return;}
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; if(voice) u.voice=voice;
    u.rate=S.speed*(opts.rate||1); u.pitch=opts.pitch||1;
    let done=false; const fin=()=>{ if(!done){ done=true; clearTimeout(tm); res(); } };
    const tm=setTimeout(fin, Math.max(3500, text.length*110/(S.speed*(opts.rate||1))));
    u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u);
  });
}
function stopSpeech(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function wordify(text){
  return esc(text).replace(/[A-Za-zÀ-ÿ]+(?:['’-][A-Za-z]+)*/g,m=>`<span class="w" data-w="${m}">${m}</span>`);
}
let popTimer;
function showPop(word){
  const e=lookup(word); const pop=$('#pop');
  pop.innerHTML=`<div class="pt"><div class="pw">${esc(word)}</div><div class="pp">${e?esc(e.p||'')+(e.r?' · #'+e.r:''):''}</div><div>${e?esc(e.t):'Sin traducción en el diccionario'}</div></div><button type="button" id="popSay">Oír</button>`;
  pop.hidden=false;

  speak(word);
  clearTimeout(popTimer); popTimer=setTimeout(()=>pop.hidden=true,6000);
}

  if(w && !w.closest('.hiddenline')){showPop(w.dataset.w);return;}
  if(!e.target.closest('#pop')) $('#pop').hidden=true;
});
function norm(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean)}
function similarity(a,b){
  const A=norm(a),B=norm(b); if(!B.length) return 0;
  const bag={}; A.forEach(x=>bag[x]=(bag[x]||0)+1);
  let hit=0; B.forEach(x=>{if(bag[x]){hit++;bag[x]--}});
  return hit/Math.max(B.length,A.length);
}

    el.querySelector('.slowline').onclick=()=>{stopSpeech();speak(l.en,{rate:.65})};

        const ga=G.analyze(inp.value);

  });
  $('#playAll').onclick=playAll;
  $('#stopAll').onclick=()=>{P.playing=false;stopSpeech();view.querySelectorAll('.line').forEach(x=>x.classList.remove('playing'))};
  $('#markDone').onclick=()=>{S.done[key]=1;save();renderConvo()};
  const n=$('#nextC'); if(n) n.onclick=()=>go({name:'convo',topic:t.id,i:route.i+1});
  async function playAll(){
    stopSpeech(); P.playing=true;
    for(let i=0;i<c.lines.length;i++){
      if(!P.playing||route.name!=='convo') break;
      const el=view.querySelector(`.line[data-i="${i}"]`);
      view.querySelectorAll('.line').forEach(x=>x.classList.remove('playing'));

      if(el.classList.contains('hiddenline')){ await new Promise(r=>setTimeout(r,3500)); el.classList.remove('hiddenline'); }
      await speak(c.lines[i].en,{pitch:c.lines[i].s==='A'?1:1.15});

  }

const DAY=864e5, INTERVALS=[0,1,3,7,16,35];
let W={queue:[],cur:null,flipped:false};
function todayKey(){const d=new Date();return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
if(S.deck===undefined) S.deck='all';
function deckWords(){ if(S.deck==='all') return WORDS; const t=THEMES[+S.deck]; return t?t.words:WORDS; }
function deckName(){ return S.deck==='all'?'Todas, por frecuencia':(THEMES[+S.deck]||{}).name||''; }
function deckStats(words){ let m=0,l=0; for(const w of words){const s=S.srs[w]; if(!s) continue; if(s.b>=4) m++; else l++;} return {m,l,n:words.length}; }
function buildQueue(){
  const now=Date.now(); const ws=deckWords(); const inDeck=S.deck==='all'?null:new Set(ws);
  const due=Object.keys(S.srs).filter(k=>S.srs[k].due<=now&&DICT.has(k)&&(!inDeck||inDeck.has(k))).sort((a,b)=>S.srs[a].due-S.srs[b].due);
  if(S.newDay!==todayKey()){S.newDay=todayKey();S.newToday=0;save();}
  const newLeft=Math.max(0,S.newPerDay-(S.newToday||0));
  const fresh=ws.filter(w=>!S.srs[w]).slice(0,newLeft);
  return [...due,...fresh];
}
function grade(g){
  const w=W.cur; const s=S.srs[w]||{b:0,due:0};
  if(!S.srs[w]){S.newToday=(S.newToday||0)+1;}
  if(g===0) s.b=0; else if(g===1) s.b=Math.max(1,s.b); else s.b=Math.min(5,s.b+1);
  s.due=Date.now()+(g===0?60e3: INTERVALS[s.b]*DAY || 10*60e3);
  S.srs[w]=s; save();
  if(g===0) W.queue.splice(Math.min(4,W.queue.length),0,w);
  next();
}
function next(){W.cur=W.queue.shift()||null;W.flipped=false;renderWords(true)}
const KIND={pv:'phrasal verb',exp:'expresión',n:'sustantivo',v:'verbo',adj:'adjetivo',adv:'adverbio',prep:'preposición',conj:'conector',pron:'pronombre',det:'determinante',num:'número',interj:'interjección','contr.':'contracción'};

const POSMAP={}; DATA.dict.forEach(([w,p])=>{ if(!/\s/.test(w)) POSMAP[w.toLowerCase()]=p; });

const EXT=EX.tenses; const TBY={}; EXT.forEach(t=>TBY[t.id]=t);
S.gym=S.gym||{}; S.gymDone=S.gymDone||{};
const tname=id=>(TBY[id]&&TBY[id].name)||G.LABEL[id]||id;
function allItems(){
  const out=[];
  EX.answer.forEach((e,i)=>out.push({id:'a'+i,kind:'answer',t:e.t,q:e.q,es:e.es,hint:e.hint,model:e.model,target:{tense:[e.t],neg:e.neg,question:e.question,person:e.person,minWords:3}}));
  EX.transform.forEach((e,i)=>out.push({id:'t'+i,kind:'transform',t:e.to,src:e.src,label:e.label,model:e.model,target:{tense:[e.to],neg:e.neg,question:e.question,person:e.person,verb:e.verb}}));
  return out;
}
const ITEMS=allItems();
function chainItems(topic){
  return (EX.chains[topic]||[]).map((c,i)=>({id:'c:'+topic+':'+i,kind:'answer',t:c.t,q:c.q,hint:c.hint,target:{tense:[c.t],person:c.person,minWords:3}}));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function mixedSet(n){
  const pool=shuffle(ITEMS); const out=[];
  while(out.length<n&&pool.length){
    const last=out[out.length-1];
    let k=pool.findIndex(x=>!last||x.t!==last.t);
    if(k<0) k=0;
    out.push(pool.splice(k,1)[0]);
  }
  return out;
}
function tenseStats(id){
  const items=ITEMS.filter(x=>x.t===id);
  const done=items.filter(x=>S.gymDone[x.id]).length;
  return {done,total:items.length};
}

/* ---------- daily challenge + surprise mode ---------- */
let TIMER=null;
function clearTimer(){ if(TIMER){clearInterval(TIMER);TIMER=null;} }
function normText(t){ return ' '+t.toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ')+' '; }
function wordsOf(t){ return normText(t).trim().split(' ').filter(Boolean); }
function hasLemma(w,lemma){ if(w===lemma) return true; const f=G.FORM[w]; return !!f&&f.some(x=>x.lemma===lemma); }
function matchChallenge(text,ch){
  const n=normText(text);
  if(ch.kind==='phrasal'){
    const W=wordsOf(text), parts=ch.p.split(' ');
    for(let i=0;i<W.length;i++){
      if(!hasLemma(W[i],ch.v)) continue;
      for(let j=i+1;j<=Math.min(W.length-parts.length,i+4);j++){
        if(parts.every((p,k)=>W[j+k]===p)) return true;
      }
    }
    return false;
  }
  const phrase=(ch.w||'').toLowerCase();
  if(phrase.includes(' ')) return n.includes(' '+phrase+' ');
  const W=wordsOf(text);
  const alts=[phrase,phrase.replace(/ize$/,'ise'),phrase.replace(/ise$/,'ize')];
  return W.some(w=>alts.some(a=>w===a||hasLemma(w,a)));
}
function chLabel(ch){ return ch.kind==='phrasal'?`${ch.v} ${ch.p}`:ch.w; }
function chKindName(ch){ return {phrasal:'Phrasal verb',time:'Conector temporal',logic:'Conector',words:'Palabra C1',rescue:'Frase de rescate'}[ch.kind]; }
const CHALL={};
['time','logic','phrasal','words'].forEach(k=>CHALL[k]=CH[k].map(x=>Object.assign({kind:k},x)));
CHALL.rescue=SX.rescue.flatMap(r=>r.items).filter(it=>!/…/.test(it.en)||/…$/.test(it.en)).map(it=>({kind:'rescue',w:it.en.replace(/[…?.!]+$/,'').replace(/[,]/g,''),es:it.es,ex:''}));
function c1Meter(text,a){
  const W=wordsOf(text).length;
  const conns=[...CHALL.time,...CHALL.logic].filter(c=>matchChallenge(text,c)).map(c=>c.w);
  const phr=CHALL.phrasal.filter(c=>matchChallenge(text,c)).map(chLabel);
  const tenses=a.tenses.filter(t=>t!=='imperative').length;
  let score=0;
  if(W>=12) score++; if(W>=22) score++;
  if(conns.length>=1) score++; if(conns.length+phr.length>=2) score++;
  if(phr.length>=1) score++; if(tenses>=2) score++;
  const level=score>=5?'C1':score>=3?'B2+':score>=2?'B2':'B1';
  const tips=[];
  if(W<12) tips.push('Añade otra frase corta con un motivo o un ejemplo (because…, for example…).');
  if(!conns.length) tips.push(`Añade un conector: ${pick(CHALL.logic).w}, ${pick(CHALL.time).w}…`);
  if(!phr.length) tips.push(`Mete un phrasal verb, por ejemplo "${chLabel(pick(CHALL.phrasal))}".`);
  if(tenses<2) tips.push('Combina dos tiempos verbales (por ejemplo, pasado + presente perfecto).');
  return {W,conns,phr,tenses,level,score,tips};
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function seeded(seed){ let h=1779033703^seed.length; for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;} return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function meterHTML(m){
  return `<div class="c1meter"><div class="c1top"><span class="eyebrow">Nivel de tu respuesta</span><span class="lvlpill lv-${m.level.replace('+','p')}">${m.level}</span></div>
    <div class="c1bars">${[0,1,2,3,4,5].map(i=>`<i class="${i<m.score?'on':''}"></i>`).join('')}</div>
    <span class="muted" style="font-size:.84rem">${m.W} palabras · ${m.conns.length} conector${m.conns.length===1?'':'es'}${m.conns.length?` (${m.conns.join(', ')})`:''} · ${m.phr.length} phrasal${m.phr.length?` (${m.phr.join(', ')})`:''} · ${m.tenses} tiempo${m.tenses===1?'':'s'} verbal${m.tenses===1?'':'es'}</span>
    ${m.tips.length?`<ul class="msgs">${m.tips.slice(0,2).map(t=>`<li class="i">${esc(t)}</li>`).join('')}</ul>`:''}</div>`;
}
function challengeHTML(chs,text){
  return `<div class="chips">${chs.map(c=>{const ok=text!==undefined&&matchChallenge(text,c);return `<span class="chall ${text===undefined?'':ok?'ok':'no'}"><small>${esc(chKindName(c))}</small><b>${esc(chLabel(c))}</b><em>${esc(c.es)}</em>${text===undefined?'':ok?'<span class="mark">✓</span>':'<span class="mark">✗</span>'}</span>`}).join('')}</div>`;
}

/* --- daily --- */
const DAILY=DQ.map((d,i)=>Object.assign({id:'d'+i},d));
function todaySet(){
  const key=dayKey();
  if(S.daily&&S.daily.date===key&&S.daily.ids&&S.daily.ids.length) return S.daily;
  const rnd=seeded(key);
  const seen=S.dailySeen||{};
  let pool=DAILY.filter(d=>!seen[d.id]); if(pool.length<10){ S.dailySeen={}; pool=DAILY.slice(); }
  pool=pool.map(d=>({d,r:rnd()})).sort((a,b)=>a.r-b.r).map(x=>x.d);
  const out=[]; const cats={};
  const ROUTINE=new Set(['Morning','Commute','Work day','Home','Kitchen','Errands','Evening','Weekend','Habits','Health','Routine','Food','Work']);
  for(const d of pool){ if(out.length>=6) break; if(!ROUTINE.has(d.c)) continue; if((cats[d.c]||0)>=1) continue; cats[d.c]=(cats[d.c]||0)+1; out.push(d); }
  for(const d of pool){ if(out.length>=10) break; if(out.includes(d)||(cats[d.c]||0)>=2) continue; cats[d.c]=(cats[d.c]||0)+1; out.push(d); }
  for(const d of pool){ if(out.length>=10) break; if(!out.includes(d)) out.push(d); }
  const kinds=['phrasal','time','logic','words'];
  const bonus=out.map((d,i)=>{ const k=kinds[i%4]; const list=CHALL[k]; return k+':'+Math.floor(rnd()*list.length); });
  S.daily={date:key,ids:out.map(d=>d.id),bonus,idx:0,answered:{},correct:{},levels:{}};
  save(); return S.daily;
}
function bonusOf(code){ const [k,i]=code.split(':'); return CHALL[k][+i]; }

  <div id="res" style="margin-top:14px">${done?Q.results[Q.i].html:''}</div>`;
  $('#qPlay').onclick=()=>{stopSpeech();speak(it.q)};
  const sh=$('#qShow'); if(sh) sh.onclick=()=>{Q.showText=true;renderQuick()};
  const ta=$('#qAns'); if(ta){ ta.oninput=()=>Q.draft=ta.value; ta.onkeydown=e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();submitQ();} }; }
  const sd=$('#qSend'); if(sd) sd.onclick=()=>submitQ(false);
  const nx=$('#qNext'); if(nx) nx.onclick=()=>{Q.i++;Q.draft='';Q.showText=false;startQ();};
  if(!done){
    try{ta.focus({preventScroll:true})}catch(e){}
    TIMER=setInterval(()=>{
      if(route.name!=='quick'){clearTimer();return;}
      Q.left--; const tEl=$('#timer'),bEl=$('#timebar');
      if(tEl){tEl.textContent=Q.left+' s'; tEl.classList.toggle('hot',Q.left<=10);} if(bEl) bEl.style.width=(Q.left/S.quick.secs*100)+'%';
      if(Q.left<=0){ submitQ(true); }

function startQ(){ if(Q.i>=Q.items.length){renderQuick();return;} Q.phase='answer'; Q.left=S.quick.secs; renderQuick(); const it=Q.items[Q.i]; if(it) setTimeout(()=>speak(it.q),200); }
function submitQ(timeout){
  clearTimer(); const it=Q.items[Q.i]; const text=Q.draft||'';

  const m=c1Meter(text,r.a);
  let pts=0; if(text.trim()){ if(!r.a.errors.length) pts+=10; pts+=used*5; if(r.ok&&used===it.chs.length) pts+=Math.round(Q.left/3); if(m.level==='C1') pts+=5; }
  Q.score+=pts; Q.phase='done';

    <span class="muted" style="font-size:.88rem">${!text.trim()?'Sin respuesta. Lo importante es arrancar: di cualquier cosa, aunque sea corta.':`Retos cumplidos: ${used} de ${it.chs.length}${r.a.errors.length?' · revisa la gramática':' · gramática correcta'}`}</span></div>`;
  const chEx=`<div class="result" style="margin-top:10px"><span class="eyebrow">Cómo se usan</span><ul class="phr">${it.chs.map(c=>`<li><b>${esc(chLabel(c))}</b> (${esc(c.es)})${c.ex?': '+esc(c.ex):''}</li>`).join('')}</ul>${meterHTML(m)}${text.trim()?clarityHTML(clarity(text),true):''}</div>`;

  Q.results[Q.i]={pts,html:head+'<div style="margin-top:10px">'+body+'</div>'+chEx};

/* ---------- one idea per sentence + rescue phrases ---------- */
const SIM=SX.scenarios, RESCUE=SX.rescue, FRAME=SX.frame.map(f=>Object.assign({},f,{rx:new RegExp(f.re,'i')})), FRAME2=SX.frame2.map(f=>Object.assign({},f,{rx:new RegExp(f.re,'i')}));
let CUR_FRAME=FRAME;
function frameFor(sc){ return sc&&sc.frame==='spp'?FRAME2:FRAME; }
S.simDone=S.simDone||{};
function splitSentences(text){
  return text.replace(/\s+/g,' ').replace(/([.!?])\s*(?=[A-Za-z"“])/g,'$1\n').split(/\n+/).map(x=>x.trim()).filter(x=>/[A-Za-z]/.test(x));
}
function clarity(text,FR){
  FR=FR||FRAME; const spp=FR===FRAME2;
  const lines=text.split(/\n+/).flatMap(splitSentences);
  const sents=lines.map(s=>{
    const words=(s.match(/[A-Za-z']+/g)||[]).length;
    let clauses=1;
    try{ const a=G.analyze(s); clauses=Math.max(1,a.sentences.reduce((n,x)=>n+x.clauses.filter(c=>c.tense.length).length,0)); }catch(e){}
    const commas=(s.match(/,/g)||[]).length;
    const status=words>18||clauses>=3||commas>=3?'long':words>13||clauses===2?'ok':'good';
    return {s,words,clauses,status};
  });
  const frame={}; FR.forEach(f=>frame[f.k]=f.rx.test(text));
  const n=sents.length, avg=n?sents.reduce((a,x)=>a+x.words,0)/n:0;
  const longOnes=sents.filter(x=>x.status==='long');
  let score=0;
  if(n>=3) score++;
  if(n&&!longOnes.length) score++;
  if(n&&avg<=12) score++;
  if(spp){ if(frame.situation) score++; if(frame.problem) score++; if(frame.action) score++; }
  else { if(frame.goal) score++; if(frame.steps) score++; if(frame.benefit||frame.check) score++; }
  const label=score>=5?'Muy clara':score>=3?'Clara':'Mejorable';
  const tips=[];
  if(longOnes.length) tips.push(`Divide ${longOnes.length===1?'la frase marcada':'las frases marcadas'} en rojo: una idea por frase.`);
  if(n&&n<3) tips.push('Usa al menos 3 frases cortas en lugar de una larga.');
  if(spp){
    if(!frame.situation) tips.push('Empieza describiendo la situación: "The situation is that…".');
    if(!frame.problem) tips.push('Di claramente el problema: "The problem is that…".');
    if(!frame.action) tips.push('Termina con lo que hay que hacer: "What we need to do is…".');
  } else {
    if(!frame.goal) tips.push('Empieza con la idea principal: "Our goal is to…" o "The main point is…".');
    if(!frame.steps) tips.push('Ordena los pasos: "First, … Then, … Finally, …".');
    if(!frame.benefit&&!frame.check) tips.push('Cierra con el resultado ("This will help us…") o comprueba: "Does that make sense?".');
  }

  return {sents,frame,n,avg,score,label,tips,FR};
}
function clarityHTML(cl,compact){
  if(compact){
    const long=cl.sents.filter(x=>x.status==='long');
    return `<div class="clarity"><div class="c1top"><span class="eyebrow">Claridad: una idea por frase</span><span class="lvlpill ${long.length?'lv-B1':'lv-C1'}">${long.length?'Divide frases':'Clara'}</span></div>
      <ol class="sentlist">${cl.sents.map(x=>`<li class="${x.status}"><span class="sl-text">${esc(x.s)}</span><span class="sl-meta">${x.words} palabras${x.clauses>1?` · ${x.clauses} ideas`:''}</span></li>`).join('')}</ol>
      ${long.length?`<ul class="msgs"><li class="i">Divide la frase marcada en rojo en dos o tres frases cortas. Es más fácil de decir y de entender.</li></ul>`:''}</div>`;
  }
  return `<div class="clarity">
    <div class="c1top"><span class="eyebrow">Claridad: una idea por frase</span><span class="lvlpill ${cl.score>=5?'lv-C1':cl.score>=3?'lv-B2p':'lv-B1'}">${cl.label}</span></div>
    <div class="c1bars">${[0,1,2,3,4,5].map(i=>`<i class="${i<cl.score?'on':''}"></i>`).join('')}</div>
    ${compact?'':`<div class="frame">${(cl.FR||FRAME).map(f=>`<span class="fstep ${cl.frame[f.k]?'ok':''}"><small>${esc(f.label)}</small>${cl.frame[f.k]?'✓':esc(f.hint)}</span>`).join('')}</div>`}
    <ol class="sentlist">${cl.sents.map(x=>`<li class="${x.status}"><span class="sl-text">${esc(x.s)}</span><span class="sl-meta">${x.words} palabras${x.clauses>1?` · ${x.clauses} ideas`:''}</span></li>`).join('')}</ol>
    ${cl.tips.length?`<ul class="msgs">${cl.tips.slice(0,compact?2:4).map(t=>`<li class="i">${esc(t)}</li>`).join('')}</ul>`:''}
  </div>`;
}

const PHASES=[
  {id:'shadow',name:'Shadowing',from:0,to:8,desc:'Escucha un audio corto, revisa la transcripción y repítelo tres veces imitando el ritmo.'},
  {id:'rapid',name:'Respuestas rápidas',from:8,to:18,desc:'Responde en voz alta a 10 preguntas cotidianas, de 10 a 30 segundos cada una, sin escribir antes.'},
  {id:'free',name:'Hablar sin preparar',from:18,to:25,desc:'Grábate explicando algo de tu día durante dos minutos. Si te bloqueas, usa frases sencillas y continúa.'},
  {id:'fix',name:'Corregir y repetir',from:25,to:30,desc:'Identifica dos errores importantes, aprende la versión correcta y vuelve a decir las frases sin leerlas.'}

function pickFresh(kind,all,key){
  const used=S.sessUsed[kind]; let fresh=all.filter(x=>!used.includes(key(x)));
  if(!fresh.length){ S.sessUsed[kind]=[]; fresh=all.slice(); }
  const x=fresh[Math.floor(Math.random()*fresh.length)]; S.sessUsed[kind].push(key(x)); return x;
}
function pickRapid(n){
  const all=quickPool(); const used=new Set(S.sessUsed.rapid);
  let fresh=all.filter(q=>!used.has(q.q)); if(fresh.length<n){ S.sessUsed.rapid=[]; fresh=all.slice(); }
  const out=shuffle(fresh).slice(0,n); out.forEach(q=>S.sessUsed.rapid.push(q.q)); return out.map(q=>({q:q.q,es:q.es}));
}
function newSess(){
  const sh=pickFresh('shadow',SE.shadow,x=>x.id);
  const talk=pickFresh('talk',SE.talk,x=>x.q);
  const n=(S.sessCount||0)+1;
  return {date:dayKey(),num:n,phase:0,startedAt:null,phaseStart:null,shadow:{id:sh.id,step:0,rounds:0},rapid:{i:0,times:[],qs:pickRapid(10)},free:{talk:SE.talk.indexOf(talk),state:'idle',left:120},fix:{items:[{said:'',good:''},{said:'',good:''}],step:0,reps:0},done:false};
}
let SS=null;
function sess(){ if(!SS){ SS=S.sess&&S.sess.shadow?S.sess:newSess(); if(!SS.num) SS.num=(S.sessCount||0)+1; S.sess=SS; save(); } return SS; }
function startNewSession(){ SS=newSess(); S.sess=SS; save(); FT={running:false,t0:0,hint:0,audio:null}; RPS={}; go({name:'session'}); }

function phaseClock(){
  const s=sess(); const ph=PHASES[s.phase]; const dur=(ph.to-ph.from)*60;
  const el=s.phaseStart?(Date.now()-s.phaseStart)/1000:0;
  return {dur,el,left:dur-el,over:el>dur};
}

  const pc=phaseClock();
  view.innerHTML=`

    <div class="phases">${PHASES.map((p,k)=>`<button class="phase ${k===s.phase?'cur':k<s.phase?'done':''}" data-ph="${k}"><small>min ${p.from}–${p.to}</small><b>${esc(p.name)}</b></button>`).join('')}</div>
    <div class="timebar"><i id="phBar" style="width:${s.phaseStart?Math.min(100,pc.el/pc.dur*100):0}%"></i></div>
  </section>
