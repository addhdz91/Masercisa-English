    <p>${esc(ph.desc)}</p>
    ${!s.phaseStart?`<button class="btn primary" id="phStart" style="align-self:flex-start">Empezar fase (${ph.to-ph.from} min)</button>`:''}
    <div id="phBody"></div>
  </div>
  <div class="player-foot">
    ${s.phase>0?'<button class="btn" id="phPrev">← Fase anterior</button>':''}
    <button class="btn ${pc.over?'primary':''}" id="phNext">${s.phase<3?'Siguiente fase →':'Terminar sesión'}</button>
  </div>`;
  const body=$('#phBody');
  ({shadow:phShadow,rapid:phRapid,free:phFree,fix:phFix})[ph.id](body,s);
  const st=$('#phStart'); if(st) st.onclick=()=>{ s.phaseStart=Date.now(); if(!s.startedAt) s.startedAt=Date.now(); save(); renderSession(); };
  const pv=$('#phPrev'); if(pv) pv.onclick=()=>{ s.phase--; s.phaseStart=null; save(); stopSpeech(); renderSession(); window.scrollTo(0,0); };
  $('#phNext').onclick=()=>{ stopSpeech(); if(s.phase<3){ s.phase++; s.phaseStart=null; } else { if(!s.done){ s.done=true; S.sessDays[dayKey()]=sessionsToday()+1; S.sessCount=(S.sessCount||0)+1; if(typeof bumpActivity==='function') bumpActivity(1); if(typeof logH==='function') logH('session','Sesión nº '+s.num+' completada',true); } } save(); renderSession(); window.scrollTo(0,0); };
  view.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.ph; if(k===s.phase) return; stopSpeech(); s.phase=k; s.phaseStart=null; save(); renderSession(); });
  SESS_T=setInterval(()=>{
    if(route.name!=='session'){sessTimerStop();return;}
    if(typeof phTick==='function') phTick();
    if(!s.phaseStart) return;
    const c=phaseClock(); const el=$('#phClock'), bar=$('#phBar');
    if(el){ el.textContent=c.over?'+'+mmss(c.el-c.dur):mmss(c.left); el.classList.toggle('hot',c.over); }
    if(bar) bar.style.width=Math.min(100,c.el/c.dur*100)+'%';
    if(c.over){ const nb=$('#phNext'); if(nb&&!nb.classList.contains('primary')) nb.classList.add('primary'); }
  },1000);
}
let phTick=null;

/* phase 1: shadowing */
function phShadow(body,s){
  phTick=null;
  const sh=SE.shadow.find(x=>x.id===s.shadow.id)||SE.shadow[0];
  const st=s.shadow.step;
  const full=sh.lines.map(l=>l[0]).join(' ');
  body.innerHTML=`
  <div class="shadow-head"><h2>${esc(sh.title)}</h2>
    <label class="eyebrow" for="shSel">Cambiar audio</label>
    <select id="shSel" class="search">${SE.shadow.map(x=>`<option value="${x.id}" ${x.id===sh.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>
  <ol class="steps big">
    <li class="${st>0?'ok':st===0?'cur':''}"><b>Escúchalo una vez</b>, sin leer.</li>
    <li class="${st>1?'ok':st===1?'cur':''}"><b>Revisa la transcripción</b> y toca las palabras que no conozcas.</li>
    <li class="${st>2?'ok':st===2?'cur':''}"><b>Repítelo tres veces</b>: la app lee cada frase y te deja una pausa para que la digas a la vez o justo después, imitando el ritmo.</li>
  </ol>
  ${st===0?`<button class="bigplay" id="shListen">${IC_PLAY}<span>Escuchar el audio completo</span></button><button class="btn small" id="shSkip1">Ya lo he escuchado →</button>`:''}
  ${st>=1?`<div class="transcript">${sh.lines.map((l,k)=>`<p class="tline" data-k="${k}"><span class="en">${wordify(l[0])}</span>${S.shEs?`<span class="es">${esc(l[1])}</span>`:''}</p>`).join('')}</div>
    <div class="rowbtns"><button class="btn small" id="shEs">${S.shEs?'Ocultar':'Ver'} traducción</button><button class="btn small" id="shAgain">${IC_PLAY} Escuchar otra vez</button>${st===1?'<button class="btn small primary" id="shToRep">Empezar a repetir →</button>':''}</div>`:''}
  ${st>=2?`<div class="reps"><span class="eyebrow">Repeticiones</span><div class="repdots">${[1,2,3].map(n=>`<span class="repdot ${s.shadow.rounds>=n?'on':''}">${n}</span>`).join('')}</div>
    ${s.shadow.rounds<3?`<button class="bigplay" id="shRound">${IC_PLAY}<span>Repetición ${s.shadow.rounds+1} de 3 ${s.shadow.rounds===0?'(un poco más lento)':''}</span></button><button class="btn small" id="shStop">Parar</button>`:'<p class="feedback good">¡Hecho! Tres repeticiones completadas. Pasa a la siguiente fase.</p>'}
    <span class="muted" style="font-size:.84rem">Consejo: no busques entender cada palabra; copia la entonación, las pausas y las palabras que se unen ("get up" suena "geddup").</span></div>`:''}`;
  const sel=$('#shSel'); sel.onchange=()=>{ s.shadow={id:sel.value,step:0,rounds:0}; save(); stopSpeech(); renderSession(); };
  const L=$('#shListen'); if(L) L.onclick=async()=>{ stopSpeech(); await playLines(sh.lines.map(l=>l[0])); s.shadow.step=Math.max(1,s.shadow.step); save(); renderSession(); };
  const k1=$('#shSkip1'); if(k1) k1.onclick=()=>{ stopSpeech(); s.shadow.step=1; save(); renderSession(); };
  const es=$('#shEs'); if(es) es.onclick=()=>{ S.shEs=!S.shEs; save(); renderSession(); };
  const ag=$('#shAgain'); if(ag) ag.onclick=()=>{ stopSpeech(); playLines(sh.lines.map(l=>l[0])); };
  const tr=$('#shToRep'); if(tr) tr.onclick=()=>{ stopSpeech(); s.shadow.step=2; save(); renderSession(); };
  const stp=$('#shStop'); if(stp) stp.onclick=()=>{ SHR=false; stopSpeech(); view.querySelectorAll('.tline').forEach(x=>x.classList.remove('playing')); };
  const rd=$('#shRound'); if(rd) rd.onclick=async()=>{
    stopSpeech(); SHR=true; const rate=s.shadow.rounds===0?0.85:1;
    for(let k=0;k<sh.lines.length;k++){
      if(!SHR||route.name!=='session') return;
      const el=view.querySelector(`.tline[data-k="${k}"]`);
      view.querySelectorAll('.tline').forEach(x=>x.classList.remove('playing')); if(el){ el.classList.add('playing'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
      const t0=Date.now(); await speak(sh.lines[k][0],{rate}); const dur=Date.now()-t0;
      if(!SHR) return;
      await new Promise(r=>setTimeout(r,Math.max(1200,dur*1.15)));
    }
    if(!SHR) return; SHR=false;
    s.shadow.rounds=Math.min(3,s.shadow.rounds+1); save(); renderSession();
  };
}
let SHR=false;

/* phase 2: rapid answers */
let RPT=null;
function phRapid(body,s){
  const R2=s.rapid; if(!R2.qs){ R2.qs=pickRapid(10); save(); }
  if(R2.i>=R2.qs.length){
    const ok=R2.times.filter(t=>t>=10&&t<=30).length, avg=R2.times.length?Math.round(R2.times.reduce((a,b)=>a+b,0)/R2.times.length):0;
    phTick=null;
    body.innerHTML=`<p class="feedback good">¡10 respuestas hechas!</p><div class="stats"><div class="stat"><b>${avg} s</b><span>media por respuesta</span></div><div class="stat"><b>${ok}/10</b><span>entre 10 y 30 s</span></div><div class="stat"><b>${R2.times.filter(t=>t<10).length}</b><span>demasiado cortas</span></div></div>
    <span class="muted" style="font-size:.88rem">${avg<10?'Intenta alargar: añade un motivo (because…) o un ejemplo (for example…).':avg>30?'Bien de fluidez. Ahora intenta ir al grano: una idea por frase.':'Buen ritmo. Así se habla en una conversación real.'}</span>
    <button class="btn small" id="rpAgain">Otras 10 preguntas</button>`;
    $('#rpAgain').onclick=()=>{ s.rapid={i:0,times:[],qs:pickRapid(10)}; save(); renderSession(); };
    return;
  }
  const q=R2.qs[R2.i];
  body.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Pregunta ${R2.i+1} de 10</span><span class="timer" id="rpClock">0 s</span></div>
  <div class="talkbar"><i id="rpBar"></i><span class="mk m10" title="10 s"></span><span class="mk m30" title="30 s"></span></div>
  <div class="tb-legend"><span>0</span><span>10 s</span><span>30 s</span></div>
  <button class="bigplay" id="rpPlay">${IC_PLAY}<span>Escuchar la pregunta</span></button>
  ${S.earMode!==false&&!RPS.show?`<button class="btn small" id="rpShow">Mostrar texto</button>`:`<div class="q">${wordify(q.q)}</div>`}
  <p class="muted" style="font-size:.88rem">Habla en voz alta sin escribir. Pulsa <b>Empezar a hablar</b> y luego <b>Terminé</b>.</p>
  <div class="rowbtns">
    ${RPS.running?`<button class="btn primary" id="rpDone">Terminé</button>`:`<button class="btn primary" id="rpGo">Empezar a hablar</button>`}
    <button class="btn" id="rpSkip">Saltar</button>
  </div>`;
  const setBar=()=>{ const t=RPS.running?(Date.now()-RPS.t0)/1000:0; const c=$('#rpClock'), b=$('#rpBar'); if(c){ c.textContent=Math.floor(t)+' s'; c.classList.toggle('hot',t>30); } if(b){ b.style.width=Math.min(100,t/40*100)+'%'; b.className=t<10?'low':t<=30?'ok':'over'; } };
  phTick=setBar; setBar();
  if(!RPS.played){ RPS.played=true; setTimeout(()=>speak(q.q),250); }
  $('#rpPlay').onclick=()=>{ stopSpeech(); speak(q.q); };
  const sh=$('#rpShow'); if(sh) sh.onclick=()=>{ RPS.show=true; renderSession(); };
  const g=$('#rpGo'); if(g) g.onclick=()=>{ stopSpeech(); if(!s.phaseStart){ s.phaseStart=Date.now(); if(!s.startedAt) s.startedAt=Date.now(); save(); } RPS.running=true; RPS.t0=Date.now(); renderSession(); };
  const d=$('#rpDone'); if(d) d.onclick=()=>{ const t=Math.round((Date.now()-RPS.t0)/1000); R2.times.push(t); S.spoken=(S.spoken||0)+Math.min(t,90); R2.i++; RPS={}; save(); renderSession(); };
  $('#rpSkip').onclick=()=>{ R2.times.push(0); R2.i++; RPS={}; save(); renderSession(); };
}
let RPS={};

/* phase 3: free talk */
let FT={running:false,t0:0,hint:0,audio:null};
let REC=null;
function recStart(){
  try{ if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)) return;
    navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{ if(!FT.running){ st.getTracks().forEach(t=>t.stop()); return; }
      const mr=new MediaRecorder(st); const ch=[]; mr.ondataavailable=e=>{ if(e.data&&e.data.size) ch.push(e.data); };
      mr.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); if(ch.length){ try{ if(FT.audio) URL.revokeObjectURL(FT.audio); }catch(_){} FT.audio=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'})); FT.recorded=true; if(route.name==='session') renderSession(); } };
      mr.start(); REC=mr; FT.rec=true; const b=document.getElementById('ftRecDot'); if(b) b.hidden=false;
    }).catch(()=>{ FT.recFail=true; const b=document.getElementById('ftRecMsg'); if(b) b.textContent='No hay acceso al micrófono aquí: usa la grabadora del móvil.'; });
  }catch(e){}
}
function recStop(){ try{ if(REC&&REC.state!=='inactive') REC.stop(); }catch(e){} REC=null; FT.rec=false; }
function ftEnd(s){ if(FT.running){ const e=Math.min(150,(Date.now()-FT.t0)/1000); S.spoken=(S.spoken||0)+e; } FT.running=false; recStop(); }
function phFree(body,s){
  const t=SE.talk[s.free.talk]||SE.talk[0];
  const el=FT.running?(Date.now()-FT.t0)/1000:0, left=Math.max(0,120-el);
  body.innerHTML=`
  <div class="talk-topic"><span class="eyebrow">Tema</span><h2>${esc(t.q)}</h2><span class="es">${esc(t.es)}</span>
    <button class="btn small" id="ftOther">Otro tema</button></div>
  <ol class="steps"><li>Pulsa <b>Empezar 2 minutos</b> y habla sin parar. La app intenta grabarte (te pedirá permiso para el micrófono).</li><li>Si te bloqueas, usa una frase sencilla y continúa.</li><li>Al terminar, escúchate aquí mismo. Si no se pudo grabar, usa la grabadora del móvil y sube el audio (no sale de tu dispositivo).</li></ol>
  <div class="bigclock"><span class="timer ${FT.running&&left<=15?'hot':''}" id="ftClock">${mmss(FT.running?left:120)}</span><span class="recdot" id="ftRecDot" ${FT.rec?'':'hidden'}>● grabando</span></div><span class="muted" id="ftRecMsg" style="font-size:.84rem">${FT.recFail?'No hay acceso al micrófono aquí: usa la grabadora del móvil.':''}</span>
  <div class="hintbox"><span class="eyebrow">Si te quedas en blanco, sigue con…</span><b id="ftHint">${esc(t.help[FT.hint%t.help.length])}</b></div>
  <div class="rowbtns">${FT.running?'<button class="btn" id="ftStop">Parar</button>':'<button class="btn primary" id="ftGo">Empezar 2 minutos</button>'}<button class="btn small" id="ftNextHint">Otra ayuda</button></div>
  <div class="upload"><label class="eyebrow" for="ftFile">${FT.recorded?'Tu grabación':'Escucha tu grabación (o sube un audio)'}</label><input type="file" id="ftFile" accept="audio/*,video/*">
    ${FT.audio?`<audio controls src="${FT.audio}" style="width:100%"></audio><span class="muted" style="font-size:.84rem">Escucha y apunta dos errores para la siguiente fase.</span>`:''}</div>`;
  phTick=()=>{
    if(!FT.running) return;
    const e=(Date.now()-FT.t0)/1000, l=Math.max(0,120-e); const c=$('#ftClock'); if(c){ c.textContent=mmss(l); c.classList.toggle('hot',l<=15); }
    const hi=Math.floor(e/20); if(hi!==FT.hintAuto){ FT.hintAuto=hi; FT.hint=hi; const h=$('#ftHint'); if(h) h.textContent=t.help[hi%t.help.length]; }
    if(l<=0){ ftEnd(s); s.free.state='done'; save(); renderSession(); }
  };
  $('#ftOther').onclick=()=>{ const t=pickFresh('talk',SE.talk,x=>x.q); s.free.talk=SE.talk.indexOf(t); FT.hint=0; save(); renderSession(); };
  const g=$('#ftGo'); if(g) g.onclick=()=>{ if(!s.phaseStart){ s.phaseStart=Date.now(); if(!s.startedAt) s.startedAt=Date.now(); save(); } FT.running=true; FT.t0=Date.now(); FT.hint=0; FT.hintAuto=0; FT.recFail=false; recStart(); renderSession(); };
  const sp=$('#ftStop'); if(sp) sp.onclick=()=>{ ftEnd(s); save(); renderSession(); };
  $('#ftNextHint').onclick=()=>{ FT.hint++; const h=$('#ftHint'); if(h) h.textContent=t.help[FT.hint%t.help.length]; };
  $('#ftFile').onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; try{ if(FT.audio) URL.revokeObjectURL(FT.audio); }catch(_){} FT.audio=URL.createObjectURL(f); renderSession(); };
}

/* phase 4: fix & repeat */
function phFix(body,s){
  phTick=null;
  const F=s.fix;
  body.innerHTML=`
  <ol class="steps"><li>Escribe <b>dos frases</b> que dijiste y que crees que tenían errores (escúchate en la grabación).</li><li>Pulsa <b>Corregir</b> y escribe la versión correcta.</li><li>Pulsa <b>Repetir sin leer</b>: las frases se ocultan y las dices de memoria.</li></ol>
  ${F.items.map((it,k)=>{ const a=it.said.trim()?G.analyze(it.said):null; return `
  <div class="fixcard">
    <span class="eyebrow">Error ${k+1}</span>
    <label class="eyebrow" for="fxSaid${k}">Lo que dije</label>
    <input class="search" id="fxSaid${k}" value="${esc(it.said)}" placeholder="Ej.: Yesterday I go to the office and I am agree with my boss." autocomplete="off">
    ${a?(a.errors.length?`<ul class="msgs">${a.errors.map(e=>`<li class="e"><span>${esc(e.msg)}</span>${e.fix?`<span class="fix">→ ${esc(e.fix)}</span>`:''}</li>`).join('')}</ul>`:'<span class="feedback meh">No detecto errores de gramática. Si sabes cuál era el fallo, escribe tú la versión correcta, o elige un error típico abajo.</span>'):''}
    <label class="eyebrow" for="fxGood${k}">Versión correcta</label>
    <input class="search" id="fxGood${k}" value="${esc(it.good)}" placeholder="Escribe la frase corregida" autocomplete="off">
    ${it.good.trim()&&G.analyze(it.good).errors.length?`<span class="feedback bad">La versión corregida todavía tiene un problema: ${esc(G.analyze(it.good).errors[0].msg)}</span>`:''}
    <div class="rowbtns"><button class="btn small" data-fxcheck="${k}">Corregir</button>${it.good.trim()?`<button class="btn small" data-fxsay="${k}">${IC_PLAY} Escuchar</button>`:''}</div>
  </div>`;}).join('')}
  <details class="vocab"><summary>Errores típicos de hispanohablantes (toca uno para usarlo)</summary>
    <div class="commons">${SE.common.map((c,k)=>`<button class="common" data-cm="${k}"><s>${esc(c.bad)}</s><b>${esc(c.good)}</b><small>${esc(c.why)}</small></button>`).join('')}</div></details>
  ${F.items.every(x=>x.good.trim())?`<div class="repeat">
    <span class="eyebrow">Repetir sin leer · ${F.reps}/3</span>
    ${F.step===1?`<p class="hidden-lines">${F.items.map((x,k)=>`<span>Frase ${k+1}: <i>${esc(x.good.split(' ').map(w=>w[0]+'…').join(' '))}</i></span>`).join('')}</p><div class="rowbtns"><button class="btn primary" id="fxReveal">Comprobar</button></div>`:
      F.step===2?`<ol class="model-lines">${F.items.map(x=>`<li>${wordify(x.good)}</li>`).join('')}</ol><div class="rowbtns">${F.reps<3?'<button class="btn primary" id="fxAgain">Otra vez sin leer</button>':''}</div>${F.reps>=3?'<p class="feedback good">¡Perfecto! Las tienes guardadas en "Mis errores" para repasarlas otro día.</p>':''}`:
      `<button class="btn primary" id="fxStart">Repetir sin leer</button>`}
  </div>`:''}
  ${S.myErrors.length?`<details class="vocab"><summary>Mis errores guardados (${S.myErrors.length})</summary><ul class="phr">${S.myErrors.slice(-20).reverse().map(e=>`<li><s>${esc(e.said)}</s> → <b>${esc(e.good)}</b></li>`).join('')}</ul></details>`:''}`;
  F.items.forEach((it,k)=>{
    $('#fxSaid'+k).oninput=e=>{ it.said=e.target.value; save(); };
    $('#fxGood'+k).oninput=e=>{ it.good=e.target.value; save(); };
  });
  body.querySelectorAll('[data-fxcheck]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.fxcheck; const it=F.items[k]; if(!it.good.trim()){ const a=G.analyze(it.said); const fx=a.errors.find(e=>e.fix&&!/…/.test(e.fix)); if(fx) it.good=fx.fix; } save(); renderSession(); });
  body.querySelectorAll('[data-fxsay]').forEach(b=>b.onclick=()=>{ stopSpeech(); speak(F.items[+b.dataset.fxsay].good); });
  body.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ const c=SE.common[+b.dataset.cm]; const slot=F.items.find(x=>!x.said.trim()&&!x.good.trim())||F.items[1]; slot.said=c.bad; slot.good=c.good; save(); renderSession(); });
  const st=$('#fxStart'); if(st) st.onclick=()=>{ F.step=1; save(); renderSession(); };
  const rv=$('#fxReveal'); if(rv) rv.onclick=()=>{ F.step=2; F.reps=Math.min(3,F.reps+1); if(F.reps===1) F.items.forEach(x=>{ if(!S.myErrors.some(e=>e.good===x.good)) S.myErrors.push({said:x.said,good:x.good,date:s.date}); if(typeof addKnownError==='function') addKnownError(x.said.trim(),x.good.trim(),'session'); }); save(); renderSession(); playLines(F.items.map(x=>x.good)); };
  const ag=$('#fxAgain'); if(ag) ag.onclick=()=>{ F.step=1; save(); renderSession(); };
}
function renderSessionEnd(){
  const s=sess(); const total=S.sessCount||0; const today=sessionsToday();
  const leftSh=SE.shadow.length-S.sessUsed.shadow.length, leftTk=SE.talk.length-S.sessUsed.talk.length;
  view.innerHTML=`<section class="hero"><span class="eyebrow">Sesión nº ${s.num} completada</span><h1>¡Hecho! ${total} ${total===1?'sesión':'sesiones'} en total${today>1?`, ${today} hoy`:''}.</h1>
  <p>Has hecho shadowing, ${s.rapid.times?s.rapid.times.filter(t=>t>0).length:0} respuestas rápidas, dos minutos hablando sin preparar y has corregido dos errores.</p>

/* ---------- feedback (market research) ---------- */
const FB_PARTS=['Reto diario','Sesión de 30 minutos','Una idea por frase','Modo sorpresa','Gimnasio de tiempos','Palabras','Conversaciones','Botón "Me quedé en blanco"'];
S.fb=S.fb||{level:'',parts:[],best:'',stars:0,nps:-1,daily:'',pay:'',improve:'',missing:'',age:'',goal:''};
let COMMENTS=undefined, IS_OWNER=false;
(async()=>{ try{ if(window.claude&&claude.use){ const c=await claude.use('comments'); COMMENTS=c; const u=await claude.use('user'); IS_OWNER=u?await u.isOwner():false; if(route.name==='feedback') renderFeedback(); } else COMMENTS=null; }catch(e){ COMMENTS=null; } })();
function fbSummary(){

function chips(name,opts,val,multi){

}

/* ---------- adaptive learning: error memory, weak tenses, progress, backup, native bridge ---------- */
S.errBank=S.errBank||[]; S.tStats=S.tStats||{}; S.activity=S.activity||{}; S.reminder=S.reminder||{on:false,h:20,m:0}; S.hist=S.hist||[];
const SRC_ES={daily:'Reto diario',quick:'Modo sorpresa',gym:'Gimnasio de tiempos',simple:'Una idea por frase',session:'Sesión de 30 min',review:'Repaso de errores',words:'Palabras'};
function logH(k,detail,ok){ try{ S.hist.push({t:Date.now(),k,d:String(detail||'').slice(0,240),ok:ok===undefined?null:!!ok}); if(S.hist.length>3000) S.hist=S.hist.slice(-3000); }catch(e){} }
/* welcome back after a long break */
const AWAY=(()=>{ const last=S.lastSeen||0; const now=Date.now(); const gap=last?Math.floor((now-last)/DAY):0; S.lastSeen=now; try{save();}catch(e){} return gap; })();
const ERR_CATS=[
  {k:'be',name:'Verbo to be',rx:/to be|"am"|"is"|"are"|"was"|"were"|Falta el verbo/i},
  {k:'aux',name:'Auxiliares do / does / did',rx:/"do"|"does"|"did"|auxiliar/i},
  {k:'s3',name:'Tercera persona (-s)',rx:/lleva -s|no lleva -s|3\.ª persona/i},
  {k:'have',name:'Have / has y participios',rx:/"have"|"has"|participio/i},
  {k:'tense',name:'Tiempo verbal y marcadores',rx:/marcador|pasado simple|presente perfecto|since|Aquí tienes que usar/i},
  {k:'q',name:'Preguntas',rx:/pregunta/i},
  {k:'subj',name:'Sujeto',rx:/sujeto/i},
  {k:'modal',name:'Modales (can, will, must…)',rx:/modal|forma base|going to/i},
  {k:'agree',name:'Concordancia',rx:/Concordancia|plural|singular/i},
  {k:'expr',name:'Expresiones (agree, explain, home…)',rx:/Se dice|se usa -ed|no lleva "to"|explain|want/i}
];
function errCat(msg){ const c=ERR_CATS.find(c=>c.rx.test(msg)); return c?c.k:'other'; }
function catName(k){ const c=ERR_CATS.find(c=>c.k===k); return c?c.name:'Otros'; }
function bumpActivity(n){ const k=dayKey(); S.activity[k]=(S.activity[k]||0)+(n||1); }
function learnFrom(text, r, ctx){
  try{
    ctx=ctx||{}; bumpActivity(1);
    const a=r&&r.a; if(!a) return;
    logH(ctx.src||'daily',ctx.label||text,!!r.ok||!a.errors.length&&!(r.issues||[]).length);
    if(ctx.tense&&ctx.tense.length){ const ok=!!r.ok||(!a.errors.length&&!(r.issues||[]).some(i=>i.tense)); ctx.tense.forEach(t=>{ const s=S.tStats[t]=S.tStats[t]||{ok:0,n:0}; s.n++; if(ok) s.ok++; }); }
    a.sentences.forEach(s=>{
      const errs=[]; s.clauses.forEach(c=>c.errors.forEach(e=>errs.push(e)));
      if(!errs.length) return;
      const sent=(s.text||'').trim(); if(sent.length<3) return;
      if(S.errBank.some(x=>x.bad===sent&&!x.done)) return;
      const e=errs[0];
      S.errBank.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),bad:sent,msg:e.msg,fix:e.fix||'',cat:errCat(e.msg),box:0,due:Date.now()+6*3600e3,src:ctx.src||'',date:dayKey(),done:false,good:''});
    });
    a.errors.filter(e=>/^(Para cómo|Se dice|"Home"|"People"|"News"|"Discuss"|Con "since")/.test(e.msg)).forEach(e=>{
      const hit=a.sentences.find(s=>{ try{ return G.analyze(s.text).errors.some(x=>x.msg===e.msg); }catch(_){ return false; } });
      const sent=(hit?hit.text:text).trim().slice(0,160);
      const ex=S.errBank.find(x=>x.bad===sent&&!x.done); if(ex){ if(ex.msg.indexOf(e.msg)<0) ex.msg+=' · '+e.msg; return; } if(S.errBank.some(x=>x.bad===sent&&!x.done)) return;
      S.errBank.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),bad:sent,msg:e.msg,fix:'',cat:errCat(e.msg),box:0,due:Date.now()+6*3600e3,src:ctx.src||'',date:dayKey(),done:false,good:''});
    });
    if(S.errBank.length>400) S.errBank=S.errBank.filter(x=>!x.done).slice(-400);
    save();
  }catch(e){}
}
function addKnownError(bad,good,src){
  if(!bad||!good) return; if(S.errBank.some(x=>x.bad===bad&&!x.done)) return;
  const a=G.analyze(bad); const e=a.errors[0];
  S.errBank.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),bad,msg:e?e.msg:'Corrección guardada en tu sesión.',fix:e&&e.fix||'',cat:e?errCat(e.msg):'other',box:0,due:Date.now()+20*3600e3,src:src||'session',date:dayKey(),done:false,good});
  save();
}
function dueErrors(){ const now=Date.now(); return S.errBank.filter(x=>!x.done&&x.due<=now); }
function weakness(t){ const s=S.tStats[t]||{ok:0,n:0}; const g=(S.gym&&S.gym[t])||{a:0,c:0}; const ok=s.ok+g.c, n=s.n+g.a; return 1-((ok+2)/(n+3)); }
function weakTenses(){ return Object.keys(TBY).map(t=>({t,w:weakness(t),n:((S.tStats[t]||{}).n||0)+(((S.gym||{})[t]||{}).a||0)})).sort((a,b)=>b.w-a.w); }

/* review runner */
let RV=null;
function startReview(items){ RV={items:items.slice(0,12),i:0,draft:'',last:null,ok:0}; go({name:'review'}); }
function renderReview(){
  if(!RV){ const d=dueErrors(); if(!d.length){ renderReviewEmpty(); return; } RV={items:d.slice(0,12),i:0,draft:'',last:null,ok:0}; }
  if(RV.i>=RV.items.length){
    view.innerHTML=`<section class="hero"><span class="eyebrow">Repaso de tus errores</span><h1>${RV.ok} de ${RV.items.length} corregidas a la primera</h1>
    <p>Las que fallaste vuelven pronto; las que aciertas se espacian (1, 3, 7 y 16 días) hasta que las dominas.</p>
    <div class="rowbtns"><button class="btn primary" id="rvHome">Volver al inicio</button><button class="btn" id="rvProg">Ver mi progreso</button></div></section>`;
    $('#rvHome').onclick=()=>{RV=null;go({name:'home'})}; $('#rvProg').onclick=()=>{RV=null;go({name:'progress'})}; return;
  }
  const it=RV.items[RV.i];
  view.innerHTML=`
  <section class="player-head"><span class="eyebrow">Repaso de tus errores · ${RV.i+1} de ${RV.items.length} · ${esc(catName(it.cat))}</span>
  <div class="progress-line">${RV.items.map((x,k)=>`<i class="${k<RV.i?'ok':k===RV.i?'cur':''}"></i>`).join('')}</div></section>
  <div class="prompt">
    <span class="eyebrow">Esto lo escribiste tú${it.date?` (${esc(it.date)})`:''}</span>
    <p class="badline">${esc(it.bad)}</p>
    <div class="note"><b>Pista:</b> ${esc(it.msg)}</div>
    <label class="eyebrow" for="rvAns">Escríbela bien (y dila en voz alta)</label>
    <textarea class="answer" id="rvAns" spellcheck="false" autocapitalize="sentences">${esc(RV.draft)}</textarea>
    <div class="rowbtns">
      ${RV.last?`<button class="btn primary" id="rvNext">Siguiente →</button>`:`<button class="btn primary" id="rvCheck">Comprobar</button><button class="btn" id="rvSkip">No lo sé</button>`}
    </div>
  </div>
  <div id="res" style="margin-top:14px">${RV.last||''}</div>`;
  const ta=$('#rvAns'); ta.oninput=()=>RV.draft=ta.value;
  ta.onkeydown=e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault(); const b=$('#rvCheck'); if(b) b.click();} };
  const grade=(ok,txt)=>{
    if(ok){ it.box=Math.min(4,it.box+1); it.due=Date.now()+[1,3,7,16,35][it.box]*DAY; if(it.box>=4) it.done=true; if(txt) it.good=txt; RV.ok+=RV.firstTry!==false?1:0; }
    else { it.box=0; it.due=Date.now()+20*3600e3; }
    bumpActivity(1); logH('review',it.bad,ok); save();
  };
  const ck=$('#rvCheck'); if(ck) ck.onclick=()=>{
    const txt=ta.value.trim(); if(!txt) return;
    const a=G.analyze(txt); const same=norm(txt).join(' ')===norm(it.bad).join(' ');
    const sim=similarity(txt,it.good||it.bad); const off=!it.good&&sim<0.4; const ok=!a.errors.length&&!same&&!off;
    grade(ok,txt);
    const model=it.good||(it.fix&&!/…/.test(it.fix)?it.fix:'');
    RV.last=`<div class="result ${ok?'good':'bad'}"><span class="verdict ${ok?'good':'bad'}">${ok?'¡Bien corregida!':same?'Es la misma frase: cambia lo que falla.':off&&!a.errors.length?'Mantén la misma idea: corrige esa frase, no escribas otra.':'Todavía hay un problema'}</span>
      ${!ok&&a.errors.length?`<ul class="msgs">${a.errors.map(e=>`<li class="e"><span>${esc(e.msg)}</span>${e.fix?`<span class="fix">→ ${esc(e.fix)}</span>`:''}</li>`).join('')}</ul>`:''}
      ${model?`<div class="model"><span class="eyebrow">Versión correcta</span><br>${wordify(model)}</div>`:''}
      <span class="muted" style="font-size:.85rem">${ok?(it.done?'Dominada: ya no volverá.':`Volverá en ${[1,3,7,16,35][it.box]} día(s).`):'Volverá mañana.'}</span></div>`;
    if(ok) speak(txt);
    renderReview();
  };
  const sk=$('#rvSkip'); if(sk) sk.onclick=()=>{ grade(false); const model=it.good||it.fix||''; RV.last=`<div class="result bad"><span class="verdict bad">Sin problema: la repasaremos mañana</span>${model?`<div class="model"><span class="eyebrow">Pista de corrección</span><br>${esc(model)}</div>`:''}<span class="muted" style="font-size:.85rem">${esc(it.msg)}</span></div>`; renderReview(); };
  const nx=$('#rvNext'); if(nx) nx.onclick=()=>{ RV.i++; RV.draft=''; RV.last=null; renderReview(); window.scrollTo(0,0); };
}
function renderReviewEmpty(){
  const pend=S.errBank.filter(x=>!x.done);
  view.innerHTML=`<section class="hero"><span class="eyebrow">Repaso de tus errores</span><h1>No tienes repasos pendientes ahora</h1>
  <p>${pend.length?`Tienes ${pend.length} errores en seguimiento; volverán cuando toque.`:'Cada vez que el corrector detecte un error en tus respuestas, se guardará aquí para repasarlo.'}</p>
  <div class="rowbtns">${pend.length?'<button class="btn" id="rvAll">Repasar ahora igualmente</button>':''}<button class="btn primary" id="rvGo">Hacer el reto de hoy</button></div></section>`;
  const al=$('#rvAll'); if(al) al.onclick=()=>startReview(pend.slice().sort((a,b)=>a.due-b.due));
  $('#rvGo').onclick=()=>go({name:'daily'});
}

  const maxN=Math.max(5,...days.map(d=>d.n));

  const hm=$('#histMore'); if(hm) hm.onclick=()=>{ $('#histBox').innerHTML=histHTML(120); };
  renderPerms();
  view.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{ S.theme=b.dataset.themeSet; save(); applyTheme(); view.querySelectorAll('[data-theme-set]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  $('#pgRev').onclick=()=>{ const d=dueErrors(); startReview(d.length?d:S.errBank.filter(x=>!x.done).sort((a,b)=>a.due-b.due)); };
  $('#pgWeak').onclick=()=>{ const two=wt.slice(0,2).map(x=>x.t); const items=shuffle(ITEMS.filter(x=>two.includes(x.t))).slice(0,10); startRun(items,'Mis tiempos débiles'); };
  const ro=$('#remOn'); if(ro){ const apply=()=>{ const [h,m]=($('#remTime').value||'20:00').split(':').map(Number); S.reminder={on:ro.checked,h,m}; save(); try{ if(ro.checked) window.AndroidApp.askNotifications(); const ok=window.AndroidApp.setReminder(h,m,ro.checked); $('#remMsg').textContent=ok?(ro.checked?` Listo: te avisaré a las ${$('#remTime').value}.`:' Recordatorio desactivado.'):' No se pudo programar.'; }catch(e){} }; ro.onchange=apply; $('#remTime').onchange=apply; }
  $('#bkOut').onclick=()=>{
    const data=JSON.stringify({app:'small-talk-club',v:1,date:new Date().toISOString(),S});
    if(window.AndroidApp&&window.AndroidApp.shareText){ try{ window.AndroidApp.shareText('Copia Small Talk Club '+dayKey(),data); return; }catch(e){} }
    $('#bkArea').innerHTML=`<textarea class="answer" id="bkText" readonly style="min-height:90px;font-family:var(--f-mono);font-size:.7rem">${esc(data)}</textarea><span class="feedback" id="bkMsg"></span>`;
    const t=$('#bkText'); t.focus(); t.select();
    (navigator.clipboard?navigator.clipboard.writeText(data):Promise.reject()).then(()=>{const m=$('#bkMsg'); if(m) m.textContent='Copiada. Pégala en un mensaje para guardarla.';}).catch(()=>{ const m=$('#bkMsg'); if(m) m.textContent='Texto seleccionado: cópialo y guárdalo.'; });
  };
  $('#bkIn').onclick=()=>{
    $('#bkArea').innerHTML=`<label class="eyebrow" for="bkPaste">Pega aquí tu copia</label><textarea class="answer" id="bkPaste" style="min-height:90px"></textarea><div class="rowbtns"><button class="btn primary" id="bkDo">Restaurar</button></div><span class="feedback" id="bkMsg"></span>`;
    $('#bkDo').onclick=()=>{
      try{ const o=JSON.parse($('#bkPaste').value.trim()); if(!o||o.app!=='small-talk-club'||!o.S) throw 0;
        if(!$('#bkDo').dataset.sure){ $('#bkDo').dataset.sure='1'; $('#bkDo').textContent='Confirmar: sustituir mi progreso actual'; $('#bkMsg').textContent='Esto reemplaza el progreso de este dispositivo.'; return; }
        Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,o.S); save(); SS=null; $('#bkMsg').className='feedback good'; $('#bkMsg').textContent='Copia restaurada.'; setTimeout(()=>go({name:'home'}),600);
      }catch(e){ $('#bkMsg').className='feedback bad'; $('#bkMsg').textContent='Ese texto no es una copia válida de la app.'; }
    };
  };
}

function histHTML(days){
  if(!S.hist.length) return '<p class="muted">Aquí aparecerá todo lo que hagas: retos, sesiones, repasos y ejercicios, día a día.</p>';
  const by={}; S.hist.forEach(h=>{ const k=dayKey(new Date(h.t)); (by[k]=by[k]||[]).push(h); });
  const keys=Object.keys(by).sort().reverse(); const show=keys.slice(0,days);
  return `<div class="hist">${show.map(k=>{ const L=by[k]; const cnt={}; L.forEach(h=>cnt[h.k]=(cnt[h.k]||0)+1); const okN=L.filter(h=>h.ok).length, chk=L.filter(h=>h.ok!==null).length;
    const dt=new Date(k+'T12:00:00');
    return `<details class="hday"><summary><b>${esc(dt.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'short'}))}</b><span class="muted">${Object.entries(cnt).map(([kk,n])=>`${esc(SRC_ES[kk]||kk)} ×${n}`).join(' · ')}${chk?` · ${okN}/${chk} sin errores`:''}</span></summary>
      <ul class="hlist">${L.slice().reverse().map(h=>`<li><span class="htime">${new Date(h.t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</span><span class="htag">${esc(SRC_ES[h.k]||h.k)}</span><span class="htxt">${esc(h.d)}</span>${h.ok===null?'':`<span class="hok ${h.ok?'good':'bad'}">${h.ok?'✓':'✗'}</span>`}</li>`).join('')}</ul></details>`; }).join('')}</div>
    ${keys.length>days?`<button class="btn small" id="histMore">Ver todo el historial (${keys.length} días)</button>`:''}`;
}
function renderPerms(){
  const box=$('#permBox'); if(!box||!window.AndroidApp||!window.AndroidApp.permissions) return;
  let p={}; try{ p=JSON.parse(window.AndroidApp.permissions()); }catch(e){}
  box.innerHTML=`<div class="permrow"><span>🎙️ Micrófono (grabarte al hablar)</span>${p.mic?'<b class="good">Activado</b>':'<button class="btn small" id="pMic">Activar</button>'}</div>
  <div class="permrow"><span>🔔 Notificaciones (recordatorio y "no te rindas" si pasas 6 días sin practicar)</span>${p.notif?'<b class="good">Activadas</b>':'<button class="btn small" id="pNot">Activar</button>'}</div>
  <span class="muted" style="font-size:.8rem">Si un permiso no se activa, ve a Ajustes del móvil → Apps → Small Talk Club → Permisos.</span>`;
  const m=$('#pMic'); if(m) m.onclick=()=>{ try{window.AndroidApp.askMic();}catch(e){} setTimeout(renderPerms,4000); };
  const n=$('#pNot'); if(n) n.onclick=()=>{ try{window.AndroidApp.askNotifications();}catch(e){} setTimeout(renderPerms,4000); };
}

/* ---------- native bridge (APK) ---------- */
(function(){
  const A=window.AndroidApp; if(!A) return;
  const pend={}; let seq=0;
  window.__ttsDone=id=>{ const f=pend[id]; if(f){ delete pend[id]; f(); } };
  window.__ttsReady=()=>{};
  speak=function(text,opts={}){ return new Promise(res=>{ const id='u'+(++seq); let done=false; const fin=()=>{ if(!done){ done=true; clearTimeout(tm); delete pend[id]; res(); } }; pend[id]=fin; const tm=setTimeout(fin, Math.max(4000, text.length*120/(S.speed*(opts.rate||1)))); try{ A.speak(String(text), S.speed*(opts.rate||1), id); }catch(e){ fin(); } }); };
  stopSpeech=function(){ try{ A.stop(); }catch(e){} Object.keys(pend).forEach(k=>{ const f=pend[k]; delete pend[k]; f&&f(); }); };
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&route.name==='progress') renderPerms(); });
  window.appBack=function(){
    const sh=document.getElementById('rescueSheet'); if(sh&&!sh.hidden){ closeRescue(); return true; }
    const pop=document.getElementById('pop'); if(pop&&!pop.hidden){ pop.hidden=true; return true; }
    if(route.name==='home') return false;
    const b=document.getElementById('backBtn'); if(b&&!b.hidden){ b.click(); return true; }
    go({name:'home'}); return true;
  };
  try{ if(S.reminder&&S.reminder.on) A.setReminder(S.reminder.h,S.reminder.m,true); }catch(e){}
})();

render();
</script>
